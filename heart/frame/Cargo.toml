# Defines the `heart-frame` package and its explicit dependency boundary.
# The crate exists to encode canonical bounded frames into caller-owned storage.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-frame"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-identity = { path = "../identity" }
heart-schema = { path = "../schema" }
strum.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
