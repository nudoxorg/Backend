# Defines the `heart-adaptive` package and its explicit dependency boundary.
# The crate exists to choose local or remote execution from typed resource and consistency facts.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-adaptive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[dependencies]
heart-identity = { path = "../identity" }
server-index-vocabulary = { path = "../../server/index/vocabulary" }
strum.workspace = true

[lib]
path = "lib.rs"
