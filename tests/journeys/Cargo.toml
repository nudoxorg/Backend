rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
backend-library = { path = "../../crates/library" }
backend-semantic = { path = "../../crates/semantic" }
backend-store = { path = "../../crates/store" }
backend-version = { path = "../../crates/version" }
backend-cli = { path = "../../apps/cli" }
backend-mcp = { path = "../../apps/mcp" }
backend-present = { path = "../../crates/present" }
backend-engine = { path = "../../crates/engine" }
