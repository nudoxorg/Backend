backend-replication = { path = "../../crates/replication" }
backend-client = { path = "../../crates/client" }
backend-locald = { package = "backend-local-service", path = "../../crates/local-service" }
backend-runtime = { path = "../../crates/runtime" }
backend-worker = { path = "../../apps/worker" }
backend-desktop = { path = "../../apps/desktop" }
backend-extension-turso = { path = "../../extensions/turso" }
backend-compile = { path = "../../crates/compile" }
backend-frontend-clang = { path = "../../frontends/clang" }
