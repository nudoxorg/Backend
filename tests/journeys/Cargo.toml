[package]
name = "backend-journeys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["extended-journeys", "gui"]
extended-journeys = [
    "backend-locald/cluster-process-journey-hooks",
    "dep:backend-semantic",
    "dep:backend-store",
    "dep:backend-version",
    "dep:backend-present",
    "dep:backend-engine",
    "dep:backend-execution",
    "dep:backend-replication",
    "dep:backend-runtime",
    "dep:backend-worker",
    "dep:backend-extension-turso",
    "dep:backend-store-s3",
    "dep:backend-compile",
    "dep:backend-frontend-clang",
    "dep:backend-frontend-csharp",
    "dep:backend-frontend-go",
    "dep:backend-frontend-java",
    "dep:backend-frontend-python",
    "dep:backend-frontend-rust",
    "dep:backend-frontend-typescript",
    "dep:blake3",
    "dep:flate2",
    "dep:serde",
    "dep:tokio",
]
gui = ["dep:backend-desktop", "dep:backend-gui-harness"]

[dependencies]
backend-library = { path = "../../crates/library" }
backend-semantic = { path = "../../crates/semantic", optional = true }
backend-store = { path = "../../crates/store", optional = true }
backend-version = { path = "../../crates/version", optional = true }
backend-cli = { path = "../../apps/cli" }
backend-mcp = { path = "../../apps/mcp" }
backend-present = { path = "../../crates/present", optional = true }
backend-engine = { path = "../../crates/engine", optional = true }
backend-execution = { path = "../../crates/execution", optional = true }
backend-replication = { path = "../../crates/replication", optional = true }
backend-client = { path = "../../crates/client" }
backend-locald = { package = "backend-local-service", path = "../../crates/local-service" }
backend-runtime = { path = "../../crates/runtime", optional = true }
backend-worker = { path = "../../apps/worker", optional = true }
backend-desktop = { path = "../../apps/desktop", features = ["visual-harness"], optional = true }
backend-gui-harness = { path = "../../tools/gui-harness", optional = true }
backend-extension-turso = { path = "../../extensions/turso", optional = true }
backend-store-s3 = { path = "../../crates/store-s3", features = ["test-support"], optional = true }
backend-compile = { path = "../../crates/compile", optional = true }
backend-frontend-clang = { path = "../../frontends/clang", optional = true }
backend-frontend-csharp = { path = "../../frontends/csharp", optional = true }
backend-frontend-go = { path = "../../frontends/go", optional = true }
backend-frontend-java = { path = "../../frontends/java", optional = true }
backend-frontend-python = { path = "../../frontends/python", optional = true }
backend-frontend-rust = { path = "../../frontends/rust", optional = true }
backend-frontend-typescript = { path = "../../frontends/typescript", optional = true }
blake3 = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }

[[bin]]
name = "backend-journey-cancel-worker"
path = "src/bin/cancel_worker.rs"
required-features = ["extended-journeys"]

[[bin]]
name = "backend-journey-locald"
path = "src/bin/locald.rs"

[[bin]]
name = "backend-journey-cluster-probe"
path = "src/bin/cluster_probe.rs"
required-features = ["extended-journeys"]

[[bin]]
name = "backend-journey-worker"
path = "src/bin/worker.rs"
required-features = ["extended-journeys"]

[[bin]]
name = "backend-journey-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "backend-journey-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "backend-journey-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[[test]]
name = "cutover_e2e"
path = "tests/cutover_e2e.rs"
required-features = ["extended-journeys"]

[[test]]
name = "cluster_source_journey"
path = "tests/cluster_source_journey.rs"
required-features = ["extended-journeys"]

[[test]]
name = "s3_cold_selected_journey"
path = "tests/s3_cold_selected_journey.rs"
