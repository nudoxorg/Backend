# fs-err's build.rs only probes rustc version via autocfg and emits rustc_1_N
# cfgs. Skip the script and set the cfgs ourselves (we require nightly ≥1.89).
# Without rustc_1_89, File::{lock,try_lock,unlock} are not compiled and uv-fs fails.
cfgs = [
    "rustc_1_56",
    "rustc_1_63",
    "rustc_1_73",
    "rustc_1_75",
    "rustc_1_81",
    "rustc_1_89",
]

[buildscript]
run = false
