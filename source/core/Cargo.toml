[package]
name = "nudox-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# `rc` enables Serialize/Deserialize for Arc<str> (SourceChunk.raw_code), which
# the workspace otherwise only satisfies via transitive feature unification.
serde = { workspace = true, features = ["rc"] }
tracing = { workspace = true }
