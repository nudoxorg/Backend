[package]
name = "parsers"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
deno_ast = "0.53.0"
deno_doc = { path = "../../deno_doc" }
deno_graph = "0.107.1"
cargo_metadata = "0.23.1"
crates_io_api = "0.12.0"
flate2 = "1.1.5"
ir = { workspace = true }
lang-types = { version = "0.1.0", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustc-hash = { workspace = true }
rayon = { workspace = true }
simd-json = { workspace = true }
memmap2 = { workspace = true }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.44"
thiserror = "2"
tokio = { workspace = true }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
gix = { version = "0.74.1", features = ["blocking-http-transport-reqwest", "blocking-network-client", "worktree-mutation"] }
gix-object = "0.51.1"
gix-ref = "0.54.1"
gix-worktree = "0.43.1"
gix-worktree-state = "0.21.0"
rustdoc-types = "0.56.0"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
