[package]
name = "rust-parser"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
ir = { workspace = true }
ir-types = { workspace = true }
cargo_metadata = "0.23.1"
crates_io_api = "0.12.0"
lang-types = { version = "0.1.0", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustdoc-types = "0.56.0"
tracing = "0.1"
url = { version = "2", features = ["serde"] }
gix = { version = "0.74.1", features = ["blocking-http-transport-reqwest", "blocking-network-client", "worktree-mutation"] }
gix-object = "0.51.1"
gix-ref = "0.54.1"
gix-worktree = "0.43.1"
gix-worktree-state = "0.21.0"

[dev-dependencies]
tokio = { workspace = true }
tempfile = "3"
