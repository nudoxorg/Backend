[package]
name = "nudox"
version = "0.1.0"
edition = "2024"

[dependencies]
deno_ast = "0.53.0"
deno_doc = { path = "../../deno_doc" }
deno_graph = "0.107.1"
axum = "0.8.8"
cargo_metadata = "0.23.1"
crates_io_api = "0.12.0"
flate2 = "1.1.5"
gix = { version = "0.74.1", features = [
  "blocking-http-transport-reqwest",
  "blocking-network-client",
  "worktree-mutation"
] }
gix-object = "0.51.1"
gix-ref = "0.54.1"
ir = { workspace = true, features = ["serde"] }
nudox-store     = { path = "../store" }
nudox-core      = { path = "../core" }
nudox-identity  = { workspace = true }
nudox-search    = { path = "../search" }
nudox-blobstore = { path = "../blobstore" }
nudox-document  = { path = "../document" }
nudox-embed     = { path = "../embed" }
nudox-orchestrator = { path = "../orchestrator", features = ["memory-backends"] }
nudox-pipeline      = { path = "../pipeline" }
nudox-rust-parser   = { path = "../parsers/rust" }
nudox-ts-parser = { path = "../parsers/typescript" }
uuid            = { workspace = true }
chrono          = { workspace = true }
arborium = { workspace = true, features = ["lang-rust"] }
jiff = { version = "0.2.16", features = ["serde"] }
lang-types = { version = "0.1.0", features = ["serde"] }
rustdoc-types = "0.56.0"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.148"
terminusdb-client = { git = "https://github.com/ParapluOU/terminusdb-rs" }
thiserror = "2.0.17"
anyhow = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.48.0", features = ["full", "macros", "rt-multi-thread"] }
toml = "1.0.4"
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tempfile = "3.23.0"
url = { version = "2.5.7", features = ["serde"] }
qdrant-client = "1.17.0"
gix-worktree = "0.43.1"
gix-worktree-state = "0.21.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tar = "0.4.44"
tantivy = "0.22"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
color-eyre       = "0.6"
insta            = "1.43.2"
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
chrono           = { workspace = true }
nudox-core       = { path = "../core" }
nudox-search     = { path = "../search" }
nudox-blobstore  = { path = "../blobstore" }
nudox-embed      = { path = "../embed" }
nudox-orchestrator = { path = "../orchestrator", features = ["memory-backends"] }
uuid             = { workspace = true }
