[package]
name = "nudox"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
producers = { path = "../producers" }
ir = { workspace = true, features = ["serde"] }
store     = { path = "../store" }
nudox-core      = { path = "../core" }
identity  = { workspace = true }
search    = { path = "../search" }
blobstore = { path = "../blobstore" }
document  = { path = "../document" }
embed     = { path = "../embed" }
orchestrator = { path = "../orchestrator", features = ["memory-backends"] }
pipeline      = { path = "../pipeline" }
uuid            = { workspace = true }
chrono          = { workspace = true }
arborium = { workspace = true, features = ["lang-rust"] }
jiff = { version = "0.2.16", features = ["serde"] }
lang-types = { version = "0.1.0", features = ["serde"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = "1.0.148"
terminusdb-client = { git = "https://github.com/ParapluOU/terminusdb-rs" }
thiserror = "2.0.17"
anyhow = { workspace = true }
async-trait = "0.1"
tokio = { version = "1.48.0", features = ["full", "macros", "rt-multi-thread"] }
tower-http = { version = "0.6.6", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tempfile = "3.23.0"
url = { version = "2.5.7", features = ["serde"] }
qdrant-client = "1.17.0"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
tantivy = "0.22"
mimalloc = "0.1"
dashmap = "6"
arc-swap = "1"
rayon = { workspace = true }
futures = { workspace = true }
im = { workspace = true }
wide = { workspace = true }

[features]
default = ["serde"]
serde = ["dep:serde"]

[dev-dependencies]
color-eyre       = "0.6"
insta            = "1.43.2"
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
chrono           = { workspace = true }
nudox-core       = { path = "../core" }
search     = { path = "../search" }
blobstore  = { path = "../blobstore" }
embed      = { path = "../embed" }
orchestrator = { path = "../orchestrator", features = ["memory-backends"] }
uuid             = { workspace = true }
