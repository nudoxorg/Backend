[package]
name = "wave-application-gpui-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[package.metadata.nudox]
role = "adapter"

[features]
default = []
# The fallback state projection is always available. This feature gates only the
# actual GPUI entity/view so dependency resolution can be measured independently.
real-gpui = ["dep:gpui"]

[dependencies]
wave-application-core = { path = "../wave-application-core" }
gpui = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
