[package]
name = "wave-application-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.nudox]
role = "adapter"

[[bin]]
name = "wave-application-cli"
path = "src/main.rs"

[dependencies]
wave-application-core = { path = "../wave-application-core" }
wave-application-protocol = { path = "../wave-application-protocol" }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true

[lints.rust]
unsafe_code = "deny"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
exit = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
