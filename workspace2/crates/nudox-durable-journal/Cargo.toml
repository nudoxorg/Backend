[package]
name = "nudox-durable-journal"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
loom-model = ["dep:loom"]

[package.metadata.nudox]
role = "adapter"

[dependencies]
nudox-workflow = { path = "../nudox-workflow" }
nudox-hydration = { path = "../nudox-hydration" }
nudox-id = { path = "../nudox-id" }
blake3.workspace = true
thiserror.workspace = true
zerocopy.workspace = true
loom = { workspace = true, optional = true }

[dev-dependencies]
allocation-counter.workspace = true
nudox-object = { path = "../nudox-object" }
nudox-root = { path = "../nudox-root" }
nudox-schema = { path = "../nudox-schema" }
nudox-store-memory = { path = "../nudox-store-memory" }
