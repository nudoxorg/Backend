[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.nudox_sol_steward]
description = "Cross-program architect and final integrator for the workspace2 migration."
config_file = "./agents/nudox-sol-steward.toml"

[agents.nudox_terra_orchestrator]
description = "Autonomous capability manager that stays ahead through research, evolves an executable rubric, keeps Luna implementing, simplifies ruthlessly, and returns one verified candidate."
config_file = "./agents/nudox-terra-orchestrator.toml"

[agents.nudox_luna_implementer]
description = "Relentless implementation engineer that owns assigned executable rubric rows through code, hostile tests, measurement, and post-green simplification."
config_file = "./agents/nudox-luna-implementer.toml"

[agents.nudox_terra_reviewer]
description = "Independent hostile reviewer for early boundaries, closure counterexamples, and ruthless simplification of concrete Rust candidates."
config_file = "./agents/nudox-terra-reviewer.toml"

[agents.nudox_terra_rubric_writer]
description = "Executable-rubric author that makes capability laws, mutants, evidence, caps, and same-direction stretch unambiguous."
config_file = "./agents/nudox-terra-rubric-writer.toml"
