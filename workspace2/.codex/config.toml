[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "high"
interrupt_message = true

[agents.nudox_sol_steward]
description = "Cross-program architect and final integrator for the workspace2 migration."
config_file = "./agents/nudox-sol-steward.toml"

[agents.nudox_terra_orchestrator]
description = "Autonomous capability manager that researches, dispatches Luna workers, proves, and integrates one candidate."
config_file = "./agents/nudox-terra-orchestrator.toml"

[agents.nudox_luna_implementer]
description = "Narrow proof implementer that iterates relentlessly against one frozen evidence matrix."
config_file = "./agents/nudox-luna-implementer.toml"

[agents.nudox_terra_reviewer]
description = "Independent source-read-only hostile reviewer for correctness, simplicity, typing, and measured performance."
config_file = "./agents/nudox-terra-reviewer.toml"

[agents.nudox_terra_rubric_writer]
description = "Independent evidence-rubric author and calibrator; never scores its own specimen."
config_file = "./agents/nudox-terra-rubric-writer.toml"
