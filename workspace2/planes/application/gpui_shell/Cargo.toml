[package]
name = "wave-application-gpui-shell"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"

[features]
default = []
# The fallback state projection is always available. This feature gates only the
# actual GPUI entity/view so dependency resolution can be measured independently.
real-gpui = ["dep:gpui"]

[dependencies]
wave-application-core = { path = "../crates/wave-application-core" }
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", default-features = false, features = ["test-support"], optional = true }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
