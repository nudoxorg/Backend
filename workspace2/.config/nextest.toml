[profile.default]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "skip"
final-status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 2 }
retries = 0

[profile.ci]
fail-fast = false
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "slow"
slow-timeout = { period = "5s", terminate-after = 3 }
retries = 0
junit = { path = "junit.xml" }

[profile.loom]
inherits = "ci"
test-threads = 1
slow-timeout = { period = "30s", terminate-after = 4 }
