<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Browse</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url("../../fonts/BricolageGrotesque[opsz,wdth,wght].ttf") format("truetype");font-weight:200 800;font-stretch:75% 100%}
@font-face{font-family:"Geist";src:url("../../fonts/Geist[wght].ttf") format("truetype");font-weight:100 900}
@font-face{font-family:"Geist Mono";src:url("../../fonts/GeistMono[wght].ttf") format("truetype");font-weight:100 900}
@font-face{font-family:"Newsreader";src:url("../../fonts/Newsreader[opsz,wght].ttf") format("truetype");font-weight:200 800;font-style:normal}
@font-face{font-family:"Newsreader";src:url("../../fonts/Newsreader-Italic[opsz,wght].ttf") format("truetype");font-weight:200 800;font-style:italic}
</style>
<link rel="stylesheet" href="../facet.css"><link rel="stylesheet" href="../main-extra.css"><link rel="stylesheet" href="../v4.css">
<link rel="stylesheet" href="../marks/marks.css">
<link rel="stylesheet" href="browse.css">
</head>
<body><div id="app"></div>
<script>addEventListener("error",e=>{const d=document.createElement("pre");d.style.cssText="position:fixed;left:8px;bottom:8px;z-index:999;color:#ff7a8a;background:#000;font:11px monospace;max-width:90vw;white-space:pre-wrap";d.textContent="ERR "+e.message+" @"+e.filename+":"+e.lineno;document.body.appendChild(d)});addEventListener("unhandledrejection",e=>{const d=document.createElement("pre");d.style.cssText="position:fixed;left:8px;bottom:40px;z-index:999;color:#ff7a8a;background:#000;font:11px monospace;max-width:90vw;white-space:pre-wrap";d.textContent="REJ "+(e.reason&&e.reason.stack||e.reason);document.body.appendChild(d)});</script>
<script type="module" src="browse.js"></script>
</body></html>
