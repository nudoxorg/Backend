[package]
name = "backend-extension-turso"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
backend-library = { path = "../../crates/library" }
blake3.workspace = true
# Full-text search (a Tantivy index) is this projection's alone; enabling it
# workspace-wide would pull Tantivy into the portable `backend-library` closure
# through `backend-semantic`.
turso = { workspace = true, features = ["fts"] }

[dev-dependencies]
futures-executor.workspace = true

[lints]
workspace = true
