[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bench]]
name = "shadow-resolution"
path = "benches/shadow_resolution.rs"
harness = false

[[bench]]
name = "durable_projection"
path = "benches/durable_projection.rs"
harness = false
