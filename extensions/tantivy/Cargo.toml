[package]
name = "backend-extension-tantivy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []

[dependencies]
backend-platform = { path = "../../crates/platform" }
backend-version = { path = "../../crates/version" }
backend-semantic = { path = "../../crates/semantic" }
blake3.workspace = true
