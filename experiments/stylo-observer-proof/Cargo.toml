[workspace]
resolver = "3"
[package]
name = "nudox-stylo-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
[dependencies]
style = { package = "stylo", version = "=0.23.0" }
url = "=2.5.8"
cssparser = "=0.38.0"
selectors = "=0.42.0"
[patch.crates-io]
stylo = { path = "vendor/stylo" }
selectors = { path = "vendor/selectors" }
