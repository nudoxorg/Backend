[package]
name = "backend-frontend-clang"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
backend-compile = { path = "../../crates/compile" }
backend-semantic = { path = "../../crates/semantic" }
blake3.workspace = true
clang-sys = { version = "1.9.1", default-features = false, features = ["clang_3_6", "runtime"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter-cpp = "=0.23.4"

[features]
# Enables live authority integration tests; the test environment must provide one libclang.
native-test = []

[dev-dependencies]
tempfile = "3"
[lib]
path = "lib.rs"
