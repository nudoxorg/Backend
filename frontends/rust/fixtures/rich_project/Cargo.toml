[package]
name = "rust-authority-rich-fixture"
version = "0.1.0"
edition = "2021"

# Nested under `frontends/rust/`, a real workspace member, but this fixture
# is not itself listed in the root `[workspace] members` glob (`frontends/*`
# only matches one level deep) or excluded. Without a `[workspace]` table of
# its own, `cargo locate-project --workspace` (run by rust-analyzer's project
# loader when a direct-HIR test opens this package as its own Cargo root)
# walks up to the root workspace and gets refused with "current package
# believes it's in a workspace when it's not". Closing it as its own
# single-package workspace keeps it a real, standalone Cargo package for
# tests that need one, without adding it to the main build graph.
[workspace]
