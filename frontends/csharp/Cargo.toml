[package]
name = "backend-frontend-csharp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[lints]
workspace = true
[dependencies]
backend-compile = { path = "../../crates/compile" }
backend-platform = { path = "../../crates/platform" }
backend-semantic = { path = "../../crates/semantic" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
tempfile = { workspace = true }
thiserror = { workspace = true }
tree-sitter-c-sharp = "=0.23.5"
[lib]
path = "lib.rs"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"

[[bin]]
name = "csharp-landlock-launcher-prototype"
path = "src/landlock_launcher_prototype.rs"
test = false
bench = false
