[package]
name = "backend-frontend-sqlite-experimental"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT OR Apache-2.0"
[workspace]
[dependencies]
backend-sql-contract = { path = "../sql-contract" }
syntaqlite = { path = "../../vendor/syntaqlite-native/syntaqlite", default-features = false, features = ["sqlite", "fmt", "analysis"] }
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
sha2 = "0.10"
