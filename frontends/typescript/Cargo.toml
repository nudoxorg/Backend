[package]
name = "backend-frontend-typescript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
tsz-semantic-session-test-support = []

[lints]
workspace = true
[dependencies]
backend-compile = { path = "../../crates/compile" }
backend-semantic = { path = "../../crates/semantic" }
flate2 = "1.1.10"
oxc_allocator = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_diagnostics = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_semantic = "=0.139.0"
oxc_span = "=0.139.0"
oxc_syntax = "=0.139.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tree-sitter-typescript = "=0.23.2"
tsz = { package = "tsz-core", git = "https://github.com/tsz-org/tsz.git", rev = "153b25adb393f134c61ddde7a14cc1ff1954fc2a", default-features = false }
tsz-common = { git = "https://github.com/tsz-org/tsz.git", rev = "153b25adb393f134c61ddde7a14cc1ff1954fc2a" }
[lib]
path = "lib.rs"
