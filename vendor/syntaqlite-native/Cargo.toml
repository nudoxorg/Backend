# Source subset from syntaqlite 0.13.5, upstream commit
# 4e4de76312429fb2235ae093ab2125914320d5bd. See PROVENANCE.md.
[workspace]
resolver = "3"
members = ["syntaqlite-common", "syntaqlite-syntax", "syntaqlite"]

[workspace.package]
repository = "https://github.com/LalitMaganti/syntaqlite"
homepage = "https://syntaqlite.com"

[workspace.lints.rust]
unused_must_use = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes = "deny"
redundant_pub_crate = "allow"
must_use_candidate = "allow"
