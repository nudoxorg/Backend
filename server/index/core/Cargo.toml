# Defines the `server-index-core` package and its explicit dependency boundary.
# The crate exists to define immutable index documents, segments, and snapshot identities.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-identity = { path = "../../../heart/identity" }
server-index-vocabulary = { path = "../vocabulary" }
compiler-ir-vocabulary = { path = "../../../compiler/ir-vocabulary" }
thiserror.workspace = true

[lib]
path = "lib.rs"
