# Defines the `server-index-trustfall` package and its explicit dependency boundary.
# The crate exists to adapt borrowed graph facts to typed Trustfall queries.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-trustfall"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
compiler-ir = { path = "../../../compiler/ir" }
server-index-graph-vector = { path = "../graph-vector" }
thiserror.workspace = true
trustfall.workspace = true
trustfall_core.workspace = true
futures-core.workspace = true
futures-util.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
server-index-vocabulary = { path = "../vocabulary" }

[lib]
path = "lib.rs"
