# Defines the `server-index-build` package and its explicit dependency boundary.
# The crate exists to project reopened compiler IR into immutable exact and lexical segments.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-publication = { path = "../../../compiler/publication" }
heart-identity = { path = "../../../heart/identity" }
server-index-core = { path = "../core" }
server-index-graph-vector = { path = "../graph-vector" }
compiler-ir = { path = "../../../compiler/ir" }
compiler-ir-vocabulary = { path = "../../../compiler/ir-vocabulary" }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
compiler-driver = { path = "../../../compiler/driver" }
compiler-vocabulary = { path = "../../../compiler/vocabulary" }
server-journal = { path = "../../journal" }
server-index-trustfall = { path = "../trustfall" }
server-index-vocabulary = { path = "../vocabulary" }
heart-identity = { path = "../../../heart/identity" }
[lints]
workspace = true

[lib]
path = "lib.rs"
