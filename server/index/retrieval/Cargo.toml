# Defines the `server-index-retrieval` package and its explicit dependency boundary.
# The crate exists to compose exact, lexical, graph, and vector retrieval under one snapshot authority.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-retrieval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
compiler-ir = { path = "../../../compiler/ir" }
server-index-core = { path = "../core" }
server-index-graph-vector = { path = "../graph-vector" }
server-index-publish = { path = "../publish" }
server-index-qdrant = { path = "../qdrant" }
server-index-tantivy = { path = "../tantivy" }
server-index-trustfall = { path = "../trustfall" }
server-index-vocabulary = { path = "../vocabulary" }
thiserror.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
compiler-vocabulary = { path = "../../../compiler/vocabulary" }
server-journal = { path = "../../journal" }
heart-hydration = { path = "../../../heart/hydration" }
heart-identity = { path = "../../../heart/identity" }
heart-object = { path = "../../../heart/object" }
heart-root = { path = "../../../heart/root" }
heart-schema = { path = "../../../heart/schema" }
heart-memory = { path = "../../../heart/memory" }
futures-core.workspace = true
interface-protocol = { path = "../../../interface/protocol", features = ["server-source"] }
serde_json.workspace = true
[lints]
workspace = true

[lib]
path = "lib.rs"

[[bench]]
name = "source_resolution"
harness = false
