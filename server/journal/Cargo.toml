# Defines the `server-journal` package and its explicit dependency boundary.
# The crate exists to persist and recover generation publication with bounded ownership.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-journal"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
loom-model = ["dep:loom"]


[dependencies]
server-workflow = { path = "../workflow" }
heart-hydration = { path = "../../heart/hydration" }
heart-identity = { path = "../../heart/identity" }
blake3.workspace = true
thiserror.workspace = true
zerocopy.workspace = true
loom = { workspace = true, optional = true }

[dev-dependencies]
allocation-counter.workspace = true
heart-object = { path = "../../heart/object" }
heart-root = { path = "../../heart/root" }
heart-schema = { path = "../../heart/schema" }
heart-memory = { path = "../../heart/memory" }

[lib]
path = "lib.rs"
