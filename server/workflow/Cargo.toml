# Defines the `server-workflow` package and its explicit dependency boundary.
# The crate exists to reduce durable workflow events into deterministic recovery state.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-identity = { path = "../../heart/identity" }
heart-object = { path = "../../heart/object" }
heart-observe = { path = "../../heart/observe" }
server-runtime = { path = "../runtime" }
heart-schema = { path = "../../heart/schema" }
strum.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
