[package]
name = "backend-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
backend-compile = { path = "../../crates/compile" }
backend-engine = { path = "../../crates/engine" }
backend-platform = { path = "../../crates/platform" }
backend-semantic = { path = "../../crates/semantic" }
backend-store = { path = "../../crates/store" }
backend-version = { path = "../../crates/version" }
blake3.workspace = true
thiserror.workspace = true
tokio.workspace = true

[dev-dependencies]
backend-extension-turso = { path = "../../extensions/turso" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
  "fs",
  "std",
] }
[lints]
workspace = true
[lib]
path = "src/lib.rs"
