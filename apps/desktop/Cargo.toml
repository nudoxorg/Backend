[package]
name = "backend-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend-desktop"
path = "src/main.rs"

[[bin]]
name = "backend-desktop-gui-harness"
path = "src/bin/backend-desktop-gui-harness.rs"
required-features = ["visual-harness"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
# Unpacks a registry archive from the local cargo cache (`host::registry`).
flate2.workspace = true
backend-client = { path = "../../crates/client" }
backend-facet = { path = "../facet" }
backend-library = { path = "../../crates/library" }
backend-local-service = { path = "../../crates/local-service" }
backend-platform = { path = "../../crates/platform" }
backend-present = { path = "../../crates/present" }
backend-replication = { path = "../../crates/replication" }
backend-runtime = { path = "../../crates/runtime" }
gpui.workspace = true
gpui_component.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
semver = "1.0.28"
toml.workspace = true

[features]
# Direct GPUI CE capture against the same live host/bootstrap as the product.
visual-harness = ["dep:backend-gui-harness", "dep:image", "dep:rustix", "gpui_component/headless", "backend-facet/gallery"]

[dependencies.backend-gui-harness]
path = "../../tools/gui-harness"
optional = true

[[bin]]
name = "backend-desktop-folio-capture"
path = "src/bin/backend-desktop-folio-capture.rs"
required-features = ["visual-harness"]

[[test]]
name = "shell_capture"
path = "tests/shell_capture.rs"

# The capture harness owns private durable state, which the owner refuses unless
# every directory is 0700: it sets a private umask (`harness::private_umask`).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit", "runtime_shaders"] }
block2 = "=0.6.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSAccessibility", "NSWorkspace"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSNotification", "NSOperation", "NSString", "NSObject", "block2"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["x11", "wayland"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true, features = ["wgpu"] }
windows = { version = "=0.61.3", features = ["Foundation", "UI_ViewManagement"] }

[dev-dependencies]
backend-gui-harness = { path = "../../tools/gui-harness" }
# Prototype release fixtures are test-only; production release views read the
# selected local registry and exact owner comparison.
backend-facet = { path = "../facet", features = ["release-fixture"] }
# `write_state_from_another_build`: the host test of a workspace an earlier build wrote.
backend-local-service = { path = "../../crates/local-service", features = ["test-support"] }
blake3.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
proptest.workspace = true
gpui = { workspace = true, features = ["test-support"] }
# Test windows have no native view: the text engine's macOS hooks stay off.
gpui_component = { workspace = true, features = ["headless"] }
gpui_platform = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
