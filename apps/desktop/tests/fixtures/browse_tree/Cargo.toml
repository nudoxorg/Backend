# The Library page's end-to-end fixture: a two-member workspace whose tree is
# pinned by its Cargo.lock and resolvable offline from the local registry
# cache. `app` depends on toml 0.8 and bincode 1.3.3 (unmaintained,
# RUSTSEC-2025-0141); `tool` depends on trybuild, which asks for toml 1.x, so
# toml is here twice and only `app` holds the 0.8 copy.
#
# Its own `[workspace]` keeps it out of the repository's build graph.
[workspace]
members = ["app", "tool"]
resolver = "2"
