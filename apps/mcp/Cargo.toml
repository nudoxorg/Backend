[package]
name = "backend-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "backend-mcp"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum.workspace = true
backend-client = { path = "../../crates/client" }
backend-engine = { path = "../../crates/engine" }
backend-extension-trustfall = { path = "../../extensions/trustfall" }
backend-library = { path = "../../crates/library" }
backend-present = { path = "../../crates/present" }
backend-replication = { path = "../../crates/replication" }
backend-runtime = { path = "../../crates/runtime" }
blake3.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }

[target.'cfg(windows)'.dependencies]
backend-platform = { path = "../../crates/platform" }

[lints]
workspace = true
