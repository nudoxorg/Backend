id: https://terminusdb.com/schema/nudox
name: nudox_ir
title: nudox IR Schema
description: >-
  LinkML schema for the nudox compiler intermediate representation.
  Models API symbol metadata (Entry) and structural shapes (Kind variants)
  for storage in TerminusDB as RDF/JSON-LD.

license: https://creativecommons.org/publicdomain/zero/1.0/

prefixes:
  linkml: https://w3id.org/linkml/
  nudox: https://terminusdb.com/schema/nudox/
  xsd: http://www.w3.org/2001/XMLSchema#
  schema: http://schema.org/

imports:
  - linkml:types

default_prefix: nudox
default_range: string


enums:
  Visibility:
    description: >-
      Access level of a symbol. Kept as an open enum so language-specific
      rules can evolve without a schema migration.
    permissible_values:
      public:
        description: Visible to all consumers.
      private:
        description: Visible only within the defining scope.
      protected:
        description: Visible to subclasses / inheritors.
      internal:
        description: Visible within the same package / crate.
      package:
        description: Package-level visibility (Java-style default).

  # ── RecordKind ─────────────────────────────────────────────────────────────
  RecordKind:
    description: Shape category for a record type.
    permissible_values:
      Unit:
        description: A record with no fields (unit struct, empty object).
      Tuple:
        description: A record with ordered, positional fields.
      Named:
        description: A record with named fields (struct, class).
      Dynamic:
        description: A record with dynamic/unknown fields (JS object, dict).

  # ── FunctionAttribute ──────────────────────────────────────────────────────
  FunctionAttribute:
    description: Attributes applicable to function-like symbols.
    permissible_values:
      Variadic:
        description: Takes an arbitrary number of arguments.
      Const:
        description: Evaluated at compile-time.
      Pure:
        description: No side-effects.
      Async:
        description: Runs asynchronously.
      Unsafe:
        description: Runs within an unsafe context (Rust).

  # ── ParameterAttribute ─────────────────────────────────────────────────────
  ParameterAttribute:
    description: Attributes applicable to function parameters.
    permissible_values:
      Inout:
      Mutable:
      Consuming:
      Borrowing:
      Isolated:
      Variadic:
      Optional:

  # ── FieldAttribute ─────────────────────────────────────────────────────────
  FieldAttribute:
    description: Attributes applicable to record fields.
    permissible_values:
      Mutable:
      Optional:

  # ── Variance ───────────────────────────────────────────────────────────────
  Variance:
    description: Variance annotation for generic type parameters.
    permissible_values:
      Covariant:
      Contravariant:
      Invariant:
      Bivariant:

  # ── TypeKind ───────────────────────────────────────────────────────────────
  TypeKind:
    description: Classification of a generic type parameter.
    permissible_values:
      Type:
      HigherKinded:
      Associated:

  # ── ReceiverKind ───────────────────────────────────────────────────────────
  ReceiverKind:
    description: The receiver / self-parameter kind for a trait method.
    permissible_values:
      Owned:
        description: Takes ownership (self in Rust).
      SharedRef:
        description: Immutable reference (&self).
      MutRef:
        description: Mutable reference (&mut self).
      Static:
        description: Static / class method (no receiver).
      Arbitrary:
        description: Arbitrary self type.

  TraitAttributeKind:
    description: Attributes applicable to trait definitions.
    permissible_values:
      Marker:
        description: Marker trait with no methods (e.g. Send, Sync).
      Auto:
        description: Auto trait (automatically implemented).
      Unsafe:
        description: Unsafe trait.
      ObjectSafe:
        description: Object-safe / dyn-compatible trait.
      Sealed:
        description: Sealed trait.
      Functional:
        description: Functional interface (single abstract method).

  PrimitiveKind:
    description: Built-in primitive type tags matching the Rust IR.
    permissible_values:
      Int8:
      Int16:
      Int:
      Int64:
      Int128:
      UInt8:
      UInt16:
      UInt:
      UInt64:
      UInt128:
      F16:
      Float:
      Double:
      Bool:
      String:
      Char:
      Null:
      Date:
      Data:


slots:

  name:
    description: Short (unqualified) name of the symbol.
    range: string
    required: true

  fq_name:
    description: Fully-qualified name string for display and lookup.
    range: string
    required: true

  aliases:
    description: >-
      Alternate fully-qualified names that resolve to the same Entry
      (re-exports, renamed items, different import surfaces).
    multivalued: true
    range: string

  documentation:
    description: Documentation string for the symbol, if present.
    range: string

  visibility:
    description: Visibility qualifier for the symbol.
    range: Visibility

  path:
    description: >-
      Segmented path for the symbol. Ordering is meaningful:
      outer namespace first, symbol last.
    multivalued: true
    range: string
    inlined_as_list: true

  members:
    description: >-
      Child Entries contained by this Entry. Unordered collection.
    multivalued: true
    range: Entry
    inlined: false

  kind:
    description: >-
      Reference to the structural Kind node for this Entry.
    range: Kind
    required: true
    inlined: false

  kind_tag:
    description: >-
      Discriminator tag for the Kind variant (e.g. "Module", "Function").
    range: string
    required: true

  # ── Generic & type system slots ────────────────────────────────────────────
  generics:
    description: Generic parameters and constraints.
    range: Generics
    inlined: true

  # ── Function-specific slots ────────────────────────────────────────────────
  implemented:
    description: >-
      Whether the IR captured an implementation body (true) or this is
      declaration-only (false).
    range: boolean
    required: true

  input_parameters:
    description: Structured input parameter list.
    multivalued: true
    range: Parameter
    inlined_as_list: true

  output_parameters:
    description: Return / output parameter representation.
    multivalued: true
    range: Parameter
    inlined_as_list: true

  attributes:
    description: Attributes / annotations applied to the function.
    multivalued: true
    range: FunctionAttribute

  # ── Record-specific slots ──────────────────────────────────────────────────
  fields:
    description: Fields of a record type.
    multivalued: true
    range: RecordField
    inlined_as_list: true

  record_kind:
    description: Category of record shape (Unit / Tuple / Named / Dynamic).
    range: RecordKind

  # ── Sum / Union slots ──────────────────────────────────────────────────────
  variants:
    description: Named variants of an enum / sum type.
    multivalued: true
    range: SumVariant
    inlined_as_list: true

  types:
    description: Type expressions participating in a union.
    multivalued: true
    range: TypeExpression
    inlined_as_list: true

  # ── Trait slots ────────────────────────────────────────────────────────────
  super_traits:
    description: Parent traits / supertrait bounds.
    multivalued: true
    range: TraitRef
    inlined_as_list: true

  associated_types:
    description: Associated type declarations.
    multivalued: true
    range: AssociatedType
    inlined_as_list: true

  required_methods:
    description: Methods that must be implemented.
    multivalued: true
    range: TraitMethod
    inlined_as_list: true

  provided_methods:
    description: Methods with default implementations.
    multivalued: true
    range: TraitMethod
    inlined_as_list: true

  required_constants:
    description: Required associated constants.
    multivalued: true
    range: TraitConstant
    inlined_as_list: true

  docs:
    description: >-
      Supplemental documentation (e.g. on TraitDef or TraitImpl) that may
      exist in addition to Entry-level documentation.
    range: string

  # ── TraitImpl slots ────────────────────────────────────────────────────────
  trait_ref:
    description: The trait being implemented.
    range: TraitRef
    inlined: true
    required: true

  for_type:
    description: The target type receiving the implementation.
    range: TypeExpression
    inlined: true
    required: true

  methods:
    description: Implemented methods and their details.
    multivalued: true
    range: FunctionDetail
    inlined_as_list: true

  associated_constants:
    description: Concrete bindings for associated constants.
    multivalued: true
    range: TraitConstant
    inlined_as_list: true

  is_negative:
    description: >-
      True if this is a negative impl (explicitly stating something
      does *not* implement a trait).
    range: boolean
    required: true

  is_blanket:
    description: True if this is a blanket impl.
    range: boolean
    required: true

  is_unsafe:
    description: True if the impl is marked unsafe.
    range: boolean
    required: true

  # ── TypeAlias slot ─────────────────────────────────────────────────────────
  aliased_type:
    description: The underlying type expression for a type alias.
    range: TypeExpression
    inlined: true
    required: true


# ═══════════════════════════════════════════════════════════════════════════════
# Classes
# ═══════════════════════════════════════════════════════════════════════════════

classes:

  # ─────────────────────────────────────────────────────────────────────────
  # Entry — the symbol metadata / navigation node
  # ─────────────────────────────────────────────────────────────────────────
  Entry:
    tree_root: true
    description: >-
      Indexable unit for a symbol: name, docs, navigation links, and the
      stable place to hang "what is this symbol" metadata.
      Structural meaning lives behind the `kind` reference.
    class_uri: nudox:Entry
    slots:
      - name
      - fq_name
      - aliases
      - documentation
      - visibility
      - path
      - members
      - kind

  # ─────────────────────────────────────────────────────────────────────────
  # Kind (abstract base) — structural representation of a symbol
  # ─────────────────────────────────────────────────────────────────────────
  Kind:
    abstract: true
    description: >-
      Abstract base for all structural Kind variants.
      Answers "what is this symbol structurally".
    class_uri: nudox:Kind
    slots:
      - kind_tag

  # ── Hub / skeleton kinds (no extra payload) ────────────────────────────
  Module:
    is_a: Kind
    description: >-
      Namespace-like container. Navigation content is modeled through
      the Entry tree (members), not inside the Kind itself.
    class_uri: nudox:Module

  Info:
    is_a: Kind
    description: >-
      Structural placeholder for nodes that need a Kind target but do
      not map to a heavier shape. Can later be upgraded.
    class_uri: nudox:Info

  InterfaceType:
    is_a: Kind
    description: >-
      Placeholder for interface-like constructs not modeled as TraitDef.
    class_uri: nudox:InterfaceType

  PrimitiveType:
    is_a: Kind
    description: >-
      Language built-in primitive type. Anchors type graphs as terminal nodes.
    class_uri: nudox:PrimitiveType

  Constant:
    is_a: Kind
    description: >-
      Constant symbol (default values, config flags, version markers).
    class_uri: nudox:Constant

  Variable:
    is_a: Kind
    description: >-
      Variable-like symbol (globals, statics).
    class_uri: nudox:Variable

  Macro:
    is_a: Kind
    description: >-
      Macro-like symbol with different expansion semantics.
    class_uri: nudox:Macro

  FieldKind:
    is_a: Kind
    description: >-
      Field-like symbol, for cases where fields are addressed as
      first-class symbols (docs, references, separate indexing).
    class_uri: nudox:Field

  Event:
    is_a: Kind
    description: >-
      Event-like symbol (framework / language dependent).
    class_uri: nudox:Event

  # ── Authority kinds (rich payload) ─────────────────────────────────────

  Function:
    is_a: Kind
    description: >-
      Callable symbol with signature data. The heart of API surface.
    class_uri: nudox:Function
    slots:
      - name
      - visibility
      - implemented
      - input_parameters
      - output_parameters
      - attributes
      - generics
    slot_usage:
      name:
        description: Function name (short name).

  RecordType:
    is_a: Kind
    description: >-
      Struct / record-like type: a named container of fields.
    class_uri: nudox:RecordType
    slots:
      - name
      - visibility
      - record_kind
      - fields
      - generics
    slot_usage:
      name:
        description: Display name for the record type.

  SumType:
    is_a: Kind
    description: >-
      Enum-like structure: a finite set of named variants.
    class_uri: nudox:SumType
    slots:
      - variants

  UnionType:
    is_a: Kind
    description: >-
      "One of these types" structure (union type).
    class_uri: nudox:UnionType
    slots:
      - types

  TraitDef:
    is_a: Kind
    description: >-
      Interface contract: a set of required/provided items and relationships.
    class_uri: nudox:TraitDef
    slots:
      - name
      - visibility
      - generics
      - super_traits
      - associated_types
      - required_methods
      - provided_methods
      - required_constants
      - docs
    slot_usage:
      name:
        description: Trait name (short name).

  TraitImpl:
    is_a: Kind
    description: >-
      Concrete implementation of a trait for a specific target type.
    class_uri: nudox:TraitImpl
    slots:
      - trait_ref
      - for_type
      - visibility
      - generics
      - methods
      - associated_types
      - associated_constants
      - is_negative
      - is_blanket
      - is_unsafe
      - docs

  TypeAlias:
    is_a: Kind
    description: >-
      Named synonym for another type expression (type X = ...).
    class_uri: nudox:TypeAlias
    slots:
      - aliased_type

  # ─────────────────────────────────────────────────────────────────────────
  # Supporting / inline classes  (previously sys:JSON blobs)
  # ─────────────────────────────────────────────────────────────────────────

  Parameter:
    description: A parameter in a function or method signature.
    class_uri: nudox:Parameter
    attributes:
      name:
        description: Parameter name.
        range: string
        required: true
      ty:
        description: Type of the parameter (if known).
        range: TypeExpression
        inlined: true
      attributes:
        description: Parameter-level attributes.
        multivalued: true
        range: ParameterAttribute
      default_value:
        description: Default value expression.
        range: string
      description:
        description: Parameter documentation.
        range: string

  RecordField:
    description: A field within a record / struct type.
    class_uri: nudox:RecordField
    attributes:
      name:
        description: Field name (absent for tuple-like fields).
        range: string
      ty:
        description: Type of the field (if known).
        range: TypeExpression
        inlined: true
      default_value:
        description: Default value expression.
        range: string
      attributes:
        description: Field-level attributes.
        range: FieldAttribute
      visibility:
        description: Field visibility.
        range: Visibility
      type_entry_id:
        description: >-
          ID of the Entry whose Kind represents this field's type.
          Used for cross-referencing within the graph.
        range: integer

  SumVariant:
    description: A named variant within a sum / enum type.
    class_uri: nudox:SumVariant
    attributes:
      name:
        description: Variant / tag name.
        range: string
        required: true
      types:
        description: Associated type payloads for this variant.
        multivalued: true
        range: TypeExpression
        inlined_as_list: true

  TypeExpression:
    description: >-
      Universal representation of a type. Uses a tagged discriminator
      (`type_tag`) to describe resolved paths, generics, primitives,
      function pointers, tuples, slices, borrows, etc.
    class_uri: nudox:TypeExpression
    attributes:
      type_tag:
        description: >-
          Discriminator for the type variant (e.g. "ResolvedPath",
          "GenericParam", "Primitive", "Tuple", "BorrowedRef", …).
        range: string
        required: true
      path:
        description: >-
          Dot-separated path for ResolvedPath types.
        range: string
      generic_args:
        description: Generic arguments for paths.
        multivalued: true
        range: GenericArg
        inlined_as_list: true
      param_name:
        description: Name for GenericParam types.
        range: string
      primitive:
        description: Primitive kind tag for Primitive types.
        range: PrimitiveKind
      inner_type:
        description: >-
          Inner type for wrappers (Slice, Array, Pattern, RawPointer,
          BorrowedRef).
        range: TypeExpression
        inlined: true
      element_types:
        description: >-
          Element types for compound types (Tuple, Union, Intersection,
          ImplTrait).
        multivalued: true
        range: TypeExpression
        inlined_as_list: true
      array_length:
        description: Length for Array types.
        range: integer
      is_mutable:
        description: Mutability flag for RawPointer / BorrowedRef.
        range: boolean
      lifetime:
        description: Lifetime annotation for BorrowedRef / DynTrait.
        range: string
      fn_inputs:
        description: Input parameters for FunctionPointer types.
        multivalued: true
        range: Parameter
        inlined_as_list: true
      fn_outputs:
        description: Output parameters for FunctionPointer types.
        multivalued: true
        range: Parameter
        inlined_as_list: true
      fn_generic_params:
        description: Generic type params for FunctionPointer types.
        multivalued: true
        range: TypeParam
        inlined_as_list: true
      fn_attributes:
        description: Attributes for FunctionPointer types.
        multivalued: true
        range: FunctionAttribute
      dyn_traits:
        description: Trait bounds for DynTrait types.
        multivalued: true
        range: PolyTrait
        inlined_as_list: true
      sum_variants:
        description: Variants for Sum types.
        multivalued: true
        range: SumVariant
        inlined_as_list: true
      generic_bounds:
        description: Bounds for ImplTrait types.
        multivalued: true
        range: GenericBound
        inlined_as_list: true
      qualified_name:
        description: Name for QualifiedPath types.
        range: string
      self_type:
        description: Self type for QualifiedPath types.
        range: TypeExpression
        inlined: true
      trait_path:
        description: Trait path for QualifiedPath types.
        range: string

  GenericArg:
    description: A single generic argument (type, const expr, or lifetime).
    class_uri: nudox:GenericArg
    attributes:
      arg_kind:
        description: >-
          Discriminator: "type", "constExpr", or "Lifetime".
        range: string
        required: true
      type_value:
        description: The type, when arg_kind is "type".
        range: TypeExpression
        inlined: true
      const_expr:
        description: Constant expression string, when arg_kind is "constExpr".
        range: string
      lifetime:
        description: Lifetime string, when arg_kind is "Lifetime".
        range: string

  Generics:
    description: >-
      Container for generic parameters, const parameters, lifetime
      parameters, and where-clause constraints.
    class_uri: nudox:Generics
    attributes:
      type_params:
        description: Type parameters (e.g. T, U).
        multivalued: true
        range: TypeParam
        inlined_as_list: true
      const_params:
        description: Const generic parameters.
        multivalued: true
        range: ConstParam
        inlined_as_list: true
      lifetime_params:
        description: Lifetime parameters.
        multivalued: true
        range: LifetimeParam
        inlined_as_list: true
      constraints:
        description: Where-clause constraints.
        multivalued: true
        range: ConstraintExpr
        inlined_as_list: true

  TypeParam:
    description: A generic type parameter.
    class_uri: nudox:TypeParam
    attributes:
      name:
        range: string
        required: true
      kind:
        range: TypeKind
      variance:
        range: Variance
      default_type:
        description: Default type expression (name + args).
        range: TypeExprSimple
        inlined: true

  ConstParam:
    description: A const generic parameter.
    class_uri: nudox:ConstParam
    attributes:
      name:
        range: string
        required: true
      ty:
        description: Type of the const parameter.
        range: TypeExprSimple
        inlined: true
      default_value:
        range: string

  LifetimeParam:
    description: A lifetime parameter.
    class_uri: nudox:LifetimeParam
    attributes:
      name:
        range: string
        required: true
      variance:
        range: Variance

  ConstraintExpr:
    description: >-
      A where-clause constraint (trait bound, lifetime bound, associated
      type bound, etc.).  Uses `constraint_kind` as a discriminator.
    class_uri: nudox:ConstraintExpr
    attributes:
      constraint_kind:
        description: >-
          Discriminator: "TraitBound", "AssociatedTypeBound",
          "HigherKindedBound", "LifetimeBound", "ConstExprBound",
          "LogicalPredicate".
        range: string
        required: true
      param:
        description: The parameter being constrained.
        range: string
      trait_ref:
        description: Trait reference for TraitBound.
        range: TraitRef
        inlined: true
      assoc_name:
        description: Associated type name for AssociatedTypeBound.
        range: string
      bound:
        description: Type expression bound.
        range: TypeExprSimple
        inlined: true
      kind_signature:
        description: Kind signature for HigherKindedBound (e.g. "* -> *").
        range: string
      shorter:
        description: Shorter lifetime for LifetimeBound.
        range: string
      longer:
        description: Longer lifetime for LifetimeBound.
        range: string
      const_expr:
        description: Expression string for ConstExprBound.
        range: string
      predicate_expr:
        description: >-
          Logical predicate expression string (e.g. "T: Clone && U: Copy").
        range: string

  TypeExprSimple:
    description: >-
      A simple type expression used in generics (name + recursive args).
      Mirrors the Rust IR `TypeExpr` struct.
    class_uri: nudox:TypeExprSimple
    attributes:
      name:
        range: string
        required: true
      args:
        multivalued: true
        range: TypeExprSimple
        inlined_as_list: true

  TraitRef:
    description: A reference to a trait by name with type arguments.
    class_uri: nudox:TraitRef
    attributes:
      name:
        range: string
        required: true
      args:
        description: Type expression arguments.
        multivalued: true
        range: TypeExprSimple
        inlined_as_list: true

  AssociatedType:
    description: An associated type declaration within a trait definition.
    class_uri: nudox:AssociatedType
    attributes:
      name:
        range: string
        required: true
      bounds:
        description: Bounds / constraints on the associated type.
        multivalued: true
        range: GenericBound
        inlined_as_list: true
      default_type:
        description: Default type (if any).
        range: TypeExpression
        inlined: true
      docs:
        range: string

  GenericBound:
    description: A bound on a generic or associated type (trait ref or lifetime).
    class_uri: nudox:GenericBound
    attributes:
      bound_kind:
        description: '"Trait" or "Lifetime".'
        range: string
        required: true
      trait_ref:
        description: Trait reference when bound_kind is "Trait".
        range: TraitRef
        inlined: true
      lifetime:
        description: Lifetime string when bound_kind is "Lifetime".
        range: string

  TraitMethod:
    description: A method signature within a trait definition.
    class_uri: nudox:TraitMethod
    attributes:
      name:
        range: string
        required: true
      parameters:
        multivalued: true
        range: Parameter
        inlined_as_list: true
      return_type:
        range: TypeExpression
        inlined: true
      generics:
        range: Generics
        inlined: true
      attributes:
        multivalued: true
        range: FunctionAttribute
      receiver:
        range: ReceiverKind
      has_default_implementation:
        range: boolean
        required: true
      docs:
        range: string

  TraitConstant:
    description: A constant / static member in a trait.
    class_uri: nudox:TraitConstant
    attributes:
      name:
        range: string
        required: true
      ty:
        description: Type of the constant.
        range: TypeExpression
        inlined: true
        required: true
      default_value:
        range: string
      docs:
        range: string

  TraitAttributeValue:
    description: >-
      A trait-level attribute.  Simple cases use `kind` from the
      TraitAttributeKind enum; the "Custom" variant adds name + args.
    class_uri: nudox:TraitAttributeValue
    attributes:
      kind:
        range: TraitAttributeKind
        required: true
      custom_name:
        description: Name for Custom attributes.
        range: string
      custom_args:
        description: Arguments for Custom attributes.
        multivalued: true
        range: string

  FunctionDetail:
    description: >-
      Full function detail as used inside TraitImpl.methods.
      Mirrors the Rust IR Function struct.
    class_uri: nudox:FunctionDetail
    attributes:
      name:
        range: string
        required: true
      visibility:
        range: Visibility
      implemented:
        range: boolean
        required: true
      input_parameters:
        multivalued: true
        range: Parameter
        inlined_as_list: true
      output_parameters:
        multivalued: true
        range: Parameter
        inlined_as_list: true
      attributes:
        multivalued: true
        range: FunctionAttribute
      generics:
        range: Generics
        inlined: true

  AssociatedTypeImpl:
    description: Concrete binding for an associated type in a trait impl.
    class_uri: nudox:AssociatedTypeImpl
    attributes:
      name:
        range: string
        required: true
      ty:
        description: The concrete type.
        range: TypeExpression
        inlined: true
        required: true

  PolyTrait:
    description: A polymorphic trait bound with optional higher-ranked lifetimes.
    class_uri: nudox:PolyTrait
    attributes:
      tr:
        description: Trait reference.
        range: TraitRef
        inlined: true
        required: true
      lifetimes:
        multivalued: true
        range: string
