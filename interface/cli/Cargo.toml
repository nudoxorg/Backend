# Defines the `interface-cli` package and its explicit dependency boundary.
# The crate exists to project the one shared local library onto a command line as the `nudox` binary.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nudox"
path = "main.rs"

[dependencies]
compiler-ir = { path = "../../compiler/ir" }
compiler-ir-vocabulary = { path = "../../compiler/ir-vocabulary" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
interface-core = { path = "../core" }
interface-documents = { path = "../documents" }
interface-identity = { path = "../identity" }
interface-library = { path = "../library" }
interface-search = { path = "../search" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
heart-identity = { path = "../../heart/identity" }
serde_json.workspace = true

[lints]
workspace = true
