# Defines the `nudox-gui2` package: the rewritten desktop surface of the Nudox library.
# The crate exists to explore package registries and read compiled documentation in one window.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "nudox-gui2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Typed fixtures rich enough to drive screenshots and rendering tests offline.
preview = []

[lib]
name = "nudox_gui2"
path = "lib.rs"

[[bin]]
name = "nudox-gui"
path = "main.rs"

[package.metadata.bundle]
name = "interface-gui"
identifier = "nudox-gui.interface-gui"
short_description = "Nudox: explore packages and read their documentation"
osx_minimum_system_version = "13.0"

[dependencies]
async-channel.workspace = true
compiler-ir = { path = "../compiler/ir" }
compiler-ir-vocabulary = { path = "../compiler/ir-vocabulary" }
compiler-vocabulary = { path = "../compiler/vocabulary" }
heart-identity = { path = "../heart/identity" }
interface-core = { path = "../interface/core" }
interface-documents = { path = "../interface/documents" }
interface-identity = { path = "../interface/identity" }
interface-library = { path = "../interface/library" }
interface-search = { path = "../interface/search" }
# The rewritten surface builds on the published gpui-ce release and the gpui-ce fork of
# gpui-component, which pins that same release; the legacy reader keeps the workspace git rev.
gpui = { package = "gpui-ce", version = "=0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", features = ["font-kit", "runtime_shaders"] }
gpui_component = { package = "gpui_ce_components", git = "https://github.com/gpui-ce/gpui-component", rev = "f7fbbbb", features = [
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-javascript",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-csharp",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-toml",
    "tree-sitter-markdown",
    "tree-sitter-yaml",
    "tree-sitter-bash",
] }
gpui_component_assets = { package = "gpui_ce_components_assets", git = "https://github.com/gpui-ce/gpui-component", rev = "f7fbbbb" }

[dev-dependencies]
gpui = { package = "gpui-ce", version = "=0.2.2", features = ["test-support"] }

[lints]
workspace = true
