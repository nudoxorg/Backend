# Defines the `interface-library` package and its explicit dependency boundary.
# The crate exists to own the one shared local library every surface reads, adds to, and searches.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-application = { path = "../../compiler/application" }
compiler-ir = { path = "../../compiler/ir" }
compiler-publication = { path = "../../compiler/publication" }
compiler-ir-vocabulary = { path = "../../compiler/ir-vocabulary" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
heart-identity = { path = "../../heart/identity" }
interface-core = { path = "../core" }
interface-documents = { path = "../documents" }
interface-identity = { path = "../identity" }
interface-search = { path = "../search" }
server-index-catalog = { path = "../../server/index/catalog" }
server-index-core = { path = "../../server/index/core" }
server-index-graph-vector = { path = "../../server/index/graph-vector" }
server-index-qdrant = { path = "../../server/index/qdrant" }
server-index-registry = { path = "../../server/index/registry" }
server-index-tantivy = { path = "../../server/index/tantivy" }
server-index-trustfall = { path = "../../server/index/trustfall" }
server-index-vocabulary = { path = "../../server/index/vocabulary" }
futures-core = { workspace = true }

[lints]
workspace = true

[lib]
path = "lib.rs"
