# Defines the `interface-gui` package and its explicit dependency boundary.
# The crate exists to read the shared local library through a GPUI desktop reader.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = []
# Typed fixtures rich enough to drive screenshots and rendering tests offline.
preview = []

[[bin]]
name = "nudox-gui-legacy"
path = "main.rs"

[package.metadata.bundle]
name = "Nudox GUI"
identifier = "dev.nudox.gui"
short_description = "Local GUI reader for the Nudox compiler host"

[dependencies]
async-channel.workspace = true
compiler-ir = { path = "../../compiler/ir" }
compiler-ir-vocabulary = { path = "../../compiler/ir-vocabulary" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
heart-identity = { path = "../../heart/identity" }
interface-core = { path = "../core" }
interface-documents = { path = "../documents" }
interface-identity = { path = "../identity" }
interface-library = { path = "../library" }
interface-search = { path = "../search" }
gpui.workspace = true
gpui_elements.workspace = true
gpui_platform.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[lib]
path = "lib.rs"

[[test]]
name = "state"
path = "tests/state.rs"

[[test]]
name = "gpui"
path = "tests/gpui.rs"
required-features = ["preview"]
