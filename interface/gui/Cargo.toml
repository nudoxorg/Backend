# Defines the `interface-gui` package and its explicit dependency boundary.
# The crate exists to render and control the unified application service through GPUI.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true


[features]
default = []
# The fallback state projection is always available. This feature gates only the
# actual GPUI entity/view so dependency resolution can be measured independently.
#
# It also gates tests/gpui.rs, so `cargo test -p interface-gui` on its own
# leaves the entire view layer untested:
#     cargo test -p interface-gui --features real-gpui
real-gpui = ["dep:gpui", "dep:gpui_platform"]

[[bin]]
name = "interface-gui"
path = "main.rs"
required-features = ["real-gpui"]

[dependencies]
async-channel.workspace = true
compiler-application = { path = "../../compiler/application" }
compiler-ir = { path = "../../compiler/ir" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
heart-observe = { path = "../../heart/observe" }
interface-core = { path = "../core" }
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
heart-adaptive = { path = "../../heart/adaptive" }
heart-identity = { path = "../../heart/identity" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
