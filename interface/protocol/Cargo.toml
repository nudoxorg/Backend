# Defines the `interface-protocol` package and its explicit dependency boundary.
# The crate exists to decode and project the shared application vocabulary for external transports.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
heart-adaptive = { path = "../../heart/adaptive" }
heart-identity = { path = "../../heart/identity" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
serde.workspace = true
serde_json.workspace = true
interface-core = { path = "../core" }
[dev-dependencies]
thiserror.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
