# Defines the `interface-identity` package and its explicit dependency boundary.
# The crate exists to spell, parse, and abbreviate every identity a person or agent can name.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-ir-vocabulary = { path = "../../compiler/ir-vocabulary" }
heart-identity = { path = "../../heart/identity" }
interface-core = { path = "../core" }

[lints]
workspace = true

[lib]
path = "lib.rs"
