# Defines the `interface-mcp` package and its explicit dependency boundary.
# The crate exists to serve the one shared local library to agents over MCP.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "nudox-mcp"
path = "main.rs"

[dependencies]
serde_json.workspace = true
compiler-ir = { path = "../../compiler/ir" }
compiler-ir-vocabulary = { path = "../../compiler/ir-vocabulary" }
interface-core = { path = "../core" }
interface-documents = { path = "../documents" }
interface-identity = { path = "../identity" }
interface-library = { path = "../library" }
interface-protocol = { path = "../protocol" }
interface-search = { path = "../search" }

[lints]
workspace = true
