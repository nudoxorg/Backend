# Defines the `interface-mcp` package and its explicit dependency boundary.
# The crate exists to serve the unified application protocol over framed MCP JSON-RPC.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[[bin]]
name = "interface-mcp"
path = "main.rs"

[dependencies]
serde_json.workspace = true
interface-core = { path = "../core" }
interface-protocol = { path = "../protocol" }
[dev-dependencies]
heart-adaptive = { path = "../../heart/adaptive" }
compiler-vocabulary = { path = "../../compiler/vocabulary" }
serde.workspace = true

[lints]
workspace = true
