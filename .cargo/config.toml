[unstable]
codegen-backend = true

[profile.dev]
codegen-backend = "cranelift"

# With the Wild Linker
[target.x86_64-unknown-linux-gnu]
linker    = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=wild",
]

[target.aarch64-unknown-linux-gnu]
linker    = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=wild",
]
