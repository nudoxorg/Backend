# Defines the `compiler-driver` package and its explicit dependency boundary.
# The crate exists to run bounded native toolchains and lower their output into canonical IR.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-vocabulary = { path = "../vocabulary" }
compiler-registry = { path = "../registry" }
compiler-ir = { path = "../ir" }
compiler-languages-clang = { path = "../languages/clang" }
compiler-languages-csharp = { path = "../languages/csharp" }
compiler-languages-go = { path = "../languages/go" }
compiler-languages-java = { path = "../languages/java" }
compiler-languages-python = { path = "../languages/python" }
compiler-languages-rust = { path = "../languages/rust" }
compiler-languages-typescript = { path = "../languages/typescript" }
heart-identity = { path = "../../heart/identity" }
sha2 = "=0.10.9"
thiserror.workspace = true

[dev-dependencies]
compiler-publication = { path = "../publication" }
server-journal = { path = "../../server/journal" }
ureq = { workspace = true }
flate2 = { workspace = true }
server-index-build = { path = "../../server/index/build" }
server-index-publish = { path = "../../server/index/publish" }
server-index-core = { path = "../../server/index/core" }

[lib]
path = "lib.rs"
