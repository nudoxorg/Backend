# Defines the `compiler-languages-rust` package: the in-process rust-analyzer
# semantic frontend that produces typed declaration, signature, and docs facts
# as standalone records shaped for canonical-data admission. All ra_ap_* crates
# stay pinned lockstep at exactly 0.0.341: salsa keys are incompatible across
# versions, so a mismatch produces runtime failures, not compile errors.
# The pin list is copied unchanged from the proven old-workspace frontend.
[package]
name = "compiler-languages-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

# ── rust-analyzer in-process frontend ────────────────────────────────────────
# Every ra_ap_* crate stays pinned lockstep at exactly 0.0.341: salsa keys are
# incompatible across versions, so a mismatch produces runtime failures, not
# compile errors. The pin list is copied unchanged from the proven old-workspace
# in-process frontend (`compiler/languages` rust section).
[dependencies]
anyhow = "1"
ra_ap_load-cargo = "=0.0.341"
ra_ap_project_model = "=0.0.341"
ra_ap_syntax = "=0.0.341"
ra_ap_vfs = "=0.0.341"
thiserror.workspace = true

[lints]
workspace = true
