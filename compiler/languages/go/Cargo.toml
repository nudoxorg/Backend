# Standalone Go oracle adapter with a bounded subprocess boundary.
# The vendored producer under `oracle/` emits the JSON transcript and the
# fixed authority image the Rust side validates.
# It depends only on the workspace protocol and error codecs.
[package]
name = "compiler-languages-go"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true

[lib]
path = "lib.rs"
