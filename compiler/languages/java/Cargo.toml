# Typed javadoc doclet boundary and UTF-16 source-coordinate conversion.
# The vendored doclet uses only the JDK and is compiled by the lane harness.
# Rust tests replay its JSON output offline.
[package]
name = "compiler-languages-java"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lib]
path = "lib.rs"
