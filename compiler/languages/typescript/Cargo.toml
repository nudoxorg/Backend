# Defines the in-process TypeScript and TSX syntax-and-binding authority.
# Lifts OXC's typed parser and lexical resolver without serializing their facts.
# Depends on the closed compiler profile vocabulary, never filename heuristics.
[package]
name = "compiler-languages-typescript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-vocabulary = { path = "../../vocabulary" }
thiserror.workspace = true
# OXC's tightly pinned crates form one arena-borrowed authority boundary.
oxc_allocator = "=0.139.0"
oxc_diagnostics = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_semantic = "=0.139.0"
oxc_span = "=0.139.0"
oxc_syntax = "=0.139.0"

[lib]
path = "lib.rs"

[lints]
workspace = true
