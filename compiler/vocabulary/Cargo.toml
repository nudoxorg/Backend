# Defines the `compiler-vocabulary` package and its explicit dependency boundary.
# The crate exists to define compiler languages, stages, recipes, diagnostics, and authority facts.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-vocabulary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-identity = { path = "../../heart/identity" }
thiserror.workspace = true

[lib]
path = "lib.rs"
