# Restricts conventional commits to architecture-derived repository scopes.
# Lets staged paths and staged Rust syntax preselect the narrowest valid scope.
# Runs only after the Nushell wrapper proves staged quality and ownership.
autocomplete = true
breaking_changes = true
force_config_scopes = true
allow_empty_scope = false

[[commit_scopes]]
name = "compiler"
description = "Compiler frontends, semantic IR, and publication"
patterns = ["^/compiler/"]

[[commit_scopes]]
name = "heart"
description = "Shared identity, memory, telemetry, and structural mechanisms"
patterns = ["^/heart/"]

[[commit_scopes]]
name = "interface"
description = "In-process, CLI, MCP, and GPUI interaction"
patterns = ["^/interface/"]

[[commit_scopes]]
name = "server"
description = "Runtime, workflow, journal, and index services"
patterns = ["^/server/"]

[[commit_scopes]]
name = "tooling"
description = "Nix, Nushell, lint, agent, and local developer control plane"
patterns = ["^/\.config/", "^/\.cargo/", "^/\.envrc$"]

[[commit_scopes]]
name = "test"
description = "Cross-boundary integration proof"
patterns = ["^/tests/"]

[commit_scopes.ast_grep]
language = "Rust"
files = ["**/*.rs"]
rule = { kind = "function_item", has = { stopBy = "end", pattern = "#[test]" } }
