# Defines semantic resource groups and increasingly broad verification profiles.
# Keeps unit tests parallel while serializing global allocators and live services.
# Makes suite escalation an explicit role capability rather than a habit.
[store]
dir = ".local/nextest"

[profile.default]
fail-fast = true
status-level = "fail"
final-status-level = "fail"
slow-timeout = { period = "20s", terminate-after = 2 }

[profile.affected]
inherits = "default"
fail-fast = false
status-level = "retry"
final-status-level = "pass"

[profile.closure]
inherits = "affected"
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[test-groups.allocator-global]
max-threads = 1

[test-groups.live-qdrant]
max-threads = 1

[test-groups.process-global]
max-threads = 1

[[profile.default.overrides]]
filter = "test(/allocation|allocator/)"
test-group = "allocator-global"

[[profile.default.overrides]]
filter = "test(/qdrant|real_service/)"
test-group = "live-qdrant"

[[profile.default.overrides]]
filter = "test(/process|framed/)"
test-group = "process-global"
