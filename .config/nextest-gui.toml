# .config/nextest-gui.toml — the GUI-scoped nextest config for `workspace/gui`
# (package `lindsey`), invoked as:
#
#   RUSTC_BOOTSTRAP=1 cargo nextest run \
#     --manifest-path workspace/gui/Cargo.toml \
#     --config-file .config/nextest-gui.toml \
#     -P default   # or -P ci
#
# This file lives under `.config/` at the repo root (not under `workspace/`)
# because that is this track's writable scope, but it governs the SEPARATE
# `lindsey` Cargo workspace named by `--manifest-path` above, not the root
# one — see `.config/nextest.toml`'s "GUI is a second config file" note for
# why one file cannot cover both workspaces (nextest validates every
# name-matcher in a config's filters eagerly against whichever workspace
# metadata is actually loaded, and hard-errors if a matcher names something
# absent from it — root-workspace names fail here exactly as GUI names fail
# in the root file). `--config-file` takes an arbitrary path (`cargo nextest
# run --help`: "Config file [default: workspace-root/.config/nextest.toml]",
# no requirement the path live under the workspace it configures) — that is
# what makes a second, root-`.config/`-hosted file for a workspace this
# track cannot write into actually work.
#
# GIT STATUS — this file is untracked (`??`) but it is NOT ignored. The
# earlier claim here (and in `.config/nextest.toml`'s header) that a
# `.gitignore` gap made `git add` a no-op was false:
# `.gitignore:175:!/.config/nextest-gui.toml` un-ignores it explicitly.
# `git check-ignore -v` exits 0 on ANY pattern match, negations included,
# which is how that got misread — see `.config/nextest.toml`'s header for the
# full account and the one caveat that IS real (the negation lines live only
# in the uncommitted working-tree edit to `.gitignore`, so this file and that
# `.gitignore` change must be committed together).
#
# ── Constraint 2, answered (do not assume — verify): does nextest run the
#    screenshot suite? ─────────────────────────────────────────────────────
#
# NO. Verified empirically against this exact workspace, 2026-08-05:
#
#   $ RUSTC_BOOTSTRAP=1 cargo nextest list --manifest-path workspace/gui/Cargo.toml
#   ...
#   error: creating test list failed
#   Caused by:
#     for `lindsey::shot_probe`, line "PROBE_OK 1800x800 -> .../.shots/probe.png"
#     did not end with the string ": test" or ": benchmark"
#   $ echo $?
#   104
#
# `screenshots.rs` and `shot_probe.rs` are `harness = false` (Cargo.toml,
# AGENTS-DOCTRINE.md's "GPUI testing": the file *is* `fn main`, run with no
# libtest harness, specifically so it executes on the process's real main
# thread — libtest spawns `#[test]` bodies on worker threads, and
# constructing the macOS platform off the main thread aborts). nextest's
# listing phase invokes every test binary with `--list` and parses libtest's
# `<name>: test` output format; a `harness = false` binary ignores that flag,
# runs its real `fn main` instead, and prints whatever it prints (here,
# `PROBE_OK ...`/`PROBE_PAINTED ...`). nextest treats a non-conforming list
# line as fatal — not "zero tests in this binary", but "list phase failed",
# exit code 104, ZERO tests enumerated for the ENTIRE invocation (confirmed:
# with `shot_probe`/`screenshots` present, `shell_flow` and `adversarial`
# also list zero tests — one bad binary poisons the whole run). There is no
# "one implicit test per non-conforming binary" fallback; an earlier draft of
# the root file's GUI section guessed there was, unverified — that guess was
# wrong.
#
# Filtering `shot_probe`/`screenshots` OUT before the list phase (this file's
# `default-filter`, below) avoids the failure — confirmed:
#
#   $ cargo nextest list --manifest-path workspace/gui/Cargo.toml \
#       -E 'binary(=shell_flow) or binary(=adversarial)'
#   ... lists 29 tests (23 in adversarial, 6 in shell_flow) cleanly.
#
# So: nextest IS the entry point for `shell_flow`/`adversarial` (both use
# `#[gpui::test]` over `TestAppContext`, no real platform/AppKit/Metal, and
# list/run through nextest exactly like ordinary libtest tests — verified in
# the listing above). nextest is NOT usable for `screenshots`/`shot_probe` at
# all; they must keep running via plain `cargo test --test screenshots -- >
# --nocapture` / `cargo test --test shot_probe`, one at a time, never
# alongside anything else that touches the GPU or builds this workspace (see
# `gui-serial` below and `.config/scripts/nextest-suite.nu`, which runs them
# as a separate, later, non-nextest step for exactly this reason). This is a
# real gap in "nextest as the single entry point" for this workspace — worth
# flagging loudly rather than papering over: two of the four test binaries
# here are permanently outside nextest's reach on this nextest version,
# through no misconfiguration.
nextest-version = "0.9.131"

[store]
dir = "target/nextest"

[test-groups.gui-serial]
# AGENTS-DOCTRINE.md §8 / this track's constraint 1: GPUI tests cannot run
# concurrently with each other or with anything else that builds
# `workspace/gui` — concurrent cargo invocations against the shared
# `target/` corrupt the build-script cache (observed:
# `dyld: Library not loaded: @rpath/libclang.dylib`, half-populated
# `gpui-*` build dirs under `target/debug/build/`), and a real-crate lowering
# elsewhere in the repo has been measured at 21.9s idle vs 44.6s under that
# same contention — a 2x swing with no code change. `shell_flow` and
# `adversarial` both construct a `TestAppContext` (headless/simulated, no
# AppKit/Metal), so the risk here is specifically the BUILD-time cache
# corruption, not GPU contention — but that risk exists the moment two cargo
# processes touch this package's `target/` at once, regardless of what the
# tests themselves do at runtime. Every test in this workspace that nextest
# can run at all is therefore assigned to this one group, capped at one
# slot. `.config/scripts/nextest-suite.nu` additionally never runs this step
# concurrently with anything against the ROOT workspace's `target/` or with
# the direct `cargo test --test screenshots`/`shot_probe` invocations —
# max-threads on a group only serialises *within* one nextest run, not
# across separate process invocations, so the script also enforces strict
# sequencing at the shell level.
max-threads = 1

[profile.default]
# Fast local iteration for the two nextest-compatible GUI suites. All 29
# tests (2026-08-05 count) go through `gui-serial`, so "high concurrency" in
# the sense the root config's `default` profile means it does not apply here
# — the GPUI build-script hazard overrides it; see `gui-serial` above. This
# is still the "default" profile in the sense that matters for a developer:
# no `--run-ignored` flag needed, no fixture prerequisites, and it is the
# thing to run after editing `workspace/gui/src/`.
default-filter = 'not (binary(=screenshots) or binary(=shot_probe) or binary(=repair_paint))'
test-threads = 1
slow-timeout = { period = "30s", terminate-after = 3, on-timeout = "fail" }
success-output = "never"

[profile.ci]
# Same test selection as `default` (there is no separate slow/real-crate tier
# inside this workspace) but with CI's usual retry/report shape, mirroring
# the root file's `ci` profile. `success-output = "final"` for the same
# `cost case=` reason as the root file's `ci` profile — `shell_flow.rs` and
# `adversarial.rs` do not currently call `nudox_test_support::measured()`
# (grep confirms no `measured(` call site under `workspace/gui/tests/`), so
# this profile has no cost lines to lose today, but it is set for parity and
# so a future `measured()` call in this workspace is not silently swallowed.
default-filter = 'not (binary(=screenshots) or binary(=shot_probe) or binary(=repair_paint))'
test-threads = 1
retries = 1
slow-timeout = { period = "30s", terminate-after = 4, on-timeout = "fail" }
status-level = "all"
final-status-level = "all"
success-output = "final"
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
report-name = "lindsey-ci"
store-success-output = true
store-failure-output = true

[[profile.default.overrides]]
filter = 'all()'
test-group = "gui-serial"
