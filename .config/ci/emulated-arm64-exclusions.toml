# Tests excluded from the emulated arm64 lane (.config/ci/emulated.nu), one exact
# nextest filter each, with its category and the first error it showed.

[[exclude]]
filter = "binary_id(backend-compile) and test(=embedding::tests::persistent_reply_padding_poison_is_observed_before_cache_publication)"
category = "emulation-timing"
reason = "timing-sensitive: fails about two runs in three under QEMU user mode (roughly 10x slower) and passes in the native Linux lane"

