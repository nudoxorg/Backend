# Rejects wildcard error mapping that erases the rejected source value.
# Requires conversion paths to retain typed causes for reporting and recovery.
# Covers the direct closure shape while semantic conversions remain a Dylint concern.
id: preserve-error-cause
message: Preserve the rejected error in a typed cause instead of discarding it.
note: Replace the wildcard with a named source and carry it in the returned error.
severity: error
language: Rust
rule:
  pattern: $VALUE.map_err(|_| $ERROR)
