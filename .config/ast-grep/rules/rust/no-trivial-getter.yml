# Flags public getters that add no invariant, conversion, or abstraction.
# Prefers direct fields or transparent borrowed views when construction is sufficient.
# Keeps meaningful computed accessors outside this deliberately narrow syntax match.
id: no-trivial-getter
message: Expose the field or a transparent view instead of a logic-free getter.
note: Public fields are preferred when construction already guarantees their invariant.
severity: warning
language: Rust
rule:
  pattern:
    context: |
      impl Example {
        pub fn $METHOD(&self) -> $RETURN {
          self.$FIELD
        }
      }
    selector: function_item
