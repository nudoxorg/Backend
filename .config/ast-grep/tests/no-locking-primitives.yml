# Contrasts explicit atomics and ownership transfer with common shared lock spellings.
# Proves nested locks remain visible to the syntax matcher inside generic wrappers.
# Leaves alias and semantic sharing mutants to the registered Dylint fixtures.
id: no-locking-primitives
valid:
  - "struct Shared { state: AtomicUsize }"
  - "struct Owner { channel: Sender<Event> }"
invalid:
  - "struct Shared { state: Mutex<State> }"
  - "struct Shared { state: Arc<RwLock<State>> }"
