[interpretation_forks]
journal_ordinal = "Content-addressed journal has no generation counter; 'generation number' is implemented as a persisted chain ordinal (1,2,...) with parent (root,dep_set) linkage; divergence = different content claiming the same next chain position."
render_pub = "'drop pub prefix vocabulary' = Visibility::Unknown renders an empty prefix; 'pub ' remains exclusively Rust Public truth (only the rust lane emits it). C-pure headers render bare."
computed_edges = "Computed children may target any declared row both ways plus strictly-earlier computed rows (nested computed trees exist today); declared->computed stays forbidden; DAG proof intact."
interface_cause = "compiler-vocabulary cannot depend on ir-vocabulary, so the interface cause is bounded (ordinal/class); full FactFault operands are retained on CompileFailure (driver public terminal)."
