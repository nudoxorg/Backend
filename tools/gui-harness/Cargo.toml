[package]
name = "backend-gui-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic GPUI CE screenshot and interaction regression harness for Nudox desktop"

[lib]
path = "src/lib.rs"

[[bin]]
name = "backend-gui-harness"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { workspace = true, features = ["test-support"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

# Windows windows draw with wgpu in this workspace (apps/desktop); the headless
# renderer is that same renderer's offscreen target, offered only with `wgpu`.
[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true, features = ["test-support", "wgpu"] }

# `tests/headless_pixels.rs` chooses the adapter policy directly.
[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui_wgpu = { package = "gpui_ce_wgpu", version = "=0.1.0", features = ["test-support"] }

[lints]
workspace = true
