# Corpus manifest — reproducible package corpus for nudox
# Each entry specifies packages by ecosystem, name, and version with content hash.
# Multiple versions of the same package are grouped together.
#
# Seven ecosystems, 20 representative packages each: crates.io, go, maven,
# nuget, npm, pypi, cpp. `hash` is a nix-base32-encoded sha256 of the exact
# bytes at `url` (or the ecosystem's computed URL convention, if no `url` is
# given — see corpus/README.md for what each ecosystem fetches and why, and
# how to add a package). corpus/fetch.nu verifies every hash before
# extracting anything.
#
# Not every entry is a representative library. Some are provisioned only so a
# representative package's compile closure resolves — `role = "dependency"`
# marks those. maven has 43 of them (the Java producer needs a real classpath;
# see `workspace/compiler/languages/java/src/producer.rs`'s module doc), every
# other ecosystem currently has none.
#
# There is also one non-`[[packages]]` array at the very bottom of this file:
# `[[jpms_modules]]`, six COMPILED jars that exist only so `javac` can resolve
# a JPMS module descriptor with no source form. They are never extracted,
# never on any `-sourcepath`, and never lowering input. Read that section's
# header before adding to it — the separate array is the enforcement, and the
# bar for what belongs in it is narrow and stated there.
#
# The role is a field rather than a comment because it changes what the repo
# owes each entry. `corpus/entry-baseline.toml` must state a measured outcome
# for every *representative* package — that is the check which catches a
# producer silently degrading — but a dependency jar's own entry count is a
# number nobody wants: `jsr305`'s count says nothing about whether guava lowers.
# Until 2026-08-08 the distinction existed only in prose here, and every
# per-ecosystem total in CORPUS-SWEEP.md silently excluded `reactive-streams`
# without saying so, which made the published arithmetic look wrong to anyone
# who checked it against this file.
#
# Omitting `role` means representative, so forgetting the field makes a package
# MORE scrutinised, not less. `corpus/fetch.nu` fetches both roles identically
# and the on-disk presence check covers both: a missing dependency breaks its
# dependent just as surely, and fails with a diagnostic naming neither.

