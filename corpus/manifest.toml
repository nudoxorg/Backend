# cpp — no package registry exists for C++, so there is no computed URL
# convention (unlike every other ecosystem above): every version pins an
# explicit `url`. Where the upstream project publishes a maintainer-uploaded
# GitHub Release asset, that asset is used (stable: it is a stored blob,
# never regenerated). Where it does not, the fallback is a GitHub tag source
# archive (`/archive/refs/tags/<tag>.tar.gz`) — usually stable, but GitHub
# has in the past regenerated these bytes for unrelated infrastructure
# reasons; corpus/fetch.nu's hash check turns any future drift into a loud
# failure instead of a silent corpus change. See corpus/README.md for exactly
# which entries below use which. nlohmann-json carries two versions for
