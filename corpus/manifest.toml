# Consequence: a version bump of kafka-clients MUST re-derive this list from
# the new tag's `gradle/dependencies.gradle` plus a fresh import grep. A
# POM-only check will silently miss half of it and this entry will regress
# out of `tests/corpus_sweep.rs`'s `known_good` list. That is a real, ongoing
# maintenance cost, recorded here rather than used as an excuse to skip the
# package.
