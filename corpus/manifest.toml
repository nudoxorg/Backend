# Unlike every other closure in this file, kafka-clients' is *not derivable
# from its published Maven metadata at all*. Its POM lists 4 dependencies,
# all `runtime` scope; its real compile-time imports (grepped out of the
# sources jar, which is the only trustworthy source here) are:
