# ===========================================================================
# jpms_modules — the ONLY compiled artifacts in this corpus, and a separate
# top-level array from `[[packages]]` precisely so that stays true.
# ===========================================================================
#
# Every `[[packages]]` maven entry is a sources jar, because "asking for
# anything else would hand the producer bytecode instead of Java"
# (corpus/README.md). That rule is about what gets *lowered*. The six entries
# below are never lowered, never extracted, and never reachable as source:
# `corpus/fetch.nu` copies each `.jar` verbatim into `.real-crates/.module-path/`,
# a dot-directory `JavaProducer::sourcepath_entries` skips, and the only flag
# any of them is ever passed to is `--module-path`. A `PackageSource::root`
# is always a `[[packages]]` directory, and `discover_java_sources` would find
# zero `.java` files in a directory of jars even if one were aimed at it. The
# separate array is what makes "a binary jar accidentally becomes lowering
# input" structurally impossible rather than merely discouraged.
#
# The exception exists because `javac`'s module system has three positions no
# source artifact can fill. Each entry below states which one it is:
#
#   (a) the artifact's own sources jar omits `module-info.java` entirely —
#       only the compiled jar carries the descriptor;
#   (b) the artifact's source `module-info.java` `requires` an AUTOMATIC
#       module (a name derived from a jar filename), which by definition has
#       no source form;
#   (c) the consuming target has no `module-info.java` of its own, so it
#       cannot use `--module-source-path` at all — `javac` rejects that
#       option in the same invocation as `-sourcepath`, which the target
#       needs for its non-modular dependencies.
#
# Hashes come from `nu corpus/fetch.nu hash-module <group:artifact> <version>`,
# a deliberately separate subcommand from `hash-url` so that reaching for a
# compiled jar is always an explicit act.

# (a) logback-classic: `requires org.slf4j;` — mandatory, not `static`.
# `slf4j-api-2.0.12-sources.jar` has no `module-info.java` anywhere; the
# binary carries one only under the multi-release path
# `META-INF/versions/9/module-info.class`. Verified with `unzip -l` on both.
[[jpms_modules]]
name = "org.slf4j:slf4j-api"
versions = [
  { version = "2.0.12", hash = "0izdyyncrag2h2dlyr9mdlnni220d8i92xm28ql75gfzmfw055d7" },
]

# (b) logback-classic: `requires ch.qos.logback.core;`. logback-core's sources
# jar DOES carry a real `module-info.java` — and that is exactly the problem:
# it says `requires static janino;`, `requires static commons.compiler;`, and
# `requires static org.fusesource.jansi;`. `janino` and `commons.compiler` are
# automatic module names (derived from `janino-3.1.8.jar` /
# `commons-compiler-3.1.8.jar`), so compiling logback-core from source fails
# with `module not found: janino` no matter what else is provisioned —
# reproduced directly before choosing the compiled jar. Resolving logback-core
# as a compiled module instead does not follow its `requires static` edges,
# and logback-classic then compiles clean.
[[jpms_modules]]
name = "ch.qos.logback:logback-core"
versions = [
  { version = "1.4.14", hash = "14x22xk3v4f68ij3k3zda1w1d0005xww21wmfd91h2sk89gz1hpq" },
]

# (a) junit-jupiter-api: `requires transitive org.opentest4j;`, and
# assertj-core transitively. `opentest4j-1.3.0-sources.jar` has no
# `module-info.java`; the binary jar has a plain (non-multi-release) one at
# its root. The *sources* jar is separately provisioned as an ordinary
# `role = "dependency"` package above, because mockito-core resolves
# `org.opentest4j` the normal `-sourcepath` way — the two coexist and serve
# different mechanisms.
[[jpms_modules]]
name = "org.opentest4j:opentest4j"
versions = [
  { version = "1.3.0", hash = "06rgfkgjss4qfprhpvrnn9y64m93pf5gzkadsv766rdbdiixzqj8" },
]

# (c) assertj-core only. Its 4 JUnit-Jupiter soft-assertion files import
# `org.junit.jupiter.api.extension` and `org.junit.platform.commons.support`,
# and assertj-core has no `module-info.java`, so `--module-source-path` is
# unavailable to it (it needs `-sourcepath` for byte-buddy, hamcrest and
# opentest4j sources, and `javac` refuses both options at once:
# "cannot specify both --source-path and --module-source-path"). The three
# entries here plus opentest4j above, on `--module-path` with
# `--add-modules ALL-MODULE-PATH`, are the only combination that resolves
# them. junit-jupiter-api's and junit-platform-commons' SOURCES are still what
# junit-jupiter-api itself lowers from; these compiled copies exist solely so
# a *different* package's four files can resolve their imports.
[[jpms_modules]]
name = "org.apiguardian:apiguardian-api"
versions = [
  { version = "1.1.2", hash = "0f0bnysya4gil4r1hx7ch9sh0waxngq3f98qkwqhgmh6qn5482dm" },
]

