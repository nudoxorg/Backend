# reactive-streams is not a documented corpus package in its own right (it is
# 4 tiny interfaces, not one of the 20 libraries the maven corpus was chosen
# to represent). It is provisioned solely as rxjava's one and only external
# compile-time dependency: `io.reactivex.rxjava3:rxjava`'s sources import
# `org.reactivestreams.{Publisher,Subscriber,Subscription,Processor}`
# directly, and every one of that package's ~2200 javac errors (see
# nudox-producer-java's tests/corpus_sweep.rs) traces to this one missing
# artifact -- verified by rerunning javadoc with `-Xmaxerrs 100000` and
# confirming `org.reactivestreams` is the *only* `does not exist` package
# reported. `JavaProducer::invoke` now adds `-sourcepath <corpus root>` (see
# that module's doc comment) so a sibling checkout like this one is
# resolvable without per-package classpath wiring.
