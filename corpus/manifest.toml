# httpclient5 source file imports (annotation, http, http.protocol, util). Both
# are declared compile deps in httpclient5-parent's ${httpcore.version}.
#
# Provisioned 2026-08-08 after the sweep caught a MASKED blocker -- not a wrong
# one. httpclient5 was pinned as "blocked on org.conscrypt", which is true, but
# javadoc never got that far: it stopped at `package org.apache.hc.core5.annotation
# does not exist`, because httpcore5 had been identified as needed and then never
# added. With that fixed the conscrypt blocker is the real and only one, and its
# pinned test passes.
