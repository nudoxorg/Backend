# Root virtual manifest for the Backend Cargo workspace.
#
# Dual-built crates (heart, ir, registry) keep their BUCK files so the Buck2
# compiler build can compile them from the same source. compiler is Buck2-only
# and is NOT a member here.
#
# After the streamlining, the small utility crates were consolidated:
# caching/cas/telemetry/version folded into `heart` (content-addressed storage
# and the stampede cache now live in `heart::cache`); runtime/protocol folded
# into `registry` (the single serving crate); sandbox was dropped.
[workspace]
resolver = "3"
members = [
    # The per-ecosystem spec crate (ECOSYSTEM-PLAN): the leaf everything else
    # reads "what does ecosystem X need?" from. `Language` lives here; heart
    # re-exports it.
    "workspace/ecosystem",
    "workspace/heart",
    # ── INDEX catalog plane (INDEX-PLAN) ─────────────────────────────────────
    # rusqdoltlite binds the vendored DoltLite engine (versioned SQLite);
    # index is the catalog crate (schema v4, MetaStore, outbox, migrations);
    # ingestor is the feed/git-monitor process plane.
    "workspace/rusqdoltlite",
    "workspace/index",
    "workspace/ingestor",
    # ObjectPack (INDEX-PLAN §6): the one container family for source trees,
    # goldens, and compile stages; range-addressable zstd members + TOC.
    "workspace/object-pack",
    "workspace/ir",
    "workspace/registry",
    "workspace/server",
    # ── Sealed-compute plane (SMOLVM-PLAN) ───────────────────────────────────
    # sandbox rejoins the cargo workspace: it is the home of SmolvmCage and the
    # budget/typestate layer; ir-stream is the guest→host IR streaming protocol.
    "workspace/compiler/sandbox",
    "workspace/ir-stream",
    "workspace/ir-sync",
    "workspace/nudox-sync",
    # ── IR-native VCS plane ──────────────────────────────────────────────────
    # The IR data model + serve archive + generation identity are the domain;
    # libpijul (via nudox-ir-vcs) is the change engine — we do NOT reimplement
    # patch theory. `nudox-ir-channel` is retired (its custom in-memory change
    # store was exactly that reimplementation) and is no longer built.
    "workspace/nudox-change",
    "workspace/nudox-ir",
    "workspace/nudox-ir-archive",
    "workspace/nudox-ir-manifest",
    "workspace/nudox-ir-vcs",
    # Semantic classification plane (SEMANTIC-IR-VCS-PLAN P3–P5): structural
    # delta projection + IR-only ApiSurface/semver. Engine-neutral (no libpijul).
    "workspace/nudox-ir-diff",
    "workspace/nudox-semver",
    # Depth-1 structured record (DEPTH1 plan §3): the frozen F1 key registry +
    # the field-aware pairing function. Leaf crate; the vendored libpijul fork
    # links it as its only nudox dependency.
    "workspace/nudox-f1",
    # ── Vector plane (09-vector §20 / 09b / 09c) ─────────────────────────────
    # vector-core is the pure shared plane (recipe, embed_key, routing,
    # admission, store traits); vector-local is the qdrant-edge client store;
    # vector-embed is the fastembed/ort CPU-canonical runtime (feature "onnx");
    # vector-remote is the qdrant-client parity/premium + Voyage/rerank plane.
    "workspace/vector-core",
    "workspace/vector-local",
    "workspace/vector-embed",
    "workspace/vector-remote",
]

# Depth-1 structured record (DEPTH1 plan §2): every `libpijul = "=1.0.0-beta.11"`
# requirement in the workspace resolves to the vendored fork (build metadata
# `+nudox.N` is ignored in semver comparison). Fork diff = src/diff/diff.rs +
# Cargo.toml only; regenerable patch at workspace/vendor/libpijul-fork.patch.
[patch.crates-io]
libpijul = { path = "workspace/vendor/libpijul" }
# qdrant-edge 0.7.2 verbatim except `#![recursion_limit = "256"]` in lib.rs:
# objc2 (pulled by iroh/netdev on macOS) adds a recursive blanket impl that
# overflows the default trait-solver limit inside qdrant-edge's anonymize.rs.
qdrant-edge = { path = "workspace/vendor/qdrant-edge" }

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"

[workspace.lints.clippy]
result_large_err = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
