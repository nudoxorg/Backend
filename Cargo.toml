# Root virtual manifest for the Backend Cargo workspace.
#
# Dual-built crates (heart, ir, registry) keep their BUCK files so the Buck2
# compiler build can compile them from the same source. compiler is Buck2-only
# and is NOT a member here.
#
# After the streamlining, the small utility crates were consolidated:
# caching/cas/telemetry/version folded into `heart` (content-addressed storage
# and the stampede cache now live in `heart::cache`); runtime/protocol folded
# into `registry` (the single serving crate); sandbox was dropped.
[workspace]
resolver = "3"
members = [
    # The per-ecosystem spec (ECOSYSTEM-PLAN) is now folded into the catalog
    # crate as `index::ecosystem` — it is used only by `index` (whose
    # `index::server` module composes `index` into the serving binary).
    # `Language` itself lives in `heart` (the light shared vocabulary), keeping
    # the index-free planes (`ir`, `registry`) off the catalog link path.
    "workspace/heart",
    # Zero-dependency integration-test measurement helper (`measured`, the
    # `cost case=…` line doctrine §4 parses). Shared across the whole tree —
    # `index`, every `compiler/languages/*`, and the local-first crates all
    # dev-dep it — so it lives beside the other shared workspace crates rather
    # than under `crates/` (relocated from `crates/nudox-test-support`, package
    # name unchanged). Dev-dependency only; on no crate's shipping graph.
    "workspace/test-support",
    # ── INDEX catalog plane (INDEX-PLAN) ─────────────────────────────────────
    # rusqdoltlite (now under vendor/) binds the vendored DoltLite engine
    # (versioned SQLite); it is a path dep of `index`, not a workspace member.
    # index is the catalog crate (schema v4, MetaStore, outbox, migrations);
    # the feed/git-monitor process plane now lives in `index::ingest` (the
    # `ingest` binary is built from the index crate).
    "workspace/index",
    # ObjectPack (INDEX-PLAN §6): the NDPK container family is now folded into
    # the storage layer as `index::pack` (§8: object-pack is part of index).
    # Legacy `ir` crate (old JSON schema) deleted — dead (superseded by nudox-ir).
    "workspace/registry",
    # The composition/serving layer (§8) — the ONLY place `index` + `registry`
    # + `heart::client` are composed into an axum binary — now lives inside
    # `index` itself as `index::server` (the `nudox-serve` binary is built
    # from `workspace/index/server/main.rs`). The formerly standalone
    # `driver` crate was folded in and retired.
    # ── Sealed-compute plane (SMOLVM-PLAN) ───────────────────────────────────
    # sandbox rejoins the cargo workspace: it is the home of SmolvmCage and the
    # budget/typestate layer; ir-stream is the guest→host IR streaming protocol.
    "workspace/compiler/sandbox",
    # ir-sync folded into nudox-ir::sync (heart::sync trait impls)
    # ── IR-native VCS plane ──────────────────────────────────────────────────
    # The IR data model is split into a light, libpijul-FREE `ir` (the model
    # everyone reads — entry/symbol/kind/wire/change/view/vocab/…) and a heavy
    # `ir-vcs` (the libpijul/iroh-linked patch engine / serve / diff / semver /
    # transfer). `registry` reads only the light `ir` and no longer transitively
    # links libpijul.
    "workspace/ir/vcs",
    # ── Shared content-transfer plane (CONSOLIDATION-NOTES §8b/§8c) ───────────
    # `transport` is the ONE shared iroh/bao content-transfer crate, extracted
    # back OUT of `index::transport` into its own crate so `ir-vcs` depends on it
    # (not on all of `index`) — breaking the `index ↔ ir-vcs` cycle that folding
    # the server composition into `index` (server-dissolve) would create. Both
    # `index` (pack + server) and `ir-vcs` (nudox_ir::sync) dep it; `index`
    # re-exports it as `index::transport` so existing paths are unchanged.
    "workspace/transport",
    # (historical) The transport crate had been folded into `index::transport`. Heart stays
    # iroh-free (only the `heart::sync` seam); the concrete iroh/iroh-blobs/
    # bao plumbing lives once as a module of the index package, removed from
    # the workspace member list. No per-plane bespoke bao/iroh.
    # ── nudox-ir crate (PR #2: ir-refactor) ──────────────────────────────────
    "workspace/ir/model",
    # ── Producer plane: shared contract + one crate per language ─────────────
    "workspace/compiler/producer",
    "workspace/compiler/languages/go",
    "workspace/compiler/languages/csharp",
    "workspace/compiler/languages/rust",
    "workspace/compiler/languages/typescript",
    "workspace/compiler/languages/clang",
    "workspace/compiler/languages/java",
    "workspace/compiler/languages/python",
    # ── Local-first GUI planes (GUI-LOCAL-PLAN §L0) ──────────────────────────
    # store → graph → engine → mcp. `lindsey` (workspace/gui) is deliberately
    # NOT a member: it keeps its own lockfile so gpui stays out of the backend
    # graph, and reaches these four by path. Dependency law, one direction only:
    # lindsey → engine → {graph, store} → ir; mcp → {engine, graph}; and none of
    # the four may link gpui.
    "workspace/nudox-store",
    "workspace/nudox-graph",
    "workspace/nudox-engine",
    "workspace/nudox-mcp",
    # The production embedder adapter (docs/AGENTS-DOCTRINE.md §1, "Capability
    # ports"): bridges `registry`'s ONNX runtime to `nudox-engine`'s `Embedder`
    # port, beside the engine rather than beneath it. Its `onnx` feature is
    # off by default, so a `--workspace` build never pulls the ort runtime.
    "workspace/nudox-embed",
]

# `rusqdoltlite` is a *path dependency* of `index` (behind the off-by-default
# `dolt-engine` feature), not a member. Cargo auto-promotes in-tree path deps to
# members unless excluded, which is why this list has to say so out loud: without
# it, `cargo check --workspace` tries to compile `vendor/doltlite/doltlite.c`, a
# ~20 MB generated amalgamation that is deliberately not committed (see
# `workspace/vendor/doltlite/VENDORING.md`). Excluding it makes the comment at
# the top of `members` true instead of aspirational.
#
# `qdrant-edge` is a `[patch.crates-io]` entry with vendored C++ sources (cpp/)
# that are deliberately not committed. Like rusqdoltlite, it must be excluded
# from the workspace so `cargo check --workspace --all-targets` does not attempt
# to compile it. The patch entry remains valid: when registry's `local` feature
# is enabled, Cargo will use the patched version; when disabled, Cargo will skip
# compiling qdrant-edge entirely.
exclude = ["workspace/vendor/rusqdoltlite", "workspace/vendor/doltlite", "workspace/vendor/qdrant-edge"]

# Depth-1 structured record (DEPTH1 plan §2): every `libpijul = "=1.0.0-beta.11"`
# requirement in the workspace resolves to the vendored fork (build metadata
# `+nudox.N` is ignored in semver comparison). Fork diff = src/diff/diff.rs +
# src/nudox_f1/ + Cargo.toml; regenerable patch at workspace/vendor/libpijul-fork.patch.
[patch.crates-io]
libpijul = { path = "workspace/vendor/libpijul" }
# qdrant-edge 0.7.2 verbatim except `#![recursion_limit = "256"]` in lib.rs:
# objc2 (pulled by iroh/netdev on macOS) adds a recursive blanket impl that
# overflows the default trait-solver limit inside qdrant-edge's anonymize.rs.
qdrant-edge = { path = "workspace/vendor/qdrant-edge" }

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"

[workspace.dependencies]
bon = "3.9"
clang = "1.0"
elsa = "1.11"
indexmap = "2"
itertools = "0.15"
ouroboros = "0.18"
papaya = "0.2"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# `nix/corpus.nix` and `nix/entry-baseline.toml` are read by tests in
# more than one crate (`workspace/index`, `nudox-store`). Declared once here so
# two readers of the same corpus files cannot end up on different toml majors
# and disagree about what the corpus contains.
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
triomphe = "0.1"
vfs = "0.13"
# ── Local-first GUI planes (GUI-LOCAL-PLAN) ──────────────────────────────────
# The trustfall fork is pinned by rev, not branch: LD-10 pin discipline applies
# to it exactly as it does to gpui. We need two things upstream 0.8.1 lacks — a
# real `Adapter::Error` channel (LR-6) and the `AsyncAdapter` stream engine,
# whose result stream is `!Send` and therefore drives the engine's LocalSet.
trustfall = { git = "https://github.com/philocalyst/trustfall", rev = "7e71e35715dfac561e3453c834b469a200330997", features = ["async"] }
# `trustfall_core` is already resolved transitively through `trustfall` above
# (same git rev — see LD-10 note); named directly here only so
# `nudox-engine::query` can downcast `execute_query_async`'s `anyhow::Error`
# to `trustfall_core::frontend::error::FrontendError` and recover the
# line/column a parse error carries but `Display` drops. No new source is
# fetched — this pins the *name*, not a second copy of the crate.
trustfall_core = { git = "https://github.com/philocalyst/trustfall", rev = "7e71e35715dfac561e3453c834b469a200330997" }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
flume = "0.11"
schemars = "1"
tracing = "0.1"
# Untrusted-archive ingest. `index::ingest::archive` sanitizes tar and zip
# uploads; `index::server` re-extracts the same shapes on the serving side. Declared
# once here so the two cannot drift onto different zip majors and disagree about
# what a given archive contains — a divergence that would land as a security
# difference, not a build error. `default-features = false` keeps bzip2/zstd/aes
# C dependencies out; `deflate` is the only method these packs use besides
# `Stored`.
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.clippy]
result_large_err = "allow"
too_many_arguments = "allow"

[profile.release]
lto = "thin"
