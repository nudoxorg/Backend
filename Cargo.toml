
[workspace]
resolver = "3"
members = [
  "./source/server",
  "./source/core",
  "./source/store",
  "./source/search",
  "./source/blobstore",
  "./source/embed",
  "./source/identity",
  "./source/document",
  "./source/orchestrator",
  "./source/pipeline",
  "./source/intermediate-representation",
  "./source/intermediate-representation/pipeline",
  "./source/parsers/rust",
  "./source/parsers/typescript",
]
default-members = ["./source/server"]
exclude = ["deno_doc"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nudox-document = { path = "./source/document" }
nudox-identity = { path = "./source/identity" }
ir = { path = "./source/intermediate-representation" }
nudox-ir-types = { path = "./source/intermediate-representation/pipeline" }
yoke = { version = "0.8", features = ["derive"] }
arborium-tree-sitter = "2"
arborium = { version = "2", default-features = false }

# nudox-occurrences shared deps
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
object_store = "0.11"
tantivy = "0.22"
qdrant-client = "1.13"
url = "2"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "uuid"] }
tokio-test = "0.4"
insta = { version = "1", features = ["json", "redactions"] }

