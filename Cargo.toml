# Defines the complete four-boundary Rust workspace.
# Keeps product code inside four explicit architectural boundaries.
# Centralizes dependency, lint, and release policy for every crate.
[workspace]
resolver = "3"
members = [
    "compiler/*",
    "compiler/languages/*",
    "heart/*",
    "interface/*",
    "server/journal",
    "server/operation",
    "server/runtime",
    "server/workflow",
    "server/index/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
allocation-counter = "0.8.1"
arrayvec = { version = "0.7.6", default-features = false }
atomic-waker = { version = "1.1.2", default-features = false }
async-channel = "2.5.0"
blake3 = { version = "1.8.2", default-features = false }
bolero = "0.13.4"
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
fearless_simd = { version = "0.7.0", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
futures-core = { version = "0.3.31", default-features = false }
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", default-features = false }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", default-features = false, features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
loom = "0.7.2"
opentelemetry = { version = "=0.32.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["logs", "metrics", "trace"] }
rstest = { version = "0.26.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tantivy = "0.26.1"
thiserror = { version = "2", default-features = false }
tracing = "=0.1.44"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
trybuild = "1.0.118"
trustfall = "=0.8.1"
ureq = "=3.4.0"
zerocopy = { version = "0.8.56", default-features = false, features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
alloc_instead_of_core = "warn"
allow_attributes_without_reason = "warn"
as_conversions = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "deny"
empty_drop = "warn"
expect_used = "warn"
exit = "deny"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
mem_forget = "deny"
missing_const_for_fn = "warn"
multiple_unsafe_ops_per_block = "deny"
panic = "warn"
rc_buffer = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_name_method = "warn"
semicolon_if_nothing_returned = "warn"
str_to_string = "warn"
todo = "deny"
too_many_arguments = "allow"
too_many_lines = "allow"
unimplemented = "deny"
unreachable = "warn"
unwrap_used = "deny"
verbose_file_reads = "warn"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1
