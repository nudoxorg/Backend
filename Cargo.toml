[workspace]
resolver = "3"
members = [
  "heart",
  "compiler",
  "compiler/intermediate-representation",
  "registry",
  "runtime",
  "server",
]
default-members = ["server"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ── Intra-workspace crates ─────────────────────────────────────────────────
heart = { path = "heart" }
ir = { path = "compiler/intermediate-representation" }
compiler = { path = "compiler" }
registry = { path = "registry" }
runtime = { path = "runtime" }

# ── TerminusDB schema + instance derives (graph-store model lives in
# compiler/graph). Git-only crate; pinned to the rev the lockfile resolves so a
# stray `cargo update` cannot silently advance to upstream HEAD.
terminusdb-schema = { git = "https://github.com/ParapluOU/terminusdb-rs", package = "terminusdb-schema", rev = "4fefb0434f65baa847af5af9fc00175b3e4d827b" }
terminusdb-schema-derive = { git = "https://github.com/ParapluOU/terminusdb-rs", package = "terminusdb-schema-derive", rev = "4fefb0434f65baa847af5af9fc00175b3e4d827b" }

# ── Error handling ─────────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ── Core vocabulary types ──────────────────────────────────────────────────
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
semver = { version = "1", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
ordered-float = { version = "4", features = ["serde"] }
enumset = { version = "1", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
nonempty = { version = "0.11", features = ["serialize"] }
nutype = { version = "0.6", features = ["serde"] }
generativity = "1"
bitflags = { version = "2", features = ["serde"] }
bytes = { version = "1", features = ["serde"] }

# ── Serialization ──────────────────────────────────────────────────────────
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
postcard = { version = "1", features = ["use-std"] }
bincode = "1"
rmp-serde = "1"
data-encoding = "2"

# ── Content addressing / hashing ───────────────────────────────────────────
blake3 = { version = "1", features = ["serde", "rayon", "mmap"] }
sha2 = "0.10"

# ── Ecosystem version grammars ─────────────────────────────────────────────
# crates.io + npm are SemVer; Python needs PEP 440 (epochs/post/dev/local).
uv-pep440 = "0.0"
uv-pep508 = "0.0"

# ── Async runtime + streaming ──────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"
futures = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
async-trait = "0.1"

# ── HTTP server surface ────────────────────────────────────────────────────
axum = { version = "0.8", features = ["macros", "http2"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "compression-full", "request-id", "catch-panic"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"

# ── HTTP client (terminus + sdist/registry fetch) ──────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# ── Compression + archive extraction (untrusted input) ─────────────────────
tar = "0.4"
flate2 = "1"
zstd = "0.13"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }

# ── Backing stores ─────────────────────────────────────────────────────────
object_store = { version = "0.11", features = ["aws", "gcp", "azure"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
# Typed, injection-proof SQL construction (no stringly-typed queries). The binder
# bridges sea-query statements onto sqlx-postgres with uuid/chrono/json support.
sea-query = { version = "0.32", features = ["derive", "backend-postgres", "with-uuid", "with-chrono", "with-json"] }
sea-query-binder = { version = "0.7", features = ["sqlx-postgres", "with-uuid", "with-chrono", "with-json"] }
qdrant-client = "1.13"
tantivy = "0.22"

# ── Resilience / caching / concurrency ─────────────────────────────────────
backon = "1"
moka = { version = "0.12", features = ["future"] }
arc-swap = "1"
dashmap = "6"
parking_lot = "0.12"
governor = "0.7"

# ── Secrets / config / net ─────────────────────────────────────────────────
secrecy = { version = "0.10", features = ["serde"] }
url = { version = "2", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }

# ── Observability ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# ── Allocator ──────────────────────────────────────────────────────────────
mimalloc = "0.1"

# ── ir-specific ────────────────────────────────────────────────────────────
facet = "0.42.0"
yoke = { version = "0.8", features = ["derive"] }
arborium-tree-sitter = "2"
arborium = { version = "2", default-features = false }
rustc-hash = "2"

# ── Pyrefly — Meta's Rust Python type checker. Pinned to the lockfile rev so
# the ruff-rev coupling in compiler/Cargo.toml stays stable across builds.
pyrefly = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }
pyrefly_types = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }
pyrefly_build = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }
pyrefly_config = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }
pyrefly_python = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }
pyrefly_util = { git = "https://github.com/facebook/pyrefly", rev = "3e17a690edbde7d1f2341864d6f1c6523ba207c5" }

# ── Dev / test ─────────────────────────────────────────────────────────────
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
trybuild = "1"
tempfile = "3"
wiremock = "0.6"
testcontainers = "0.23"
tokio-test = "0.4"

# ── Profiles ───────────────────────────────────────────────────────────────
[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
debug = "line-tables-only"

# The heavy producer/type-checker deps at -O0 make debug tests crawl.
[profile.dev.package."*"]
opt-level = 2

# Use the rocket-free vendored copy of terminusdb-schema everywhere it appears
# in the dependency graph (including transitively, e.g. via the derive crate).
[patch."https://github.com/ParapluOU/terminusdb-rs"]
terminusdb-schema = { path = "vendor/terminusdb-schema" }
