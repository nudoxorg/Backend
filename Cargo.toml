# Backend v2 is one acyclic versioned engine. Proven compiler semantics are
# retained as first-class workspace crates and adapted at product boundaries.
[workspace]
resolver = "3"
members = [
    "crates/*",
    "frontends/*",
    "extensions/*",
    "apps/*",
    "tests/*",
    "tools/*",
]
exclude = [
    ".config/dylint",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
allocation-counter = "0.8.1"
arrayvec = { version = "0.7.6", default-features = false }
atomic-waker = { version = "1.1.2", default-features = false }
axum = { version = "0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
async-channel = "2.5.0"
blake3 = { version = "1.8.2", default-features = false }
bolero = "0.13.4"
bytes = { version = "1.10.1", default-features = false }
derive_more = { version = "2.1.1", default-features = false, features = ["debug"] }
fearless_simd = { version = "0.7.0", default-features = false }
futures-core = { version = "0.3.31", default-features = false }
futures-executor = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["alloc"] }
flate2 = "1.1.10"
ignore = "0.4.33"
# Keep the entire CE family on one published GPUI type universe. Cargo.lock
# records registry checksums for each of these exact versions.
gpui = { package = "gpui-ce", version = "=0.2.2", default-features = false }
gpui_platform = { package = "gpui_ce_platform", version = "=0.1.0", default-features = false }
gpui_component = { package = "gpui_ce_components", version = "=0.2.0" }
loom = "0.7.2"
opentelemetry = { version = "=0.32.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["logs", "metrics", "trace"] }
parking_lot = "0.12.4"
proptest = "1.7.0"
quick-xml = "0.41.0"
rstest = { version = "0.26.1", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive", "rc"] }
serde_json = "=1.0.151"
sha2 = { version = "0.10.9", default-features = false }
sha1 = { version = "0.10.6", default-features = false }
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
smallvec = { version = "1.15.1", features = ["const_generics", "serde"] }
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tantivy = "0.26.1"
thiserror = { version = "2", default-features = false }
trybuild = "1.0.118"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8.23"
tracing = "=0.1.44"
tracing-opentelemetry = "=0.33.0"
tracing-subscriber = { version = "=0.3.23", features = ["registry"] }
tree-sitter = "=0.27.0"
trustfall = { git = "https://github.com/philocalyst/trustfall", rev = "5a0a8607fc5d972380437289b9a4ad1aa5150b09", features = ["async"] }
trustfall_core = { git = "https://github.com/philocalyst/trustfall", rev = "5a0a8607fc5d972380437289b9a4ad1aa5150b09", features = ["async"] }
turso = { version = "=0.8.0-pre.10", default-features = false }
ureq = { version = "=3.4.0", default-features = false, features = ["gzip", "json", "rustls"] }
zerocopy = { version = "0.8.56", default-features = false, features = ["derive"] }

[workspace.lints.rust]
# Audited low-level storage modules may opt into narrowly scoped unsafe code;
# all other workspace code inherits this denial.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
mem_forget = "deny"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
debug = 1
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[patch.crates-io]
gpui_ce_components = { path = "vendor/gpui_ce_components" }
