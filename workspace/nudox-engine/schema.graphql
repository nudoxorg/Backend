    # minted" is not "this key is fragile".
    keyIsContentDerived: Boolean
    name: String!
    signature: String!
    path: String
    kind: String!
    isPublic: Boolean!
    documentation: String!
    isDeprecated: Boolean!

    # The IR's full six-valued visibility, one of: Public, Private, Protected,
    # Internal, Package, Crate. `isPublic` answers only "is it Public", so a
    # `pub(crate)` item and a genuinely private one are indistinguishable
    # through it; this field is the faithful projection of
    # `nudox_ir::entry::Visibility` and is what a filter should use.
    visibility: String!

    # The deprecation note and version, when the producer recorded them.
    # Non-null only where `isDeprecated` is true — and `isDeprecated` being
    # true does not imply either is non-null, because the IR's `Deprecation`
    # carries two independent `Option`s.
    deprecationNote: String
    deprecationSince: String
    package: Package!
    members: [Symbol!]
    parent: Symbol
    usages: [Symbol!]
    mentions: [Symbol!]
    implementedBy: [Symbol!]
    subtypes: [Symbol!]
    returnedBy: [Symbol!]
    acceptedBy: [Symbol!]
    heldBy: [Symbol!]
    signatureTypes: [Symbol!]
    occurrencesOf: [Occurrence!]

    # Where this symbol's declaration was written. Never null: the IR has no
    # way to represent an entry without a location, because "we do not know"
    # is the `Unlocated` *value*, not an absence. Read `location { kind }`
    # before reading anything else on it.
    location: SourceLocation!
}

type Occurrence {
    targetKey: String!
    referenceKind: String!
    confidence: String!

    # Byte offsets **relative to the owning symbol's own span start**, not
    # absolute file offsets — this is `nudox_ir::vocab::RelSpan`, and reading
    # them as file positions is wrong by however far into the file the owner
    # begins. Traverse `owner { location { byteStart } }` for the base.
    spanStart: Int!
    spanEnd: Int!

    # The symbol whose body contains this reference. Never null: an occurrence
    # is stored on its owner, so it cannot exist without one.
    owner: Symbol!

    target: Symbol
}

# Where a declaration was written, as `nudox_ir::entry::SourceLocation` knows
# it. This is a projection of a *sum type* with three variants, and the whole
# point of exposing it as a vertex rather than as nullable columns on `Symbol`
# is that the third variant carries a reason which must not be flattened away.
#
# `kind` is one of:
#
#   "Declared"  — file, byte span and 1-based line/column are all present.
#                 The only value a jump-to-source affordance may use.
#   "BytesOnly" — file and byte span present; no line index was built, so
#                 `startLine`/`endLine`/`startColumn`/`endColumn` are null.
#   "Unlocated" — there is no location, and `unlocatedReason` says why.
#
# A reader that checks only `file != null` cannot distinguish
# `Unlocated(MacroExpanded)` — "this symbol genuinely has no source position"
# — from `Unlocated(ProducerRecordsNoLocation)` — "this producer has not been
# migrated yet". Those call for different product behaviour, so `kind` and
# `unlocatedReason` are the two fields to read first.
type SourceLocation {
    # "Declared" | "BytesOnly" | "Unlocated". Never null.
    kind: String!

    # Package-relative, `/`-separated. Null exactly when kind is "Unlocated".
    file: String

    # Half-open byte range within `file`. Null exactly when kind is
    # "Unlocated".
    byteStart: Int
    byteEnd: Int

    # 1-based line and column (column counted in UTF-8 bytes from the start of
    # the line). Non-null only when kind is "Declared".
    startLine: Int
    startColumn: Int
    endLine: Int
    endColumn: Int

    # WHY there is no location, one of: Synthesized, MacroExpanded,
    # ProducerRecordsNoLocation, OutsideDocumentedPackage. Non-null exactly
    # when kind is "Unlocated".
    unlocatedReason: String
}
