[package]
name = "nudox-engine"
description = "Local-first backend: corpus store, Trustfall graph, MCP server, and embedder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

# L3 of GUI-LOCAL-PLAN §L0: the streaming facade. Owns the runtimes (LR-9),
# the wire protocol (§L2) and the chunker (LR-3/LR-4). This is the ONLY crate
# `lindsey` talks to, and it is deliberately gpui-free so the whole protocol
# is testable without a window.
#
# The store, graph, embedder and MCP planes — formerly four sibling crates
# — were merged into this crate as the `store`, `graph`,
# `embed` and `mcp` modules (see `src/lib.rs`). Their dependencies, features
# and integration tests are merged below.

[features]
# `local-persistence` is on by default — see that feature's own comment for
# why a build that wants to shed libpijul/iroh/sanakirja should build with
# `--no-default-features --features <whatever else it needs>` instead.
default = ["local-persistence"]
# `store::source::fixtures` — deterministic synthetic corpora for tests and dev
# (LR-5). Same feature NAME as the store plane used, so consumers like
# `lindsey` keep working unchanged.
fixtures = []
# Forwards to `nudox-languages`'s own `pyrefly` feature (off by default there).
# Without it `PythonProducer::invoke` always returns `Ok(PythonOracle::default())`.
pyrefly = ["nudox-languages/pyrefly"]
# Forwards to `nudox-languages`'s own `seal-census` feature, which forwards to
# `nudox-ir`'s: test-only per-declaration disambiguator-tier instrumentation
# used by the `store_disambiguator_census` corpus measurement (`tests/store/
# disambiguator_census.rs`). Off by default; changes no production behaviour.
seal-census = ["nudox-languages/seal-census"]
# Wires `EngineConfig::ir_repo_root` to a real on-disk `ir-vcs::IrRepository`
# per resident package lineage (`store::persistence`), so produced IR survives
# a process restart — IR-STORAGE-PLAN §1a/P5.
#
# `ir-vcs` is a heavy, libpijul-linked dependency (GPL, pinned exactly; also
# pulls iroh and sanakirja — see `ir-vcs/Cargo.toml`'s own header). `index`
# gates the same crate behind its `server` feature and leaves it OFF by
# default for exactly this dependency-weight reason (see
# `workspace/index/Cargo.toml`'s `server` feature comment, which also records
# that the historical `ir-vcs → libpijul → zstd-seekable` / `index::pack`
# `zstd-sys` duplicate-symbol clash is fixed at the source in
# `workspace/vendor/zstd-seekable`, not merely avoided by feature gating — so
# enabling this feature alongside anything that links `zstd-sys` is safe, just
# heavier to build).
#
# This crate defaults it ON regardless, because `tests/local_persistence.rs`
# — the hook-free, non-vacuous proof that produced IR survives a restart —
# must pass under a plain `cargo test -p nudox-engine`, and because a host
# that never sets `EngineConfig::ir_repo_root` (the common case today) pays
# only the link-time cost, not a behavioural one: with `ir_repo_root: None`
# nothing under this feature ever touches disk. A build that must shed the
# dependency graph entirely (embedding this crate somewhere link size is
# fixed) should build with `--no-default-features`; `ir_repo_root` is still
# present on `EngineConfig` in that build (so the type is stable across
# feature combinations) but is silently inert — see that field's doc comment.
local-persistence = ["dep:ir-vcs"]

[dependencies]
nudox-ir = { path = "../ir/model" }
nudox-languages = { path = "../compiler/languages" }
heart = { path = "../heart" }
# Local, libpijul-backed IR persistence (`store::persistence`). Optional —
# see the `local-persistence` feature above.
ir-vcs = { path = "../ir/vcs", optional = true }
bytes = "1"
# The ONNX embedder runtime (`embed::onnx`), compiled in unconditionally —
# there is no `onnx` cargo feature. `features = ["onnx"]` is what turns on
# `registry`'s `FastembedOrt`. This is a ~483-crate addition to the graph
# whose `ort-sys` build fetches a prebuilt runtime at build time on every
# build of this crate, including a bare `cargo check`; see `embed/mod.rs`'s
# module docs for what that means for a build with no network access.
registry = { path = "../registry", features = ["onnx"] }

flume = { workspace = true }
futures = { workspace = true }
indexmap = { workspace = true }
pulldown-cmark = { workspace = true }
rustc-hash = { workspace = true }
# `heart::surface::{SigToken, SymbolHit}` fields are `smol_str::SmolStr`
# (`crate::surface`, the `Serve<Symbols>` adapter) — same version `heart`
# itself pins, so this adds no new dependency to the graph.
smol_str = { version = "0.2", features = ["serde"] }
# `schemars` + `serde` are what let the wire types *be* the MCP schema (LR-2):
# the MCP tools derive their schemas from these types rather than mirroring them
# by hand, so the protocol has exactly one definition.
schemars = { workspace = true }
serde = { workspace = true }
# Used only by `query.rs`'s `find_line_column` to walk a serialized `ParseError`.
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
# No `sync` feature: `tokio_util::sync::CancellationToken` is unconditional in 0.7.
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
triomphe = { workspace = true }
trustfall = { workspace = true }
# For downcasting `execute_query_async`'s `anyhow::Error` back to `FrontendError`.
trustfall_core = { workspace = true }

# ── On-demand package acquisition (`crate::acquire`) ─────────────────────────
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
    "http2",
    "stream",
    "json",
] }
sha2 = "0.10"
sha1 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { workspace = true }

# ── MCP server (`crate::mcp`, GUI-LOCAL-PLAN §L6) ────────────────────────────
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rand = "0.10"
rmcp = { version = "2.2", features = ["server", "transport-streamable-http-server", "macros"] }

# ── Platform credential store for the account key at rest
#    (`crate::mcp::account::store`) ────────────────────────────────────────────
# macOS reaches the Keychain directly via `security-framework`. Linux and
# Windows go through `keyring`, a thin facade over each OS's own vault:
# the freedesktop Secret Service (GNOME Keyring / KWallet) on Linux, and
# `CredReadW`/`CredWriteW` (Credential Manager) on Windows. Neither pulls a
# native build toolchain — both are FFI to system libraries.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
# Integration tests wrap their measured regions in `heart::cost::measured`
# (doctrine §4, formerly the `nudox-test-support` crate).
heart = { path = "../heart" }
# `tests/engine/purl_url_parity.rs` and `tests/store/corpus_contract.rs` read
# `nix/corpus.nix` and `nix/entry-baseline.toml`.
toml = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
trustfall = { workspace = true }
tempfile = "3"

