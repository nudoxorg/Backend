[package]
name = "nudox-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

# L3 of GUI-LOCAL-PLAN §L0: the streaming facade. Owns the runtimes (LR-9),
# the wire protocol (§L2) and the chunker (LR-3/LR-4). This is the ONLY crate
# `lindsey` talks to, and it is deliberately gpui-free so the whole protocol
# is testable without a window.

[features]
default = []
fixtures = ["nudox-store/fixtures"]

[dependencies]
nudox-ir = { path = "../ir/model" }
nudox-store = { path = "../nudox-store" }
nudox-graph = { path = "../nudox-graph" }

flume = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
# ── On-demand package acquisition (`crate::acquire`) ─────────────────────────
# Nothing here is new to the lockfile: `reqwest`/`rustls` are already what
# `workspace/{driver,index,registry}` use, and `zip` is a workspace dependency
# pinned once so two readers of the same archive cannot disagree about what it
# contains. The alternative — shelling out to `corpus/fetch.nu` — is rejected in
# `src/acquire/mod.rs`'s module docs, with reasons.
#
# `rustls-tls` rather than the default `native-tls`: same choice the three
# crates above already made, and it keeps a desktop build off the platform TLS
# stack. `stream` is what lets a download report byte progress instead of
# arriving all at once after a minute of silence.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "charset",
    "http2",
    "stream",
] }
sha2 = "0.10"
# Maven Central publishes SHA-1 sidecars and npm still publishes `dist.shasum`.
# Used only to *compare against a published digest*, never as the sole integrity
# claim — see `Integrity`'s docs.
sha1 = "0.10"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
zip = { workspace = true }
rustc-hash = { workspace = true }
# `schemars` + `serde` are what let the wire types *be* the MCP schema (LR-2):
# `nudox-mcp` derives its tool schemas from these types rather than mirroring
# them by hand, so the protocol has exactly one definition.
schemars = { workspace = true }
serde = { workspace = true }
# Used only by `query.rs`'s `find_line_column` to walk a serialized
# `ParseError` looking for its `Pos` field generically (see that function's
# docs) — not part of the wire protocol's own encoding.
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
# No `sync` feature: `tokio_util::sync::CancellationToken` is unconditional in
# 0.7 (the feature list is codec/compat/io/net/rt/time/tracing), so asking for
# one that does not exist fails resolution outright.
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }
triomphe = { workspace = true }
trustfall = { workspace = true }
# Only for downcasting `execute_query_async`'s `anyhow::Error` back to the
# typed `FrontendError` it wraps, to recover a parse error's line/column —
# see `query.rs`'s `extract_query_error_position`. No new source: same git
# rev as `trustfall` above, already resolved transitively.
trustfall_core = { workspace = true }



[dev-dependencies]
nudox-test-support = { path = "../test-support" }
# `tests/purl_url_parity.rs` reads `corpus/manifest.toml` to drive the
# comparison against `corpus/fetch.nu`. Same workspace pin `nudox-store`'s
# corpus tests use, so two readers of the same file cannot land on different
# toml majors and disagree about what the corpus contains.
toml = { workspace = true }
nudox-store = { path = "../nudox-store", features = ["fixtures"] }
nudox-producer = { path = "../compiler/producer" }
nudox-producer-rust = { path = "../compiler/languages/rust" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

# The packages_subscription integration tests exercise `Engine::start_with_fixtures`
# which lives behind the `fixtures` feature.  `cargo test` will skip this file
# unless --features fixtures is passed; the zero_jump tests have no such gate.
[[test]]
name = "packages_subscription"
required-features = ["fixtures"]

# Adversarial integration tests added 2026-07-27.
# search_adversarial requires the fixture corpus.
[[test]]
name = "search_adversarial"
required-features = ["fixtures"]

# Pins SECTION_SEMANTIC as empty BY DESIGN (LIMITATIONS.md L41). Needs the
# fixture corpus for the same reason `search_adversarial` does: the invariant is
# a conjunction — sections 0 and 1 must return real hits while section 2 stays
# empty — so it cannot be stated without a corpus that actually matches.
[[test]]
name = "semantic_section_contract"
required-features = ["fixtures"]

# hyperlink_flows and multi_package_flows and versions_adversarial use
# hand-built StaticSource packages (no fixture feature required).
[[test]]
name = "hyperlink_flows"

[[test]]
name = "multi_package_flows"

[[test]]
name = "versions_adversarial"

[[test]]
name = "protocol_adversarial"
required-features = ["fixtures"]

# Implementations and References emission tests — no fixture feature required.
[[test]]
name = "impls_refs_flows"

# End-to-end hyperlink test against real producer output (.real-crates fixture).
[[test]]
name = "real_producer_links"

[lints]
workspace = true
