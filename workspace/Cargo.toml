[workspace]
resolver = "3"
members = [
  "heart",
  "compiler",
  "compiler/intermediate-representation",
  "registry",
  "runtime",
  "server",
]
default-members = ["server"]

[workspace.package]
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Intra-workspace crates
heart = { path = "heart" }
ir = { path = "compiler/intermediate-representation" }
compiler = { path = "compiler" }
registry = { path = "registry" }
runtime = { path = "runtime" }

# Shared third-party deps
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
url = "2"
futures = "0.3"
semver = "1"
backon = "1"
nonempty = "0.11"
rustc-hash = "2"
nutype = "0.6"
generativity = "1"
object_store = "0.11"
qdrant-client = "1.13"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10"

# ir-specific
facet = "0.42.0"
yoke = { version = "0.8", features = ["derive"] }
arborium-tree-sitter = "2"
arborium = { version = "2", default-features = false }
tar = "0.4"
