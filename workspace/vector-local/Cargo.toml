# vector-local: the qdrant-edge embedded store plane of the dual local/remote
# vector-search architecture (09-vector PLAN §13/§20, 09c §1.1/§8.1).
#
# The pure shared plane lives in vector-core; this crate owns everything that
# touches disk or the Edge engine: the single-writer store actor, shard
# lifecycle, dep-shard install/evict, hot-set application, pack/unpack, and
# the multi-window advisory lock.
#
# NOTE: not yet listed in the root workspace `members` (root Cargo.toml is
# frozen for this change); add "workspace/vector-local" there to build.

[package]
name = "vector-local"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
vector-core = { path = "../vector-core" }
heart = { path = "../heart" }

# Pin the exact Edge beta: 0.x may rewrite the on-disk format (09c §1.1).
qdrant-edge = "=0.7.2"

tokio = { version = "1.52", features = ["sync", "rt", "macros", "time", "fs"] }
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
zstd = "0.13"
fs2 = "0.4"
tracing = "0.1"
uuid = { version = "1.23", features = ["v5"] }
smol_str = { version = "0.2", features = ["serde"] }
blake3 = "1.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.52", features = ["rt-multi-thread"] }
