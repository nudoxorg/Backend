[package]
name = "runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
heart = { workspace = true }
ir = { workspace = true }
nonempty = { workspace = true }
# Real backing clients: qdrant (vectors) over gRPC, terminus (graph) over HTTP.
qdrant-client = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
secrecy = { workspace = true }
# Async + streaming.
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
# Serialization / wire.
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
# Postgres — the durable watermark the text index polls from.
sqlx = { workspace = true }
# ModelId refinement (validated non-empty string).
nutype = { workspace = true }
# Errors + retry classification.
thiserror = { workspace = true }
# Upload sinks are tower services wrapped with heart's retry policy.
tower = { workspace = true }
# Observability.
tracing = { workspace = true }
# Embedding cache + rate limiting.
moka = { workspace = true }
governor = { workspace = true }
# Small strings for names/paths.
smol_str = { workspace = true }
# Enum display/parse derives on relation kinds etc.
strum = { workspace = true }
# The default text-search surface (replica-local, on spawn_blocking).
tantivy = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
tokio-test = { workspace = true }
uuid = { workspace = true }
