[package]
name = "vector-embed"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
description = "Local embedding runtime: fastembed + ort, CPU-canonical (09c I11), with gate / scheduler / EmbedStage."

[lib]
path = "src/lib.rs"

[features]
# The real ONNX runtime (fastembed + ort + HF tokenizers). Everything else —
# mock embedder, gate, scheduler, EmbedStage — is feature-free so the crate
# builds and tests offline with --no-default-features.
default = ["onnx"]
onnx = ["dep:fastembed", "dep:tokenizers"]

[dependencies]
vector-core = { path = "../vector-core" }
heart = { path = "../heart" }

async-trait = "0.1"
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
smol_str = { version = "0.2", features = ["serde"] }
thiserror = "1.0"
tokio = { version = "1.52", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

# ── ONNX plane (feature "onnx") ──────────────────────────────────────────────
# fastembed 5.17.3 pins ort 2.0.0-rc.12 and tokenizers 0.22.2 (with `onig`);
# we match its tokenizers version exactly so the two never skew.
fastembed = { version = "5.17.3", optional = true }
tokenizers = { version = "0.22.2", optional = true }

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
tempfile = "3"
