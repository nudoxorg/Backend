# nudox-ir-vcs — versioning the IR with libpijul as the change engine.
#
# We do NOT reimplement patch theory. Each package's materialized IR is mapped to
# a file-per-`IntroId` working tree (`symbols/{intro_hex}`), and libpijul owns
# changes, dependencies, commutation, unrecord, channels, and durable storage.
# `materialize` reads pijul's output tree back into a `PristineIntroTable`
# container, which the archive seals into a serve snapshot.
[package]
name = "nudox-ir-vcs"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
nudox-change = { path = "../nudox-change" }
nudox-ir = { path = "../nudox-ir" }
nudox-ir-archive = { path = "../nudox-ir-archive" }
nudox-ir-diff = { path = "../nudox-ir-diff" }
nudox-ir-manifest = { path = "../nudox-ir-manifest" }
# The frozen F1 key registry + field-aware pairer (DEPTH1 plan §3.2): the
# registry constants live there now; f1.rs re-exports them unchanged.
nudox-f1 = { path = "../nudox-f1" }
ir-stream = { path = "../ir-stream" }
heart = { path = "../heart" }

# The change engine. GPL — acceptable per design K7. Pinned exactly: libpijul's
# on-disk formats and API are pre-1.0 and move between betas.
libpijul = "=1.0.0-beta.11"

# Canonical content hashing for api_surface_hash, delta_digest, embed_hash.
blake3 = "1"

# GenerationMeta encoding (domain-prefixed postcard under nudox.genmeta.v1).
postcard = { version = "1", features = ["use-std"] }

serde = { version = "1.0", features = ["derive"] }
smol_str = { version = "0.2", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
# libpijul change headers carry a `jiff::Timestamp`; pin to libpijul's version.
jiff = "0.2"

# Serve-cache (historical replay hot path). Both are already workspace deps:
# `moka` backs the embedding cache; `governor` is the workspace's leaky-bucket
# (GCRA) rate-limit primitive. Reused here so admission control matches the
# established pattern.
moka = { version = "0.12", features = ["sync"] }
governor = "0.7"

[dev-dependencies]
tempfile = "3"
