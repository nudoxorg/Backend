[package]
name = "nudox-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# L4 of GUI-LOCAL-PLAN §L6: the MCP server lindsey hosts. A *view* of the
# engine (LR-8) — every tool bottoms out in an `EngineHandle` call or a
# `CorpusAdapter` query, never in a direct `nudox-ir` read.
#
# `nudox-graph` is a dependency only for `schema()` (LR-7: one schema, served
# to agents verbatim). The `CorpusAdapter` itself is reached through
# `EngineHandle::query`, because LR-9 says the engine owns every runtime and
# the Trustfall result stream is `!Send`.

[dependencies]
nudox-engine = { path = "../nudox-engine" }
nudox-graph = { path = "../nudox-graph" }
# `nudox-ir` is intentionally absent. `nudox_engine::wire` re-exports
# `EcosystemId` and `PackageName` (the two newtypes `SymbolKeyDto::to_wire`
# needs to build a `SymbolKey`), so this crate constructs keys through the
# engine's public surface alone — LR-8 satisfied.

# axum 0.8 is the version rmcp 2.2 itself tests `StreamableHttpService`
# against (rmcp-2.2.0/Cargo.toml `[dev-dependencies.axum]`). `StreamableHttpService`
# is a bare `tower_service::Service`; axum supplies the connection loop
# (`axum::serve`), the router (`nest_service`) and the auth layer
# (`middleware::from_fn_with_state`). No TLS: the listener is loopback-only.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# `rand` for the per-launch session token (§L6). Pinned to 0.10, matching
# `workspace/heart`, so no second major lands in the lockfile.
rand = "0.10"
rmcp = { version = "2.2", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `time` is for `McpHost`'s bounded drain: shutdown runs on the host's main
# thread, so waiting for an agent that is holding an SSE stream open must not be
# able to stall a window close indefinitely.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "time"] }
# `CancellationToken` only — `McpEndpoint` keeps the token that
# `StreamableHttpServerConfig` already owns rather than inventing a second
# shutdown signal. Same pin and features as `nudox-engine`.
tokio-util = { version = "0.7", default-features = false }
tracing = { workspace = true }

# ── Account authentication (`src/account`, see `docs/auth.md`) ────────────────────
#
# `reqwest` talks to `api.nudox.org`. Same version, same feature set and the
# same `rustls-tls` (not native-tls) choice already made by `driver`, `index`
# and `registry`, so the workspace resolves one HTTP client and one TLS stack
# rather than two of each. `default-features = false` keeps the blocking client,
# cookies and charset detection out; none of the three endpoints needs them.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `sha2` for `KeyFingerprint` — a truncated SHA-256 of the key, which is what
# lets the on-disk cache and the usage ledger *name* a credential without
# *holding* one.
sha2 = "0.10"

# The macOS Keychain, for the account key at rest. Target-gated because there is
# no Keychain anywhere else; `account::store::platform_store` returns a store
# that reports `Unavailable` and points at `NUDOX_API_KEY` on other platforms,
# rather than inventing a plaintext dotfile.
#
# `security-framework` directly, not `keyring`: `keyring`'s macOS backend *is*
# this crate, so the abstraction buys nothing for a macOS-only app, and this
# version is already in the workspace lockfile via the TLS stack — adding
# `keyring` would pull a second, parallel dependency tree to reach the same
# `SecItem*` calls.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
nudox-engine = { path = "../nudox-engine", features = ["fixtures"] }
nudox-store = { path = "../nudox-store", features = ["fixtures"] }
# `measured()`, for the `cost case=` line doctrine §4 requires from every
# integration test. Same path-dependency shape `nudox-engine` and
# `nudox-store` already use for it.
nudox-test-support = { path = "../test-support" }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "io-util", "time"] }
trustfall = { workspace = true }

[lints]
workspace = true
