[package]
name = "driver"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "driver"
path = "lib.rs"

[[bin]]
name = "driver"
path = "main.rs"

[features]
default = []

[dependencies]
# ── First-party workspace crates (the three layers this crate composes) ───────
# `driver` is the ONLY place index + registry are composed (§8 re-layering):
#   heart    = vocab + page + client (wire DTOs + authz vocab) + sync
#   index    = data / storage / coordination plane (catalog, outbox, queue,
#              blob/cas, search, metadata, compiled, upstream followers, bakery,
#              runtime text index, health)
#   registry = graph (Trustfall) + vector (the folded-in vector plane)
heart    = { path = "../heart", features = ["telemetry"] }
ecosystem = { path = "../ecosystem" }
# The real `registry` (graph + vector) and the `vector` plane are re-projected
# through this crate's `mod registry` / `mod vector` facades (§8 shim), so the
# extern crate is aliased out of the prelude to `xregistry` — bare `registry::…`
# / `vector::…` in the moved modules then resolve to the crate-local facades.
xregistry = { package = "registry", path = "../registry", features = ["local", "remote"] }
index    = { path = "../index", features = ["dolt-engine"] }

# ── Async / concurrency ───────────────────────────────────────────────────────
tokio        = { version = "1.52",  features = ["full"] }
futures      = { version = "0.3",   features = ["std", "async-await", "alloc"] }
futures-util = { version = "0.3" }
async-stream = { version = "0.3" }
tokio-stream = { version = "0.1" }
tokio-util   = { version = "0.6" }

# ── HTTP server (axum) ────────────────────────────────────────────────────────
axum       = { version = "0.7", features = ["macros"] }
tower      = { version = "0.4", features = ["util", "retry", "timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
http       = "1"
http-body-util = { version = "0.1" }
hyper      = { version = "0.14" }

# ── HTTP client (reqwest) ─────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Object store ──────────────────────────────────────────────────────────────
object_store = { version = "0.11" }

# ── Vector store ──────────────────────────────────────────────────────────────
qdrant-client = "1.18"

# ── Full-text search ──────────────────────────────────────────────────────────
tantivy = "0.22"

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard   = { version = "1.1", features = ["alloc"] }
toml       = "0.6"

# ── Configuration ─────────────────────────────────────────────────────────────
figment = "0.10"

# ── Type safety / newtypes ────────────────────────────────────────────────────
bytes    = "1.12"
smol_str = { version = "0.2", features = ["serde"] }
nonempty = { version = "0.11", features = ["serialize"] }
secrecy  = { version = "0.10", features = ["serde"] }
url      = { version = "2.5",  features = ["serde"] }
uuid     = { version = "1.23", features = ["v4", "v5", "serde"] }
semver   = "1.0"
uv-pep440 = { version = "0.0.59", features = ["serde", "version-ranges"] }
arc-swap  = "1.9"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror   = "1.0"
anyhow      = "1.0"
async-trait = "0.1"

# ── Observability ─────────────────────────────────────────────────────────────
tracing  = "0.1"
metrics  = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }

# ── Enum utilities ────────────────────────────────────────────────────────────
strum = { version = "0.26", features = ["derive"] }

# ── Date / time ───────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Content hashing + encoding ────────────────────────────────────────────────
blake3        = "1.8"
data-encoding = "2.11"

# ── Archive handling ──────────────────────────────────────────────────────────
flate2            = "1.1"
tar               = "0.4"
zstd              = "0.13"
zip               = { version = "2", default-features = false, features = ["deflate"] }
async-compression = "0.4"

# ── Tree-sitter (blob parsing) ────────────────────────────────────────────────
arborium-tree-sitter = "2.18"

# ── Parallel computation ──────────────────────────────────────────────────────
par-core     = { version = "2.0", features = ["rayon"] }
generativity = "1.2"

# ── System ────────────────────────────────────────────────────────────────────
rustix   = { version = "0.38", features = ["use-libc"] }
which    = "4.4"
tempfile = "3.27"
moka     = { version = "0.12", features = ["future", "sync"] }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tokio      = { version = "1.52", features = ["full"] }
serde_json = "1.0"
tempfile   = "3.27"
