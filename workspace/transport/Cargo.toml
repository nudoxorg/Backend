# The ONE shared iroh/bao content-transfer plane (CONSOLIDATION-NOTES §8b/§8c).
# Extracted from `index::transport` into its own crate so both `index` (pack) and
# `ir-vcs` (nudox_ir::sync) can depend on it without an index↔ir-vcs cycle. heart
# stays iroh-free; this crate is the concrete transport `heart::sync` implementors
# wire over.
[package]
name = "transport"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
heart = { path = "../heart" }
iroh-blobs = { version = "0.103.0", default-features = false }
bao-tree = { version = "0.16.0", default-features = false }
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
postcard = { version = "1.1", features = ["alloc"] }
bytes = "1"
blake3 = "1.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
tokio = { version = "1.53.0", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
