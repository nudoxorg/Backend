[package]
name = "lindsey"
version = "0.1.0"
edition = "2024"

# Standalone package with its own lockfile — not a member of the monorepo
# Cargo workspace (keeps gpui out of the backend dependency graph). The
# local-first engine crates it consumes are root-workspace members reached
# by path; cargo resolves them into this lockfile independently.
[workspace]

[lib]
name = "lindsey"
path = "src/lib.rs"

[[bin]]
name = "lindsey"
path = "src/main.rs"

[dependencies]
# ── GPUI, pinned exactly (GUI-PLAN LD-10) ────────────────────────────────────
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
# `runtime_shaders` is load-bearing, not an optimisation knob: without it
# `gpui_macos/build.rs:23` shells out to the `metal` CLI at build time, which
# needs the full Xcode Metal Toolchain component. With it (`build.rs:21`) the
# shaders are stitched into the binary and compiled in-process by Metal at
# startup, so the build needs no Xcode toolchain at all. gpui-component's own
# workspace sets this flag for the same reason — it is the supported path.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c112e7b482b6b9c53a8c43deaf5847b94a29ad82", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c112e7b482b6b9c53a8c43deaf5847b94a29ad82", package = "gpui-component-assets" }

# ── The engine (GUI-LOCAL-PLAN §L0) ──────────────────────────────────────────
# The ONLY backend crate lindsey may name. The dependency law is one-directional
# and linted: lindsey → engine → {graph, store} → ir. Reaching past the engine
# to nudox-ir/-store/-graph directly is a review-blocking finding, because it
# would let a view depend on the shape of the IR rather than on the protocol.
nudox-engine = { path = "../../crates/nudox-engine", features = ["fixtures"] }

# ── The MCP server lindsey hosts (GUI-LOCAL-PLAN §L6, LIMITATIONS.md L35) ────
#
# THIS IS A SECOND BACKEND CRATE, and AGENTS-DOCTRINE §1 says lindsey "may name
# `nudox-engine` and nothing else from the backend". The exception is argued
# here rather than assumed, because §1 is otherwise absolute:
#
#  * The harm §1 names is a *view* coupling to the shape of the *IR* — that is
#    why the rule enumerates `nudox-ir`/`-store`/`-graph`, all of which sit
#    BENEATH the engine, and why §L9's enforcement check is exactly
#    "`lindsey` has no edge to nudox-ir/-store/-graph". `nudox-mcp` sits BESIDE
#    lindsey, not beneath the engine: it is a second *view* of the same
#    `EngineHandle` (LR-8), holds no corpus, no index and no IR, and names no
#    `nudox-ir` type. Nothing about the IR's shape becomes visible here.
#  * The surface used below is `McpHost` + `McpStatus`, whose entire vocabulary
#    is `EngineHandle`, `SocketAddr`, `String` and `McpError`.
#  * The plan this crate is built to says so directly: GUI-LOCAL-PLAN §L6
#    ("Lifecycle: started by lindsey after the engine, stopped on window
#    close"), §L10's M2.5 row ("`nudox-mcp` server, hosted by lindsey"), and
#    nudox-mcp's own manifest header ("the MCP server lindsey hosts").
#  * There is no alternative that shares the corpus. The server must observe
#    the same live `EngineHandle` the window does (LR-8: "if a tool here ever
#    answers a question the engine could not, that is a bug"), which rules out
#    a separate process, and `nudox-engine` cannot host it without inverting
#    the existing `nudox-mcp -> nudox-engine` edge into a cycle.
#
# If a reviewer disagrees, the fix is one line here plus deleting
# `src/app/mcp.rs`; L35 then reverts to OPEN with the reason recorded.
nudox-mcp = { path = "../../crates/nudox-mcp" }

# ── Bridge & support ─────────────────────────────────────────────────────────
# Syntax highlighting. Upstream tree-sitter rather than arborium because
# gpui-component (pinned by rev) already owns links = "tree-sitter" in this
# workspace graph; see nudox_engine::highlight for why the engine itself
# cannot name either one.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

anyhow = "1"
# Typed errors, per AGENTS-DOCTRINE §3. Added with the palette restructure for
# `ThemeLoadError`, whose whole value is naming *which* bundled theme failed
# and how; an `anyhow` string could not carry that as a matchable variant.
thiserror = "2"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# `test-support` is what makes GPUI testable without a display: it enables
# `TestPlatform` + the seeded `TestDispatcher`, so `#[gpui::test]` runs an
# entire app — entities, windows, focus, keystrokes, actions — deterministically
# on one thread. Same pin as the runtime dependency; a mismatch would give two
# incompatible `Entity` types.
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["test-support"] }

# ── The screenshot plane ─────────────────────────────────────────────────────
# `gpui_platform`'s `test-support` feature is what exposes
# `current_headless_renderer()`, the `MetalHeadlessRenderer` on macOS. Combined
# with `HeadlessAppContext::with_platform`, that is what turns a GPUI test into
# a *pixel* test: `Window::render_to_image()` rasterises the real scene through
# the real renderer and hands back an `RgbaImage`, with no display, no window
# server, and no screen-recording permission involved.
#
# The real platform's text system comes along for the ride via
# `Platform::text_system()` — without it glyph metrics are stubbed and every
# screenshot would be a picture of a layout that no user will ever see.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit", "x11", "wayland", "runtime_shaders", "test-support"] }
# Same version gpui itself re-exports, so `RgbaImage` is one type, not two.
image = "0.25"

[[test]]
name = "shell_flow"
path = "tests/shell_flow.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

# Proves the endpoint the status bar displays is one a client actually reaches
# (LIMITATIONS.md L35). Normal harness — it drives real loopback sockets, not
# pixels.
[[test]]
name = "mcp_endpoint"
path = "tests/mcp_endpoint.rs"

# `harness = false` is required, not stylistic: libtest runs `#[test]` bodies on
# spawned worker threads, and constructing the macOS platform off the main
# thread aborts the process. With no harness the file is its own `fn main` and
# runs where AppKit is legal.
[[test]]
name = "shot_probe"
path = "tests/shot_probe.rs"
harness = false

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false

# Rasterises an authored link and a repaired link and asserts the frames
# differ. Same `harness = false` reason as the two above.
[[test]]
name = "repair_paint"
path = "tests/repair_paint.rs"
harness = false

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[profile.release]
lto = "thin"

# ── macOS packaging (cargo-bundle 0.11, `cargo install cargo-bundle`) ────────
#
# Consumed by `cargo bundle --release --format osx|dmg`, run from *this*
# directory (workspace/gui), never with `--workspace`/`--all-features` per
# AGENTS-DOCTRINE and this task's build-scope rule. Paths below are relative
# to that CWD, which is how cargo-bundle resolves both glob-based `icon` and
# the plain `osx_dmg_background` path (see `Settings::icon_files` /
# `osx_dmg_background` in cargo-bundle's `src/bundle/settings.rs`).
#
# The GUI needs no `resources` entry: the four bundled themes are compiled in
# via `include_str!` (src/theme/spec.rs) and gpui-component's icon SVGs are
# `rust_embed`-d into the binary (gpui-component's `crates/assets`), so the
# shipped binary is self-contained — nothing is read from a Resources
# directory at runtime, and the MCP server it hosts (`nudox-mcp`) binds a
# loopback socket rather than reading files.
[package.metadata.bundle]
name = "lindsey"
identifier = "com.nudox.lindsey"
version = "0.1.0"
copyright = "Copyright (c) 2026 the nudox project"
category = "Developer Tool"
short_description = "Local-first documentation and code intelligence for seven languages."
long_description = """
lindsey renders documentation for real packages in Rust, Go, Java, Python, \
TypeScript, C#, and C/C++, streamed from a local nudox-engine over a typed \
wire protocol — real search, real version lineage, working hyperlinks, no \
network round trip to docs.rs.
"""
# The one brand mark (repo root). SVG in, not a pre-rendered PNG/ICNS: cargo-
# bundle's `create_icns_from_svg` rasterises this via `resvg` at every
# required iconset size (16/16@2x/32/32@2x/128/128@2x/256/256@2x/512/512@2x —
# the last of which *is* the 1024px tile) and writes a real .icns into
# Contents/Resources. A logo change needs no other step.
icon = ["../../logo.svg"]
# Measured, not aspirational: `otool -l target/release/lindsey`'s
# LC_BUILD_VERSION reports `minos 14.0` for a binary built with no
# MACOSX_DEPLOYMENT_TARGET override, i.e. this toolchain's default deployment
# target against the installed 14.4 SDK. Zed's own build (this GUI's gpui/
# gpui_platform pin) sets MACOSX_DEPLOYMENT_TARGET=10.15.7 in *its* build.rs,
# but that script is Zed's, not gpui_platform's, and does not run for this
# crate — nothing here overrides the toolchain default, so claiming 10.15
# would describe a binary that was never actually built. 14.0 (Sonoma,
# shipped September 2023) is what this binary actually requires; lowering it
# is possible but unverified, so it is not claimed here.
osx_minimum_system_version = "14.0"
# SVG with two elements named `app` and `applications`; cargo-bundle's
# `dmg_finder::decorate_volume` reads their bounding-box centers as icon
# positions, rasterises the whole file to `.background/background.tiff` at 2x,
# and writes a matching `.DS_Store` (window size/position, icon size, hidden
# toolbar/sidebar) directly — no AppleScript, no `create-dmg`. Generated from
# /logo.svg by generate_dmg_background.py in this directory; rerun that
# script after a logo change, this path does not change.
osx_dmg_background = "packaging/dmg-background.svg"
