[package]
name = "lindsey"
version = "0.1.0"
edition = "2024"

# Standalone package with its own lockfile — not a member of the monorepo
# Cargo workspace (keeps gpui out of the backend dependency graph). The
# local-first engine crates it consumes are root-workspace members reached
# by path; cargo resolves them into this lockfile independently.
[workspace]

[lib]
name = "lindsey"
path = "src/lib.rs"

[[bin]]
name = "lindsey"
path = "src/main.rs"

[dependencies]
# ── GPUI, pinned exactly (GUI-PLAN LD-10) ────────────────────────────────────
#
# gpui-ce is the community fork of Zed's GPUI, a drop-in replacement that
# publishes as `gpui-ce` on crates.io but keeps the crate name `gpui` in its
# git tree (so no `package =` rename is needed here). Pinned by rev — not
# branch, not crates.io `0.3` — for the same reason the old zed pin was: the
# lockfile must be reproducible and the API surface frozen. gpui-ce tracks a
# NEWER upstream than the old `1d217ee` zed pin, hence the API adjustments
# throughout `src/`.
#
# This rev is the newest gpui-ce commit compatible with gpui-component rev
# c112e7b. It tracks zed 2026-07-30 (the PR #110 upstream sync, newer than the
# old `1d217ee` June-12 pin) but sits before PR #105, which replaces the custom
# `Hsla`/`Rgba` with the `palette` crate — a change gpui-component has not
# adopted and that would produce hundreds of breakages across its theme code.
# Two residual gpui-component breakages remain even here (see the migration
# report): PR #111's `TextRun.letter_spacing` field (a gpui-ce-specific
# addition) and the zed July-30 rename of `AnyView::into_any` →
# `into_any_element`.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e" }

# ── gpui-component ───────────────────────────────────────────────────────────
# These still name zed's git gpui; the `[patch."https://github.com/zed-industries/zed.git"]`
# block below redirects their `gpui`/`gpui_macros` to gpui-ce so there is ONE
# `Entity`/`App`/`Window` type shared by lindsey and every component.
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "c112e7b482b6b9c53a8c43deaf5847b94a29ad82", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "c112e7b482b6b9c53a8c43deaf5847b94a29ad82", package = "gpui-component-assets" }

# ── The engine (GUI-LOCAL-PLAN §L0) ──────────────────────────────────────────
# The ONLY backend crate lindsey may name. The dependency law is one-directional
# and linted: lindsey → engine → {graph, store} → ir. Reaching past the engine
# to nudox-ir/-store/-graph directly is a review-blocking finding, because it
# would let a view depend on the shape of the IR rather than on the protocol.
nudox-engine = { path = "../nudox-engine", features = ["fixtures"] }

# ── The MCP server + embedder adapter (GUI-LOCAL-PLAN §L6, §1 capability ports)
#
# The store, graph, MCP and embedder planes are no longer separate crates: they
# are now the `store`, `graph`, `mcp` and `embed` modules of `nudox-engine`,
# reached as `nudox_engine::mcp::McpHost` and `nudox_engine::embed::load_from_env`
# respectively. The engine's `onnx` feature (forwarded from the embedder plane)
# still drags in `registry` (483 crates) whose `ort-sys` fetches a runtime at
# build time, so it stays off by default and is opted into via `-F semantic-onnx`
# (see `[features]` below).

# ── The remote-server client lindsey uses for the omni-search "also search a
# server" section (AGENTS-DOCTRINE §1, capability ports) ────────────────────
#
# THIS IS A SECOND BACKEND CRATE, admitted on the same capability-port argument
# as the engine's MCP and embedder planes: it sits BESIDE the engine, not
# beneath it. `heart` is the shared
# wire vocabulary `index::server` and `heart::client::http::NudoxClient` both
# speak — `NudoxClient` (behind `heart`'s own off-by-default `client` feature,
# see that crate's module docs) is a thin `reqwest` wrapper whose entire surface
# lindsey touches is `NudoxClient::{connect, readyz, search}`,
# `heart::query::Query`, and `heart::{Scored, Symbol}`. None of those are
# `nudox-ir`/store/graph types — `heart::Symbol` is the server's own
# already-lowered wire projection (name/kind/package), not the IR — so nothing
# about the IR's shape crosses this seam, which is the same test the engine's
# MCP and embedder planes pass.
#
# The remote section is additive, never a replacement: `nudox-engine` stays the
# only source of the local-first (offline) results; a remote server, when one
# is configured and reachable, contributes a second, clearly-labelled result
# group. `features = ["client"]` is what pulls `reqwest` in at all — bare
# `heart` (as `index` itself depends on it) carries no transport.
heart = { path = "../../workspace/heart", features = ["client"] }

# ── Bridge & support ─────────────────────────────────────────────────────────
# Syntax highlighting. Upstream tree-sitter rather than arborium because
# gpui-component (pinned by rev) already owns links = "tree-sitter" in this
# workspace graph; see nudox_engine::highlight for why the engine itself
# cannot name either one.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"

anyhow = "1"
# Typed errors, per AGENTS-DOCTRINE §3. Added with the palette restructure for
# `ThemeLoadError`, whose whole value is naming *which* bundled theme failed
# and how; an `anyhow` string could not carry that as a matchable variant.
thiserror = "2"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ── Per-platform gpui_platform features ──────────────────────────────────────
# The platform crates (`gpui_macos`, `gpui_linux`, `gpui_windows`) are already
# target-gated inside gpui_platform, so enabling a feature on the wrong OS is a
# no-op — but listing them per-target keeps each build's feature set honest and
# stops a macOS build from ever naming a Linux/Windows-only feature.
#
# `runtime_shaders` is load-bearing, not an optimisation knob: without it
# `gpui_macos/build.rs` shells out to the `metal` CLI at build time, which
# needs the full Xcode Metal Toolchain component. With it the shaders are
# stitched into the binary and compiled in-process by Metal at startup, so the
# build needs no Xcode toolchain at all. gpui-component's own workspace sets
# this flag for the same reason — it is the supported path.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", features = ["font-kit", "runtime_shaders"] }

# Linux text rendering comes via cosmic-text (pulled by the x11/wayland
# features), so `font-kit` is not needed here.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", features = ["x11", "wayland"] }

# `wgpu` is the Windows rendering backend (gpui_windows/wgpu). gpui_platform
# additionally enables gpui's `windows-manifest` feature on this target itself.
[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", features = ["wgpu"] }

[features]
# OFF by default. Turning it on enables the ONNX embedder runtime behind the
# capability port, so `NUDOX_EMBED_MODEL_DIR` (pointing at the pinned model)
# gives the omni-search semantic section real ranked results instead of the
# "not configured in this build" notice. It is opt-in because building it fetches
# the ort runtime at build time (docs/LIMITATIONS.md L41): a fresh clone, CI, and the
# screenshot suite build lindsey with this off and remain network-free at build.
#
#   cargo build --manifest-path workspace/gui/Cargo.toml -F semantic-onnx
default = []
semantic-onnx = ["nudox-engine/onnx"]

[dev-dependencies]
# `test-support` is what makes GPUI testable without a display: it enables
# `TestPlatform` + the seeded `TestDispatcher`, so `#[gpui::test]` runs an
# entire app — entities, windows, focus, keystrokes, actions — deterministically
# on one thread. Same pin as the runtime dependency; a mismatch would give two
# incompatible `Entity` types.
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", features = ["test-support"] }

# ── The screenshot plane ─────────────────────────────────────────────────────
# `gpui_platform`'s `test-support` feature is what exposes
# `current_headless_renderer()`, the `MetalHeadlessRenderer` on macOS. Combined
# with `HeadlessAppContext::with_platform`, that is what turns a GPUI test into
# a *pixel* test: `Window::render_to_image()` rasterises the real scene through
# the real renderer and hands back an `RgbaImage`, with no display, no window
# server, and no screen-recording permission involved.
#
# The real platform's text system comes along for the ride via
# `Platform::text_system()` — without it glyph metrics are stubbed and every
# screenshot would be a picture of a layout that no user will ever see.
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e", features = ["font-kit", "x11", "wayland", "runtime_shaders", "test-support"] }
# Same version gpui itself re-exports, so `RgbaImage` is one type, not two.
image = "0.25"

# ── gpui-ce patch ────────────────────────────────────────────────────────────
#
# gpui-component (rev c112e7b) names zed's git gpui at rev 1d217ee. That rev is
# older than gpui-ce's tracked upstream, and a second, unpatched `gpui` in the
# graph would mean two incompatible `Entity`/`App` types — lindsey's and every
# component's. This block redirects the two zed-git packages gpui-component
# actually pulls (`gpui`, `gpui_macros`) onto the same gpui-ce rev lindsey pins,
# so there is exactly ONE gpui instance in the tree. (gpui-component's own
# `[patch.crates-io]` is a dependency's manifest and is ignored by cargo; only
# this root-workspace patch applies.)
[patch."https://github.com/zed-industries/zed.git"]
gpui = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e" }
gpui_macros = { git = "https://github.com/gpui-ce/gpui-ce", rev = "d435891f47743d96bfc6d4ab74c9ecd05af2603e" }

[[test]]
name = "shell_flow"
path = "tests/shell_flow.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

# Proves the endpoint the status bar displays is one a client actually reaches
# (docs/LIMITATIONS.md L35). Normal harness — it drives real loopback sockets, not
# pixels.
[[test]]
name = "mcp_endpoint"
path = "tests/mcp_endpoint.rs"

# `harness = false` is required, not stylistic: libtest runs `#[test]` bodies on
# spawned worker threads, and constructing the macOS platform off the main
# thread aborts the process. With no harness the file is its own `fn main` and
# runs where AppKit is legal.
[[test]]
name = "shot_probe"
path = "tests/shot_probe.rs"
harness = false

[[test]]
name = "screenshots"
path = "tests/screenshots.rs"
harness = false

# Rasterises an authored link and a repaired link and asserts the frames
# differ. Same `harness = false` reason as the two above.
[[test]]
name = "repair_paint"
path = "tests/repair_paint.rs"
harness = false

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[profile.release]
lto = "thin"

# ── macOS packaging (cargo-bundle 0.11, `cargo install cargo-bundle`) ────────
#
# Consumed by `cargo bundle --release --format osx|dmg`, run from *this*
# directory (workspace/gui), never with `--workspace`/`--all-features` per
# AGENTS-DOCTRINE and this task's build-scope rule. Paths below are relative
# to that CWD, which is how cargo-bundle resolves both glob-based `icon` and
# the plain `osx_dmg_background` path (see `Settings::icon_files` /
# `osx_dmg_background` in cargo-bundle's `src/bundle/settings.rs`).
#
# The GUI needs no `resources` entry: the four bundled themes are compiled in
# via `include_str!` (src/theme/spec.rs) and gpui-component's icon SVGs are
# `rust_embed`-d into the binary (gpui-component's `crates/assets`), so the
# shipped binary is self-contained — nothing is read from a Resources
# directory at runtime, and the MCP server it hosts (`nudox_engine::mcp`) binds a
# loopback socket rather than reading files.
[package.metadata.bundle]
name = "lindsey"
identifier = "com.nudox.lindsey"
version = "0.1.0"
copyright = "Copyright (c) 2026 the nudox project"
category = "Developer Tool"
short_description = "Local-first documentation and code intelligence for seven languages."
long_description = """
lindsey renders documentation for real packages in Rust, Go, Java, Python, \
TypeScript, C#, and C/C++, streamed from a local nudox-engine over a typed \
wire protocol — real search, real version lineage, working hyperlinks, no \
network round trip to docs.rs.
"""
# The one brand mark (repo root). SVG in, not a pre-rendered PNG/ICNS: cargo-
# bundle's `create_icns_from_svg` rasterises this via `resvg` at every
# required iconset size (16/16@2x/32/32@2x/128/128@2x/256/256@2x/512/512@2x —
# the last of which *is* the 1024px tile) and writes a real .icns into
# Contents/Resources. A logo change needs no other step.
icon = ["assets/logo.svg"]
# Measured, not aspirational: `otool -l target/release/lindsey`'s
# LC_BUILD_VERSION reports `minos 14.0` for a binary built with no
# MACOSX_DEPLOYMENT_TARGET override, i.e. this toolchain's default deployment
# target against the installed 14.4 SDK. Zed's own build (this GUI's gpui/
# gpui_platform pin) sets MACOSX_DEPLOYMENT_TARGET=10.15.7 in *its* build.rs,
# but that script is Zed's, not gpui_platform's, and does not run for this
# crate — nothing here overrides the toolchain default, so claiming 10.15
# would describe a binary that was never actually built. 14.0 (Sonoma,
# shipped September 2023) is what this binary actually requires; lowering it
# is possible but unverified, so it is not claimed here.
osx_minimum_system_version = "14.0"
# SVG with two elements named `app` and `applications`; cargo-bundle's
# `dmg_finder::decorate_volume` reads their bounding-box centers as icon
# positions, rasterises the whole file to `.background/background.tiff` at 2x,
# and writes a matching `.DS_Store` (window size/position, icon size, hidden
# toolbar/sidebar) directly — no AppleScript, no `create-dmg`. Generated from
# /workspace/gui/assets/logo.svg by generate_dmg_background.py in this directory; rerun that
# script after a logo change, this path does not change.
osx_dmg_background = "packaging/dmg-background.svg"

# ── Linux packaging (cargo-deb → .deb) ──────────────────────────────────────
#
# Consumed by `cargo deb` (run from this directory). `depends = "$auto"` asks
# cargo-deb to resolve the shared-library dependency set from the built binary
# via dpkg-shlibdeps rather than hard-coding a Debian/RPM-specific list here —
# the X11/Wayland/font libraries gpui needs at runtime are enumerated in
# packaging/linux/README.md (they differ by name between Debian and RPM, which
# is exactly why `$auto` is preferred over a manual list). Both `assets` are
# text/vector files, so the desktop integration (`.desktop` + scalable icon)
# ships in the same package as the binary with no Resources-dir runtime reads.
[package.metadata.deb]
maintainer = "the nudox project"
copyright = "2026 the nudox project"
license = "MIT"
section = "devel"
priority = "optional"
depends = "$auto"
assets = [
  ["packaging/linux/lindsey.desktop", "usr/share/applications/lindsey.desktop", "644"],
  ["assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/lindsey.svg", "644"],
]

# ── Linux packaging (cargo-generate-rpm → .rpm) ─────────────────────────────
#
# Consumed by `cargo generate-rpm` (run from this directory). The binary is
# auto-placed at /usr/bin/lindsey; `assets` adds only the desktop entry and the
# scalable icon, mirroring the deb section above so the two formats ship the
# same desktop integration. `dest` must be absolute; `mode` is the POSIX mode
# string. `requires` is left empty: like the deb `$auto`, the RPM dependency
# set is best left to the rpmbuild auto-requires pass over the built binary.
[package.metadata.generate-rpm]
license = "MIT"
summary = "Local-first documentation and code intelligence for seven languages"
description = """
lindsey renders documentation for real packages in Rust, Go, Java, Python, \
TypeScript, C#, and C/C++, streamed from a local nudox-engine over a typed \
wire protocol — real search, real version lineage, working hyperlinks, no \
network round trip to docs.rs.
"""
assets = [
  { source = "packaging/linux/lindsey.desktop", dest = "/usr/share/applications/lindsey.desktop", mode = "0644" },
  { source = "assets/logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/lindsey.svg", mode = "0644" },
]
