[package]
name = "sandbox"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
heart     = { path = "../../heart" }
thiserror = "1.0"
tracing   = "0.1"
which     = "4.4"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile  = "3.27"

[target.'cfg(unix)'.dependencies]
rlimit = "0.10"
libc   = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific isolation (Landlock + seccomp BPF).
# These are compiled into the seccomp/landlock modules which are gated with
# #[cfg(target_os = "linux")] in lib.rs.
