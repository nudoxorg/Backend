[package]
name = "compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
heart = { workspace = true }
ir = { workspace = true }

# Graph-store model (compiler/graph): TerminusDB schema + instance via derive.
# The derive emits fully-qualified paths into these crates, so they must be
# direct dependencies of this crate.
terminusdb-schema = { workspace = true }
terminusdb-schema-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Content-addressed source archive: streaming tar of the package source.
bytes = { workspace = true }

# Python compiler backend — uses pyrefly's type-checker and type representation.
pyrefly = { workspace = true }
pyrefly_types = { workspace = true }
pyrefly_build = { workspace = true }
pyrefly_python = { workspace = true }
pyrefly_config = { workspace = true }
pyrefly_util = { workspace = true }

# Ruff AST — pinned to the exact git rev Pyrefly resolves (already present in the
# workspace lockfile), so cargo unifies it to the same crate instance that
# `Transaction::get_ast` returns. Used by `languages::python::docstring` to walk
# def/class bodies and locate docstring statements.
ruff_python_ast = { git = "https://github.com/astral-sh/ruff/", rev = "db5aa0a5f1b92cb91d910bf0866a967554dd94f5" }

# Python package resolution — uv's internal PEP 440 + PEP 508 crates.
uv-pep440 = "0.0"
uv-pep508 = "0.0"

# Gzip decompression + tar extraction for PyPI sdists (.tar.gz).
flate2 = "1"
tar = { workspace = true }

# PyPI JSON API + sdist download (blocking client; network paths are
# integration-only and gated behind `#[ignore]` tests).
reqwest = { workspace = true, features = ["blocking"] }

[dev-dependencies]
# Temp package fixtures for multi-module lowering tests.
tempfile = "3"
# PEP 440 version/specifier construction in offline version-selection tests.
uv-pep440 = "0.0"
