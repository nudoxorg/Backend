[package]
name = "nudox-producer-clang"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nudox-ir     = { path = "../../../ir/model" }
nudox-producer = { path = "../../producer" }
clang        = { workspace = true, features = ["clang_10_0", "runtime"] }
# compile_commands.json ingestion (see src/compile_commands.rs) — both
# already exist in the root [workspace.dependencies]; referenced here, not
# newly introduced to the workspace.
serde        = { workspace = true }
serde_json   = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
# AGENTS-DOCTRINE.md §4: every integration test is also a benchmark —
# `tests/real_package.rs` wraps its measured region in `measured()`.
nudox-test-support = { path = "../../../test-support" }
