[package]
name = "nudox-producer-python"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# ── Pyrefly gate ─────────────────────────────────────────────────────────────────────
#
# `pyrefly` is not on crates.io at a usable version (only a 0.0.1 placeholder),
# so it is a git dependency. This comment used to list five reasons the feature
# could not be turned on. Four of the five were re-checked on 2026-08-08 and are
# no longer true; the list is replaced with what was actually verified, because
# a stale blocker list is how a solvable problem stays unsolved.
#
#   0a. RESOLUTION — FIXED UPSTREAM. pyrefly pinned `blake3 =1.8.2` at the old
#       rev, disjoint with `workspace/index`'s iroh (`^1.8.3`). Upstream has
#       since walked it forward (4a9a3597 → =1.8.3, 375a4308 → =1.8.4,
#       f3d5c794 → =1.8.5, dd4d9f30 → =1.8.6). At the rev pinned below,
#       full-workspace `cargo metadata` resolves, with one consequence: the lock
#       moves blake3 1.8.5 → 1.8.6, which every other blake3 requirement here
#       (`^1.8`) already admits.
#
#   0b. THE GATED CODE — NOW IN THE TREE. `src/context.rs` exists and is the
#       pyrefly tier: it runs the ruff front end for structure, then fills the
#       type slots the syntactic tier cannot resolve. See its module doc.
#
#   1.  TYPESHED / NETWORK AT BUILD TIME — THE CLAIM WAS FALSE. `pyrefly_bundled`
#       does not download anything. Its build.rs reads `third_party/typeshed`
#       and `third_party/stubs` relative to its own manifest dir (or under
#       `$TYPESHED_ROOT` / `$STUBS_ROOT`, which is only how Buck passes a
#       filegroup) and tars them with `tar` + `zstd` + `sha2` — the complete
#       build-dependency list, none of which can open a socket. Those 36 MB of
#       typeshed are committed in the pyrefly repo, so cargo's own git checkout
#       carries them. Verified by building it: the build script emitted
#       stdlib.tar.zst / typeshed_stubs.tar.zst / stubs.tar.zst with no network.
#       Nothing needs provisioning through `nix/corpus.nix`.
#
#   2.  TRANSITIVE CRATES — REAL, AND LARGER THAN THE OLD ESTIMATE. Adding the
#       deps below adds **77** lock entries, not ~30: capnp, arc-swap, dupe,
#       enum-iterator, fuzzy-matcher, fxhash, watchman_client, tikv-jemallocator
#       (a C build), lsp-server/lsp-types, allocative, starlark_map, a second
#       `futures 0.1` — and a second copy of the ruff crate family at 0.0.6
#       alongside the 0.0.8 this crate already pins. Cold `cargo check` of that
#       subtree is ~1m40s on this machine.
#
#   3.  API STABILITY — REAL, AND SMALL SO FAR. `context.rs` uses
#       `pyrefly::state::state::State`, `::binding::bindings::Bindings` and
#       `::alt::answers::Answers`, all still `pub` at 1.3.0-dev.1. The one drift
#       between 1.1.1 and here was `ClassFields::names()` → `::fields()`. These
#       are `#[doc(hidden)]` modules; treat a rev bump as a code change.
#
# The feature used to be **off by default** — not because it did not work, but
# because 77 crates buy a measured +22% of annotation positions, of which the
# half that comes from unqualified same-package names is also reachable with no
# dependency at all. See `src/context.rs` for the per-bucket numbers.
#
#   OVERRULED 2026-08-09. Decision: pyrefly is now ON by default — "make
#   pyrefly the only Python pipeline", an explicit instruction from the
#   operator directing this change, given despite the cost/benefit framing
#   above and stated to override it. The reasoning above is not wrong — it was
#   an honest trade — but the trade itself has been rejected: this producer's
#   whole point is to be a documentation index, and shipping one that resolves
#   0% of types on a zero-annotation package (six, pyyaml, python-dateutil,
#   requests, beautifulsoup4, more-itertools all measured at 0%) when a
#   committed, network-free, monotone enrichment pass resolves roughly half of
#   them is a worse product than the extra lock entries and compile time cost.
#   Per doctrine §8 ("the reasoning outlives the decision"), this paragraph
#   stays rather than being deleted, because the next person to reconsider
#   this trade needs both the original number and the reason it stopped being
#   the deciding one. ruff remains the front end for everything pyrefly is
#   worse at (structure, docstrings, overload grouping, decorator handling) —
#   see `src/context.rs`'s module doc for why this stays an enrichment tier,
#   not a replacement front end. The `pyrefly` feature flag itself is left in
#   place (not collapsed into an unconditional dependency), so
#   `--no-default-features` remains a real escape hatch if the git dependency
#   or one of its 77 transitive crates ever becomes a hard blocker again.

[features]
default = ["pyrefly"]
# The pyrefly semantic tier (`src/context.rs`). ON by default as of
# 2026-08-09 — see the note above the `[features]` table. Builds fully
# offline — the typeshed is committed inside the pyrefly git checkout (see
# blocker 1 above). Costs 77 extra lock entries and ~1m40s of cold compile
# from a clean lock; re-measured cost against a warm registry cache is in
# this crate's build notes.
pyrefly = [
  "dep:pyrefly",
  "dep:pyrefly_build",
  "dep:pyrefly_config",
  "dep:pyrefly_python",
  "dep:pyrefly_types",
  "dep:pyrefly_util",
]

[lints]
workspace = true

[dependencies]
nudox-ir      = { path = "../../../ir/model" }
nudox-producer = { path = "../../producer" }
tracing = { workspace = true }

# ── ruff syntactic front end ────────────────────────────────────────────────
#
# Parser + AST only, exact-pinned, mirroring the TypeScript producer's OXC
# style (`workspace/compiler/languages/typescript/Cargo.toml`): a lockstep
# version so a ruff release cannot silently change AST shape under us.
# `ruff_python_parser`/`ruff_python_ast`/`ruff_text_size` are internal
# component crates of the `ruff` linter (crates.io publishes them under the
# same 0.0.x scheme oxc used before its 1.0), and 0.0.8 is the only version
# published as of this change. Deliberately NOT pulled in: `ruff` itself, or
# any of the type-checking/semantic crates (`ruff_python_semantic` and
# friends) — this stays a parser + AST, never a checker, so it carries none
# of the `pyrefly` git-dependency/typeshed-vendoring baggage described above.
ruff_python_parser = { version = "=0.0.8" }
ruff_python_ast     = { version = "=0.0.8" }
ruff_text_size       = { version = "=0.0.8" }

# ── pyrefly semantic tier (optional) ────────────────────────────────────────
#
# One rev for all six, pinned exactly: these are one workspace upstream and
# only ever version-lock together. `pyrefly_bundled`, `pyrefly_graph`,
# `pyrefly_derive`, `pyrefly_glean_schema` and `tsp_types` come in
# transitively — they are not named here because `context.rs` does not `use`
# them, and naming a dependency you do not import is how a lock file
# accumulates things nobody can justify removing.
[dependencies.pyrefly]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dependencies.pyrefly_build]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dependencies.pyrefly_config]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dependencies.pyrefly_python]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dependencies.pyrefly_types]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dependencies.pyrefly_util]
git = "https://github.com/facebook/pyrefly"
rev = "dd4d9f30d6511649af2bb77385c534e4a41cfaf0"
optional = true

[dev-dependencies]
nudox-test-support = { path = "../../../test-support" }
tempfile = "3"
