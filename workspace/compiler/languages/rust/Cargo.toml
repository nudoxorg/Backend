[package]
name = "nudox-producer-rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nudox-ir  = { path = "../../../ir/model" }
nudox-producer = { path = "../../producer" }
thiserror = { workspace = true }

# ── rust-analyzer in-process oracle ──────────────────────────────────────────
# All ra_ap_* crates MUST be pinned lockstep at exactly 0.0.341 — salsa keys
# are incompatible across versions and mismatches produce runtime failures, not
# compile errors.
ra_ap_base_db      = "=0.0.341"
ra_ap_cfg          = "=0.0.341"
ra_ap_hir          = "=0.0.341"
ra_ap_hir_def      = "=0.0.341"
ra_ap_ide_db       = "=0.0.341"
ra_ap_load-cargo   = "=0.0.341"
ra_ap_paths        = "=0.0.341"
ra_ap_proc_macro_api = "=0.0.341"
ra_ap_project_model = "=0.0.341"
ra_ap_span         = "=0.0.341"
# Needed only to resolve the `cargo` binary the same way `Sysroot::tool` does,
# for the narrowed build-script command in `ra::loaded` (LIMITATIONS.md L50).
ra_ap_toolchain    = "=0.0.341"
ra_ap_syntax       = "=0.0.341"
ra_ap_vfs          = "=0.0.341"

rustc-hash = { workspace = true }
smol_str   = "0.3"
tracing    = "0.1"

[lints]
workspace = true

[dev-dependencies]
serde_json = { workspace = true }
# AGENTS-DOCTRINE §4: every integration test is also a benchmark. This crate is
# a zero-dependency leaf, so it cannot re-enter the producer dependency graph.
nudox-test-support = { path = "../../../test-support" }
