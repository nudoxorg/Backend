[package]
name = "object-pack"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
heart = { path = "../heart" }
# Deterministic, self-describing binary codec for header/TOC. Already locked
# workspace-wide (v1.1.3); `alloc` matches the heart usage.
postcard = { version = "1.1", features = ["alloc"] }
# Content-addressing digests (BLAKE3), matching heart::content.
blake3 = "1"
# Fixed-level zstd frames for member/chunk compression.
zstd = "0.13"
# Zero-copy byte handles for range gets.
bytes = "1"
# Derived (de)serialization for wire and public types.
serde = { version = "1", features = ["derive"] }
# Total error taxonomy.
thiserror = "1.0"
# Interned small strings, matching heart::object_pack vocabulary.
smol_str = "0.2"
# mmap-backed reader.
memmap2 = "0.9"
# Bao verified-streaming tree: outboard generation (PreOrderMemOutboard) and
# verified range encode/decode (io::sync). Pinned to the workspace-locked
# version iroh-blobs already uses (0.16.0). We disable default features (no
# tokio_fsm / iroh-io / serde / validate); only the sync engine is needed.
# BlockSize::ZERO (1 KiB chunks) matches the iroh-blobs default.
bao-tree = { version = "0.16.0", default-features = false }
# ChunkRanges = RangeSet2<ChunkNum> from range-collections, bao-tree's range
# vocabulary. Pinned to the locked version.
range-collections = "0.4.6"

# ── iroh transport (INDEX-PLAN §7.2) ──────────────────────────────────────────
# Same versions/features as ir-sync so the two planes share one iroh/iroh-blobs
# entry in the lockfile. QUIC transport with Ed25519 endpoint identity.
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
# In-memory BLAKE3 blob store + BlobsProtocol for pack-member transfer.
iroh-blobs = { version = "0.103.0", default-features = false }
# Async runtime for the provide/fetch entry points.
tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
