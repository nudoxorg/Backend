[package]
name = "nudox-sync"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
ir-sync      = { path = "../ir-sync" }
nudox-ir-vcs = { path = "../nudox-ir-vcs" }

libpijul = "=1.0.0-beta.11"

thiserror = "1.0"
anyhow    = "1.0"
tempfile  = "3"

tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
nudox-change = { path = "../nudox-change" }
nudox-ir     = { path = "../nudox-ir" }

ir-sync  = { path = "../ir-sync" }
iroh     = { version = "1.0.2", default-features = false, features = ["tls-ring"] }

tempfile = "3"
tokio    = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
