[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "server"
path = "lib.rs"

[[bin]]
name = "server"
path = "main.rs"

[features]
default = []

[dependencies]
# ── First-party workspace crates ──────────────────────────────────────────────
# The serving crates (runtime/protocol/cas) were consolidated into `registry`,
# which is now THE service. `telemetry`/`version` live in `heart` — the
# `telemetry` feature pulls in the OTLP/Pyroscope stack (server is its only
# consumer, so the heavy deps stay out of every other heart consumer).
heart    = { path = "../heart", features = ["telemetry"] }
ecosystem = { path = "../ecosystem" }
ir       = { path = "../ir" }
registry = { path = "../registry" }

# ── Async / concurrency ───────────────────────────────────────────────────────
tokio        = { version = "1.52",  features = ["full"] }
futures      = { version = "0.3",   features = ["std", "async-await", "alloc"] }
futures-util = { version = "0.3" }
async-stream = { version = "0.3" }
tokio-stream = { version = "0.1" }
tokio-util   = { version = "0.6" }

# ── HTTP server (axum) ────────────────────────────────────────────────────────
axum       = { version = "0.7", features = ["macros"] }
tower      = { version = "0.4", features = ["util", "retry", "timeout"] }
tower-http = { version = "0.6", features = ["trace"] }
http       = "1"
http-body-util = { version = "0.1" }
hyper      = { version = "0.14" }

# ── HTTP client (reqwest) ─────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Object store ──────────────────────────────────────────────────────────────
object_store = { version = "0.11" }

# ── Vector store ──────────────────────────────────────────────────────────────
qdrant-client = "1.18"

# ── Full-text search ──────────────────────────────────────────────────────────
tantivy = "0.22"

# ── SQL / postgres ────────────────────────────────────────────────────────────
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "json",
    "chrono",
    "migrate",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# ── Query builder (registry schema) ──────────────────────────────────────────
sea-query        = { version = "0.32" }
sea-query-binder = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard   = { version = "1.1", features = ["alloc"] }
toml       = "0.6"

# ── Configuration ─────────────────────────────────────────────────────────────
figment = "0.10"

# ── Type safety / newtypes ────────────────────────────────────────────────────
bytes    = "1.12"
smol_str = { version = "0.2", features = ["serde"] }
nonempty = { version = "0.11", features = ["serialize"] }
secrecy  = { version = "0.10", features = ["serde"] }
url      = { version = "2.5",  features = ["serde"] }
uuid     = { version = "1.23", features = ["v4", "v5", "serde"] }
semver   = "1.0"
uv-pep440 = { version = "0.0.59", features = ["serde", "version-ranges"] }
arc-swap  = "1.9"

# ── Error handling ────────────────────────────────────────────────────────────
thiserror   = "1.0"
anyhow      = "1.0"
async-trait = "0.1"

# ── Observability ─────────────────────────────────────────────────────────────
# The OTLP/Pyroscope stack lives in `heart::telemetry` (enabled via heart's
# `telemetry` feature above). Server keeps only the direct facade crates it
# calls itself.
tracing  = "0.1"
metrics  = "0.24"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }

# ── Enum utilities ────────────────────────────────────────────────────────────
strum = { version = "0.26", features = ["derive"] }

# ── Date / time ───────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Content hashing + encoding ────────────────────────────────────────────────
blake3        = "1.8"
data-encoding = "2.11"

# ── Archive handling ──────────────────────────────────────────────────────────
flate2            = "1.1"
tar               = "0.4"
zstd              = "0.13"
async-compression = "0.4"

# ── Tree-sitter (registry blob parsing) ───────────────────────────────────────
arborium-tree-sitter = "2.18"

# ── Parallel computation ──────────────────────────────────────────────────────
par-core     = { version = "2.0", features = ["rayon"] }
generativity = "1.2"

# ── System ────────────────────────────────────────────────────────────────────
rustix   = { version = "0.38", features = ["use-libc"] }
which    = "4.4"
tempfile = "3.27"
moka     = { version = "0.12", features = ["future", "sync"] }
mimalloc = { version = "0.1", default-features = false }

# ── Cooperative cancellation ─────────────────────────────────────────────────
# The former `sandbox` crate was dropped; its `CancelToken` is replaced by
# `tokio_util::sync::CancellationToken` (from the already-present tokio-util).

[dev-dependencies]
tokio      = { version = "1.52", features = ["full"] }
serde_json = "1.0"
tempfile   = "3.27"
