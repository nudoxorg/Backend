[package]
name = "ir-sync"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# iroh provides the QUIC transport layer with Ed25519 node identity.
# We use Minimal preset + MemoryLookup for in-process tests; RelayMode::Disabled
# keeps tests offline.
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }

# iroh-blobs provides the BLAKE3-verified blob store and BlobsProtocol handler.
# The sender adds change files as blobs (computing their iroh::Hash); the receiver
# downloads via the iroh-blobs ALPN before verifying the pijul change hash.
# We only need the mem store in this crate (no fs-store dependency).
iroh-blobs = { version = "0.103.0", default-features = false }

# Announcement encoding: compact, no-schema, deterministic.
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0", features = ["derive"] }

thiserror = "1.0"

# blake3 for the test-double ChangeIo verify impl (computes a test ChangeId from bytes).
blake3 = "1.8.5"

tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
