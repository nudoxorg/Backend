# DoltLite engine pin — the single source of truth for which engine this
# checkout builds.
#
# The amalgamation is ~12 MB of generated C and is `.gitignore`d, so it must be
# re-fetched per checkout (`nu workspace/vendor/doltlite/fetch.nu`). This file is
# what makes that fetch reproducible: the release is pinned by tag *and* by the
# git commit that tag pointed at when it was vendored, and every byte that lands
# on disk is checked against a hash recorded here before anything uses it.
#
# Same discipline as nix/corpus.nix + nix build .#checks.corpus: a fetcher that
# accepts a hash mismatch converts a real failure into an apparent success, which
# is worse than not fetching at all. The hashes here are plain hex sha256 (verify
# with `shasum -a 256`) rather than corpus's nix-base32, because nothing in this
# path goes through a Nix fixed-output derivation and hex is directly checkable
# with a stock tool.
#
# To upgrade: pick a newer tag, run `nu fetch.nu --print-hashes`, paste the
# results here, and re-run `nu fetch.nu`. The build script re-verifies nothing —
# it trusts the files on disk — so the verification has to happen here.

[engine]
# Upstream project. DoltLite is SQLite with the B-tree pager replaced by a
# content-addressed prolly-tree store; the `dolt_*` functions and virtual tables
# are what distinguish it from stock SQLite at runtime.
repository = "https://github.com/dolthub/doltlite"
# Release tag the vendored files were generated from.
tag = "v0.11.41"
# The commit `tag` resolved to at vendoring time (2026-08-07). Tags are mutable;
# this is not.
commit = "e2be0af13e0be44321a45b657a9687594ec22fbe"
# Upstream's own VERSION file at that tag, and the SQLite version the engine
# reports through `sqlite3_libversion()` / `SELECT sqlite_version()`. Stock
# SQLite as bundled by `rusqlite` 0.32 reports 3.46.0, so these differ and the
# difference is a usable diagnostic.
version = "3.54.0"
# `SQLITE_SOURCE_ID` baked into doltlite.h — the upstream SQLite checkout the
# fork is based on. The `alt1` suffix is DoltLite's marker for a modified tree.
sqlite_source_id = "2026-08-01 15:08:48 be245e136a550faa7c84694156c40dc9778f50b00016892c29a2314bef14alt1"

# The published amalgamation archive. Upstream generates it with the canonical
# SQLite autosetup/TCL toolchain (`configure && make sqlite3.c`) and attaches it
# to the release, so there is no reason to run a 380 MB clone and a TCL build
# locally — which is what VENDORING.md used to prescribe.
[archive]
asset = "doltlite-amalgamation-0.11.41.zip"
url = "https://github.com/dolthub/doltlite/releases/download/v0.11.41/doltlite-amalgamation-0.11.41.zip"
sha256 = "7e796b9557945c428ca884a56e849f5c11c43d4c56b0ff8b176f7df9c7d1e858"
bytes = 3097888
# Path prefix inside the zip that is stripped when extracting.
strip_prefix = "doltlite-amalgamation-0.11.41/"

# Every file extracted into this directory, hashed individually. The archive hash
# alone would be enough for integrity; these exist so a partially-restored or
# hand-edited checkout is detectable without re-downloading.
[[files]]
name = "doltlite.c"
sha256 = "a6f73fefdb6f919e00360722f1baca44f51603b4afef885feb067f9a56495f99"
bytes = 11774584
purpose = "The full engine amalgamation: SQLite core + prolly engine + BLAKE3 + every dolt_* function."

[[files]]
name = "doltlite.h"
sha256 = "328616d01675d997062724c73d296f1bc87427e1a6279c342d3e14e8c357759a"
bytes = 694955
purpose = "Public C API header. The API is the standard sqlite3_* surface; rusqdoltlite's build.rs renames the subset it calls into a doltlite_* namespace."

[[files]]
name = "doltliteext.h"
sha256 = "ab0e623ca158e850b08a326b6d6a2d104a540801cb8cd6cfce520b05ab61108d"
bytes = 39467
purpose = "Loadable-extension header. Unused by this binding; kept so the vendored set matches upstream's published archive exactly."

# Symbols that must be DEFINED in the compiled engine. `rusqdoltlite/build.rs`
# asserts the archive exports exactly its `API_FUNCTIONS` list; this is the
# complementary product-level check — the reason the engine exists at all.
# `nm` on a binary that links the engine must show these, and a runtime
# `SELECT dolt_version()` must answer.
[verification]
runtime_probe = "SELECT dolt_version()"
dolt_functions = [
  "dolt_add",
  "dolt_branch",
  "dolt_checkout",
  "dolt_commit",
  "dolt_gc",
  "dolt_merge",
  "dolt_version",
]
dolt_tables = ["dolt_branches", "dolt_log"]
