# Vendored from ParapluOU/terminusdb-rs (crates/schema), wired into the build via
# the [patch] in the workspace root. The ONLY source change from upstream is
# removal of the `rocket` dependency and the four Rocket `FromParam`/
# `FromFormField` impls in src/id.rs (web-form binding we don't use). Dropping
# rocket also resolves the rocket→cookie→time build break and slims the tree.
#
# Workspace-inherited deps and the `../typestate` path dep are pinned to explicit
# versions / the upstream git source so this crate stands alone. Path-based
# dev-dependencies were dropped (we never build this crate's own tests).
[package]
name = "terminusdb-schema"
version = "0.1.0"
edition = "2018"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
itertools = "0.10.3"
tempfile = "3"
decimal-rs = { version = "0.1.38", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
enum_derive = "0.1.7"
custom_derive = "0.1.7"
exec_time = "0.1.4"
rayon = "1.5.3"
glob = { version = "0.3.0" }
hashable = "0.0.0"
enum_variant_macros = "0.3.0"
pseudonym = "0.2.3"
anyhow = "1.0"
typestate = { git = "https://github.com/ParapluOU/terminusdb-rs", package = "typestate" }
uuid = { version = "1.4", features = ["v4", "serde"] }
tap = "1.0.1"
sha2 = "0.10.8"
serde_canonical_json = "1.0.0"
pretty_assertions = "1.4.1"
refined = "0.3.1"
urlencoding = "2.1"
tracing = "0.1"
