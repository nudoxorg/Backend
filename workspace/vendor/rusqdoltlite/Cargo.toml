# Standalone package with its own manifest — not a member of the monorepo
# Cargo workspace. This package compiles a ~20 MB generated C amalgamation
# (vendor/doltlite/doltlite.c) that is deliberately not committed (see
# workspace/vendor/doltlite/VENDORING.md), so it must not be built by
# `cargo check --workspace`. The empty [workspace] table and explicit field
# values (rather than `.workspace = true` inheritance) prevent cargo from
# searching upward for workspace package declarations.
[package]
name = "rusqdoltlite"
edition = "2024"
version = "0.1.0"
license = "MIT"

# Empty workspace table stops cargo from searching upward for workspace.package
[workspace]

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
result_large_err = "allow"
too_many_arguments = "allow"

[lib]
path = "lib.rs"

[dependencies]

[build-dependencies]
# Compiles the vendored DoltLite C amalgamation into a static library.
cc = "1"
