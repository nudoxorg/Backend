[package]
name = "nudox-ir"
description = "Lightweight IR data model shared across the Nudox backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# Test-only instrumentation: `SealReport::disambiguator_census` and
# `SealReport::escalation_rounds` (`package/seal.rs`). Records the exact
# `Disambiguator` variant that minted each declaration's `IntroId`, for
# corpus census/measurement callers outside this crate's own `cfg(test)`.
# Off by default; adds no cost and changes no production behaviour when
# disabled.
seal-census = []

[dependencies]
blake3 = "1"
bon = { workspace = true }
elsa = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ouroboros = { workspace = true }
papaya = { workspace = true }
postcard = { version = "1", features = ["alloc"] }
rustc-hash = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
triomphe = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
blake3 = "1"
itertools = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
vfs = { workspace = true }
