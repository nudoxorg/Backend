[package]
name = "ir"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
# Sources live directly in the crate root (no src/ subdirectory).
path = "lib.rs"

[features]
default = ["facet", "serde"]
facet = ["dep:facet"]
serde = ["dep:serde"]

[dependencies]
# Optional: only compiled when the corresponding feature is active.
facet = { version = "0.42", optional = true }
serde = { version = "1.0", optional = true }

# Always required.
arborium_tree_sitter = { package = "arborium-tree-sitter", version = "2.18" }
rustc_hash = { package = "rustc-hash", version = "1.1" }
thiserror = "1.0"
yoke = "0.8"

[dev-dependencies]
arborium = { version = "2.18", features = ["lang-rust"] }
