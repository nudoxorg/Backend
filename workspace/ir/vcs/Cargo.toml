# ir-vcs — the heavy, libpijul-linked IR patch engine / serve / diff / semver /
# transfer plane.
#
# Holds repo/blob/checkout/checkpoint/continuity/refs/serve_cache/session/subst/
# version + the vcs `error` + the `f1` re-export, the sealed `archive`, the
# structural `diff`, the `semver` classifier, the iroh-based `sync` plane, the
# guest→host `protocol`, and the host-side `stream` driver. It reads the IR data
# model from the light, libpijul-FREE `ir` crate.
[package]
name = "ir-vcs"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# The nudox-ir data model (entry/symbol/kind/change/view/vocab/body/…).
# Aliased as `ir` so all `use ir::` references compile without churn.
ir           = { package = "nudox-ir", path = "../model" }
# The canonical `Language` enum lives in `heart`; `ir-vcs` reads it from there
# and never links the `ecosystem` spec crate.
heart        = { path = "../../heart" }

# ── content-transfer plane ──────────────────────────────────────────────────
# The ONE shared iroh/iroh-blobs provide-fetch now lives in `index::transport`
# (folded from the former standalone `transport` crate; CONSOLIDATION-NOTES §8b).
# `sync::transport` is the IR control protocol over `index::transport::{blob,
# endpoint, frame}`.
# The shared iroh/bao transport plane (was `index::transport`, now its own crate
# so ir-vcs no longer depends on the whole `index` crate — breaks the cycle that
# folding the server into `index` would otherwise create).
transport = { path = "../../transport" }
# iroh is still used directly by the sync tests + repo_glue (SecretKey /
# EndpointId / MemoryLookup vocabulary); the blob store (iroh-blobs) is gone.
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
# tokio for the async transport.
tokio = { version = "1.53.0", features = ["rt", "sync", "time", "macros"] }
# tempfile for atomic write in FsChangeIo::write.
tempfile = "3"

# ── The change engine. GPL — acceptable per design K7. Pinned exactly. ──────
libpijul = "=1.0.0-beta.11"

blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std", "alloc"] }
thiserror = "1.0"
rustc-hash = { package = "rustc-hash", version = "1.1" }
async-trait = "0.1"
nonempty = { version = "0.11", features = ["serialize"] }
anyhow = "1.0"
triomphe = { workspace = true }
# Required by the `archive` module: zero-copy POD headers + yoked views.
zerocopy = { version = "0.8", features = ["derive"] }
yoke = { version = "0.8", features = ["derive"] }
# libpijul change headers carry a `jiff::Timestamp`; pin to libpijul's version.
jiff = "0.2"
# Serve-cache (historical replay hot path).
moka = { version = "0.12", features = ["sync"] }
governor = "0.7"

[dev-dependencies]
postcard = { version = "1.1", features = ["alloc", "use-std"] }
proptest = "1.5"
uuid = { version = "1.23", features = ["v5"] }
semver = "1.0"
# rt-multi-thread for the iroh e2e tests.
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "time"] }
