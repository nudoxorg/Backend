# vector-core: the pure shared plane of the dual local/remote vector-search
# architecture (09-vector PLAN §20, 09b retrieval pipeline, 09c runtime).
# No I/O, no async runtime, no vector-db client — those live in the impl crates.
#
# NOTE: not yet listed in the root workspace `members` (root Cargo.toml is
# frozen for this change); add "workspace/vector-core" there to build.

[package]
name = "vector-core"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
heart = { path = "../heart" }
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
blake3 = "1.8"
uuid = { version = "1.23", features = ["v5", "serde"] }
smol_str = { version = "0.2", features = ["serde"] }
async-trait = "0.1"

[dev-dependencies]
serde_json = "1.0"
