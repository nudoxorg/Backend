[package]
name = "registry"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
# ── First-party workspace crates ──────────────────────────────────────────────
# `cas` and `version` were folded in: content-addressed storage now lives in
# `crate::cas` (backed by `object_store`), and version logic in `heart::version`.
heart = { path = "../heart" }
ecosystem = { path = "../ecosystem" }
ir    = { path = "../ir" }

# ── Async / concurrency ───────────────────────────────────────────────────────
tokio        = { version = "1.52",  features = ["full"] }
futures      = { version = "0.3",   features = ["std", "async-await", "alloc"] }
futures-util = { version = "0.3" }
tokio-stream = { version = "0.1" }
tokio-util   = { version = "0.6" }

# ── SQL / postgres ────────────────────────────────────────────────────────────
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "json",
    "chrono",
    "migrate",
] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# ── Query builder ─────────────────────────────────────────────────────────────
sea-query        = { version = "0.32" }
sea-query-binder = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

# ── Object / blob store ───────────────────────────────────────────────────────
object_store = { version = "0.11" }

# ── Full-text search ──────────────────────────────────────────────────────────
tantivy = "0.22"

# ── Read plane: vector store + caches (folded-in `runtime` module) ────────────
qdrant-client = "1.18"
moka     = { version = "0.12", features = ["future", "sync"] }
secrecy  = { version = "0.10", features = ["serde"] }
nutype   = { version = "0.6", features = ["serde"] }
governor = "0.7"
tower    = { version = "0.4", features = ["util"] }

# ── HTTP client ───────────────────────────────────────────────────────────────
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
postcard   = { version = "1.1", features = ["alloc"] }

# ── String case conversion ────────────────────────────────────────────────────
heck = "0.5"

# ── CSV parsing ───────────────────────────────────────────────────────────────
csv = "1.3"

# ── Type safety / newtypes ────────────────────────────────────────────────────
bytes    = "1.12"
smol_str = { version = "0.2", features = ["serde"] }
nonempty = { version = "0.11", features = ["serialize"] }
url      = { version = "2.5",  features = ["serde"] }
uuid     = { version = "1.23", features = ["v4", "v5", "serde"] }
semver   = "1.0"
chrono   = { version = "0.4",  features = ["serde"] }
uv-pep440 = { version = "0.0.59", features = ["serde", "version-ranges"] }

# ── Error handling ────────────────────────────────────────────────────────────
thiserror = "1.0"
anyhow    = "1.0"

# ── Observability ─────────────────────────────────────────────────────────────
tracing = "0.1"

# ── Enum utilities ────────────────────────────────────────────────────────────
strum = { version = "0.26", features = ["derive"] }

# ── Content hashing + encoding ────────────────────────────────────────────────
blake3        = "1.8"
data-encoding = "2.11"

# ── Archive handling ──────────────────────────────────────────────────────────
flate2            = "1.1"
tar               = "0.4"
zstd              = "0.13"
async-compression = "0.4"
zip               = { version = "2", default-features = false, features = ["deflate"] }

# ── Tree-sitter (blob parsing) ────────────────────────────────────────────────
arborium-tree-sitter = "2.18"

# ── Parallel computation ──────────────────────────────────────────────────────
par-core     = { version = "2.0", features = ["rayon"] }
generativity = "1.2"

[dev-dependencies]
tokio    = { version = "1.52", features = ["full"] }
tempfile = "3.27"
serde_json = "1.0"
url      = "2.5"
smol_str = "0.2"
strum    = { version = "0.26", features = ["derive"] }
generativity = "1.2"
bytes    = "1.12"
futures  = { version = "0.3", features = ["std"] }
axum     = { version = "0.8" }
