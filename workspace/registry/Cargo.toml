[package]
name = "registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

[dependencies]
# ── Intra-workspace vocabulary + IR ────────────────────────────────────────
heart = { workspace = true }
ir = { workspace = true }

# ── Errors ─────────────────────────────────────────────────────────────────
thiserror = { workspace = true }

# ── Backing stores ─────────────────────────────────────────────────────────
object_store = { workspace = true }
sqlx = { workspace = true }
tantivy = { workspace = true }

# ── Typed SQL construction (postgres data layer) ───────────────────────────
sea-query = { workspace = true }
sea-query-binder = { workspace = true }
serde_json = { workspace = true }

# ── Archive extraction (untrusted input) ───────────────────────────────────
tar = { workspace = true }
flate2 = { workspace = true }
async-compression = { workspace = true }

# ── Content addressing / encoding ──────────────────────────────────────────
blake3 = { workspace = true }
data-encoding = { workspace = true }
bytes = { workspace = true }

# ── Parsing (re-parse on demand) ───────────────────────────────────────────
arborium-tree-sitter = { workspace = true }

# ── Identity / typing ──────────────────────────────────────────────────────
generativity = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
smol_str = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
nonempty = { workspace = true }

# ── Serialization ──────────────────────────────────────────────────────────
serde = { workspace = true }
strum = { workspace = true }

# ── Async runtime + streaming ──────────────────────────────────────────────
futures = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }

# ── Observability ──────────────────────────────────────────────────────────
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
ir = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
insta = { workspace = true }
