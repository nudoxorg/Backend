[package]
name = "registry"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

# ── Integration tests ─────────────────────────────────────────────────────────
# Cargo's autodiscovery globs `tests/*.rs` and `tests/*/main.rs` only. Every
# vector test lives at `tests/vector/<name>.rs`, which matches neither, so all 16
# were invisible: no target, no build, no run — and no error either. `registry`
# had exactly one target (`lib`) and reported a clean suite while these had never
# been compiled once.
#
# They are declared explicitly rather than moved up a directory so that the two
# shared support modules keep working (`tests/vector/common/mod.rs` and
# `tests/vector/support/mod.rs` resolve as `mod common;` / `mod support;` from any
# crate root in the same directory), and so that deleting or renaming a file
# fails the manifest loudly instead of silently dropping its coverage. This is
# the same treatment `index` gives `tests/object_pack/*.rs` for the same reason.
#
# Each file carries its own `#![cfg(feature = "…")]`, so the target still builds
# (as an empty crate) when its plane is disabled; no `required-features` here to
# avoid stating that gate in two places.

[[test]]
name = "vector_store_shard"
path = "tests/vector/store_shard.rs"

[[test]]
name = "vector_pack_unpack"
path = "tests/vector/pack_unpack.rs"

[[test]]
name = "vector_depshard_install"
path = "tests/vector/depshard_install.rs"

[[test]]
name = "vector_fanout_hotset"
path = "tests/vector/fanout_hotset.rs"

[[test]]
name = "vector_gate"
path = "tests/vector/gate_tests.rs"

[[test]]
name = "vector_scheduler"
path = "tests/vector/scheduler_tests.rs"

[[test]]
name = "vector_stage"
path = "tests/vector/stage_tests.rs"

[[test]]
name = "vector_weights"
path = "tests/vector/weights_tests.rs"

# Requires the ONNX runtime stack. Without `required-features`, the inner
# `#![cfg(feature = "onnx")]` compiled this target to an empty crate on every
# default build and reported `0 tests; 0 passed` — so it bit-rotted unnoticed
# (duplicate `#![cfg]`, a missing `EmbeddingModel` import, and a `-p vector-embed`
# invocation naming a package that no longer exists). Declaring the requirement
# makes cargo refuse the target up front rather than silently emptying it.
[[test]]
name = "vector_onnx_live"
path = "tests/vector/onnx_live.rs"
required-features = ["onnx"]

# The semantic search section, end to end, through `nudox-engine`'s embedder
# port and against the real model. `required-features` for the same reason
# `vector_onnx_live` has it — and additionally because its `nudox-engine`
# dev-dependency is only worth resolving when the ONNX plane is on.
#
# This is a DEV dependency in one direction only (registry[dev] → nudox-engine),
# so no shipping edge exists between the two crates and `docs/AGENTS-DOCTRINE.md` §1
# is unchanged. See the test file's module docs for the full argument.
[[test]]
name = "vector_engine_relevance"
path = "tests/vector/engine_relevance.rs"
required-features = ["onnx"]

[[test]]
name = "vector_adversarial_depshard"
path = "tests/vector/adversarial_depshard.rs"

[[test]]
name = "vector_adversarial_durability"
path = "tests/vector/adversarial_durability.rs"

[[test]]
name = "vector_adversarial_fanout"
path = "tests/vector/adversarial_fanout.rs"

[[test]]
name = "vector_adversarial_hotset_lock_compact"
path = "tests/vector/adversarial_hotset_lock_compact.rs"

[[test]]
name = "vector_adversarial_pack"
path = "tests/vector/adversarial_pack.rs"

[[test]]
name = "vector_adversarial_scheduler_gate"
path = "tests/vector/adversarial_scheduler_gate.rs"

[[test]]
name = "vector_adversarial_stage"
path = "tests/vector/adversarial_stage.rs"

# ── Vector-plane features (folded-in `vector` crate) ──────────────────────────
# `core` (always-on) is the pure shared vector vocabulary. The impl planes are
# gated: `remote` (qdrant-client + Voyage/rerank) is ON BY DEFAULT since the
# serving spine always talks to a remote qdrant; `local` (qdrant-edge embedded
# store) and `embed`/`onnx` (fastembed/ort runtime) are opt-in.
[features]
default = ["remote"]
local  = ["dep:qdrant-edge", "dep:fs2"]
embed  = ["dep:sha2"]
remote = []
# onnx sub-feature pulls the heavy ONNX runtime stack (fastembed + tokenizers).
onnx   = ["embed", "dep:fastembed", "dep:tokenizers"]

[dependencies]
# ── First-party workspace crates ──────────────────────────────────────────────
# registry = graph + vector ONLY. It deps `heart` (vocab) and the light,
# libpijul-FREE `ir` (the IR data model the graph is projected over) — it does
# NOT transitively link libpijul/iroh (that heavy plane is `ir-vcs`). It does
# NOT dep `index`/doltlite (§8: index is a separate storage layer the client
# composes).
heart    = { path = "../heart" }
ir       = { package = "nudox-ir", path = "../ir/model" }
# Graph query layer — pinned to the exact patch so the schema API is stable.
trustfall = "=0.8.1"

# ── Async / concurrency ───────────────────────────────────────────────────────
tokio   = { version = "1.52", features = ["full"] }
futures = { version = "0.3",  features = ["std", "async-await", "alloc"] }

# ── Vector: remote store + rerank (qdrant-client + Voyage over reqwest) ────────
qdrant-client = "1.18"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Vector: embedding cache ───────────────────────────────────────────────────
moka    = { version = "0.12", features = ["future", "sync"] }
secrecy = { version = "0.10", features = ["serde"] }

# ── Serialization ─────────────────────────────────────────────────────────────
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ── Type safety / newtypes ────────────────────────────────────────────────────
smol_str = { version = "0.2", features = ["serde"] }
uuid     = { version = "1.23", features = ["v4", "v5", "serde"] }

# ── Async traits (VectorStore / Embedder) ─────────────────────────────────────
async-trait = "0.1"

# ── Error handling / observability ────────────────────────────────────────────
thiserror = "1.0"
tracing   = "0.1"

# ── Content hashing ───────────────────────────────────────────────────────────
blake3 = "1.8"

# ── Vector: shard-pack archive (local plane) ──────────────────────────────────
tar  = "0.4"
zstd = "0.13"

# ── Vector: optional impl-plane deps (gated by features) ──────────────────────
# local plane (qdrant-edge embedded store)
qdrant-edge = { version = "=0.7.2", optional = true }
fs2         = { version = "0.4", optional = true }
# embed plane (content hashing for the runtime) + onnx runtime
sha2        = { version = "0.10", optional = true }
fastembed   = { version = "5.17.3", optional = true }
tokenizers  = { version = "0.22.2", optional = true }

[dev-dependencies]
# Used by `tests/vector/engine_relevance.rs` only, to drive the real search
# sections through the engine's `Embedder` port. A dev-dependency creates no
# edge in any consumer's graph — `driver` and `index` are unaffected — which is
# what lets the bridge be tested without `nudox-engine` ever naming `registry`.
#
# The IR crate is NOT re-declared here: `registry` already depends on it as
# `ir` (`ir = { package = "nudox-ir", … }` above), and naming the same package
# twice under two names is a hard cargo error, not a style question. The test
# uses `ir::change::…`.
nudox-engine = { path = "../nudox-engine" }
# `test-util` is NOT part of `full`, and without it `#[tokio::test(start_paused =
# true)]` expands to a `Builder::start_paused` call that does not exist — 17
# errors across the gate/scheduler/stage suites, all reported against unrelated
# lines because the macro's span points at the test body. Every paused-clock test
# in tests/vector/ needs it; they had never been compiled, so nothing had ever
# demanded it.
tokio      = { version = "1.52", features = ["full", "test-util"] }
tempfile   = "3.27"
serde_json = "1.0"
smol_str   = "0.2"
futures    = { version = "0.3", features = ["std"] }
