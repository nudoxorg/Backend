[package]
name = "tokio-async-runtime"
version = "1.35.0"
description = "An async runtime for writing reliable, asynchronous Rust applications"
keywords = ["async", "runtime", "io", "futures"]
categories = ["async-io", "network-programming"]
repository = "https://github.com/tokio-rs/tokio"
documentation = "https://docs.rs/tokio"
license = "MIT"
readme = "README.md"

[dependencies]
mio = "0.8"
bytes = "1.0"
tokio-macros = { version = "2.0", optional = true }
libc = "0.2"
