# nudox-semver — ApiSurface projection + IR-only API classification (SEMANTIC-IR-VCS-PLAN P4/P5).
#
# `surface(table, policy)` projects a materialized IR into the exported ApiSurface
# (+ the three hash classes); `classify(old, new, policy, deps)` turns two surfaces
# into an `ApiReport` under a language law pack. Pure over IR — no rustc, no network,
# no CSC at classify time (K-IR-Only-Semver). MIT.
[package]
name = "nudox-semver"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
nudox-change = { path = "../nudox-change" }
nudox-ir = { path = "../nudox-ir" }
nudox-ir-diff = { path = "../nudox-ir-diff" }

blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
