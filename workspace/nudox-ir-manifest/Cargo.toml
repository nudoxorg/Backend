# nudox-ir-manifest — generation manifest + GenerationStamp identity.
#
# The `BlobManifestV3` (source `files[]` in the source CAS + `ir_package_ref`
# archive + optional `change_set_ref`) and the versioned `GenerationStamp`
# identity-bytes (design Issue 16, v3). Deliberately a small crate depending
# only on `nudox-change` + `heart` so it never drags the heavy `registry`
# service (postgres/tantivy/qdrant) into the IR core; `registry` can adopt these
# types behind its own facade. Outbox API takes a `GenerationStamp` ONLY (K12).
[package]
name = "nudox-ir-manifest"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
nudox-change = { path = "../nudox-change" }
heart = { path = "../heart" }

blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "1.0"
nonempty = { version = "0.11", features = ["serialize"] }

[dev-dependencies]
postcard = { version = "1.1", features = ["alloc", "use-std"] }
# Used only to construct the `heart::Toolchain` / `heart::PackageId` fixtures in
# tests (their real constructors take `semver::Version` / `uuid::Uuid`).
semver = "1"
uuid = { version = "1", features = ["v5"] }
