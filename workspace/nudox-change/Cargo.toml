# nudox-change — content-addressed identity primitives.
#
# Bottom of the IR-VCS dependency stack (design K4 / crate map). Has NO
# dependency on Terminus, HTTP, or `nudox-ir`: it only knows domain-agnostic
# identity newtypes (Hash ①/② discipline), the wire-stable StableRef /
# PackageLineageId vocabulary, and the canonical LE encode helpers. The change
# engine itself is libpijul (via `nudox-ir-vcs`).
[package]
name = "nudox-change"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
