# nudox-change — universal, invertible change algebra.
#
# Bottom of the IR-VCS dependency stack (design K4 / crate map). Has NO
# dependency on Terminus, HTTP, or `nudox-ir`: it only knows domain-agnostic
# identity primitives, the `Atom` trait, and the `Change` envelope. Concrete
# atoms (`IrAtom`, `GraphAtom`) live next to their domain types in higher crates.
[package]
name = "nudox-change"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[dependencies]
blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
postcard = { version = "1.1", features = ["alloc"] }
thiserror = "1.0"

[dev-dependencies]
postcard = { version = "1.1", features = ["alloc", "use-std"] }
