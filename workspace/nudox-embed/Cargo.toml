[package]
name = "nudox-embed"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

# ── The production embedder adapter (AGENTS-DOCTRINE.md §1, "Capability ports") ─
#
# This crate is the home the doctrine said the production adapter did not yet
# have: it "sits *beside* the engine on the `nudox-mcp` argument", not beneath
# it. It bridges `registry`'s real ONNX runtime (`FastembedOrt`) to the engine's
# object-safe `nudox_engine::semantic::Embedder` port. Its public surface speaks
# only the port's vocabulary (`SharedEmbedder`, i.e. `Vec<f32>`/`usize`/`bool`)
# plus a `&str` env var name — no IR type crosses it, which is what keeps it a
# legitimate sibling of `nudox-engine` rather than a smuggled dependency, and is
# why `lindsey` is permitted to depend on it (§1 allow-list, and
# `workspace/gui/tests/dependency_law.rs`).
[features]
# OFF by default, on purpose. The real backend drags in `registry` + `onnx`
# (fastembed / ort / tokenizers) — a 483-crate graph whose `ort-sys` build
# fetches a prebuilt ONNX Runtime C library from the network at `cargo build`
# time unless externally provisioned. Default-off is what keeps a from-a-fresh-
# clone or CI build (and `cargo check --workspace`) free of that fetch and free
# of the 158 extra crates: with the feature off this crate compiles to a few
# lines over `nudox-engine` alone and `load_from_env` always returns `None`
# (→ `SectionState::Unavailable { NoEmbedder }`, the honest "not configured in
# this build" state). A dev or release build opts in with `--features onnx`,
# where the operator has accepted the runtime fetch. See LIMITATIONS.md L41.
default = []
onnx = ["dep:registry", "dep:tokio", "dep:tracing"]

[dependencies]
# The port. This is the only edge that always exists; it carries no runtime.
nudox-engine = { path = "../nudox-engine" }
# The runtime, behind the feature. `features = ["onnx"]` is what turns on
# `FastembedOrt`; without this crate enabling `nudox-embed/onnx` nothing here
# names `registry` at all, so its graph never enters a default build.
registry = { path = "../registry", features = ["onnx"], optional = true }
# For `tokio::sync::OnceCell`: the ORT session loads lazily on first embed so
# engine startup never blocks on a 641 MB read + session build.
tokio = { version = "1", features = ["sync"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
# The real-embedding test drives an async load; it needs a runtime and macros.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
