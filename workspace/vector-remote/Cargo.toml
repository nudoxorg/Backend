# vector-remote: the remote (index) plane of the dual local/remote vector-search
# architecture (09-vector PLAN §20.5, 09b retrieval pipeline plan).
#
# Implements VectorStore<M> over Qdrant (named-vector collections with scalar
# int8 quantization), the Voyage REST embedder, the reranker surface, and the
# hedged local+remote search combinator.
#
# NOTE: not yet listed in the root workspace `members` (root Cargo.toml is
# frozen for this change); add "workspace/vector-remote" there to build.

[package]
name = "vector-remote"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
vector-core = { path = "../vector-core" }
heart        = { path = "../heart" }

qdrant-client = "1.18"
uuid          = { version = "1.23", features = ["v5", "serde"] }

tokio         = { version = "1.52", features = ["rt", "macros", "sync", "time"] }
async-trait   = "0.1"
thiserror     = "1.0"
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
smol_str      = { version = "0.2", features = ["serde"] }
tracing       = "0.1"
futures       = { version = "0.3", features = ["std", "async-await"] }
