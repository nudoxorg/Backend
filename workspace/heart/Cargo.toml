[package]
name = "heart"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"

[features]
# The unified observability stack (heart::telemetry). Off by default so the
# heavy OpenTelemetry/Pyroscope deps are pulled in only by consumers that opt
# in (e.g. `server`); other consumers and the Buck build stay lean.
telemetry = [
    "dep:tracing-subscriber",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:metrics-util",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:opentelemetry-appender-tracing",
    "dep:tracing-opentelemetry",
    "dep:pyroscope",
    "dep:pyroscope_pprofrs",
]

[dependencies]
anyhow = "1.0"

# `tracing` is a base dependency (the `cache` module logs unconditionally); the
# heavy subscriber/OTLP stack below stays behind the `telemetry` feature.
tracing = "0.1"

# ── Telemetry stack (optional; enabled by the `telemetry` feature) ────────────
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"], optional = true }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.16", optional = true }
metrics-util = { version = "0.19", optional = true }
opentelemetry = { version = "0.28", features = ["metrics"], optional = true }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "logs", "metrics", "trace"], optional = true }
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-client", "logs", "metrics", "trace"], optional = true }
opentelemetry-semantic-conventions = { version = "0.28", optional = true }
opentelemetry-appender-tracing = { version = "0.28", optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
pyroscope = { version = "0.5", optional = true }
pyroscope_pprofrs = { version = "0.2", optional = true }
# ── Cache / content-addressed storage (heart::cache) ─────────────────────────
bytes = "1"
moka = { version = "0.12", features = ["future", "sync"] }
dashmap = "6.2"
rand = "0.10"

blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
compact_str = { version = "0.8", features = ["serde"] }
data-encoding = "2.11"
nutype = { version = "0.6", features = ["serde"] }
ordered-float = { version = "4.6", features = ["serde"] }
postcard = { version = "1.1", features = ["alloc"] }
ecosystem = { path = "../ecosystem" }
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
smol_str = { version = "0.2", features = ["serde"] }
strum = { version = "0.26", features = ["derive"] }
thiserror = "1.0"
# `sync`/`rt`/`macros`/`time` are required by heart::cache (Notify, spawn, XFetch).
tokio = { version = "1.52", features = ["sync", "rt", "macros", "time"] }
tower = { version = "0.4", features = ["retry", "util"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
uv-pep440 = { package = "uv-pep440", version = "0.0.59", features = ["serde", "version-ranges"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["full"] }
bytes = "1"
tempfile = "3"
