[package]
name = "index"
description = "Catalog, ingest, and serving composition plane for the Nudox backend"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lints]
workspace = true

[lib]
path = "lib.rs"

[[bin]]
name = "ingest"
path = "ingest/main.rs"

# The serving composition binary (the dissolved `driver`/`server`): assembles the
# federation and serves the axum surface. Built from `index::server::main`.
[[bin]]
name = "nudox-serve"
path = "server/main.rs"
required-features = ["server"]

# Cargo's integration-test autodiscovery globs `tests/*.rs` and `tests/*/main.rs`
# ONLY. `tests/object_pack/{adversarial,transport}.rs` matches neither, so both
# files were silently invisible: no target, no build, no run, and — the reason
# this went unnoticed — no error either. They are declared explicitly so the
# manifest names them; if either file is moved or deleted, cargo now fails
# loudly instead of quietly dropping the coverage.
[[test]]
name = "object_pack_adversarial"
path = "tests/object_pack/adversarial.rs"

[[test]]
name = "object_pack_transport"
path = "tests/object_pack/transport.rs"

[features]
# The real DoltLite-backed facade implementation (INDEX-PLAN ID-20): the
# vendored, hash-pinned prolly-tree engine behind `workspace/vendor/rusqdoltlite`.
# ON by default, and the only product mode. `engine::Configured` resolves to
# `DoltEngine` whenever this is enabled, so a default `cargo test -p index` runs
# every test against the real versioned catalog.
dolt-engine = ["dep:rusqdoltlite"]
# A rusqlite-backed fake of the same facade. OPT-IN ONLY, and unreachable in a
# default build: `engine::Configured` prefers `dolt-engine` whenever both are
# enabled, so Cargo's feature unification cannot silently route anything here.
# NEVER a product mode — its versioning calls are honest fakes (a recorded commit
# log) and its storage is stock SQLite, not a prolly tree, so no measurement
# taken against it describes the product.
#
# It exists for one configuration: a build that must exclude the vendored C
# amalgamation entirely and still type-check and exercise the catalog's SQL
# surface (`--no-default-features --features test-engine`).
#
# HISTORY, because the comment that used to live here is the reason this went
# unnoticed for so long: this was the default, justified by "rusqdoltlite is
# being built by another workstream and does not compile yet". That stopped being
# true when the vendored DoltLite landed, and the justification outlived it —
# every `index` test was running against the fake, and `tests/dolt_engine.rs`,
# gated on the non-default feature, had never once been compiled.
test-engine = []
default = ["dolt-engine"]
# The serving composition (`index::server` + the `nudox-serve` bin). OFF by
# default so a plain `cargo build/test -p index` stays the lean catalog library:
# no axum/ir-vcs/sandbox/embedrs. This used to also be the only thing keeping
# `ir-vcs → libpijul → zstd-seekable`'s independently-compiled second copy of
# the zstd C library from clashing with `index::pack`'s own `zstd-sys` symbols
# (a duplicate macOS `ld` only warns about instead of failing on, so the build
# looked clean while corrupting memory at runtime — it segfaulted the pack
# unit tests whenever the server was linked). That clash is now fixed at the
# source: `workspace/vendor/zstd-seekable` is a fork whose build.rs links
# `zstd-sys`'s libzstd instead of bundling a second one (see that crate's
# Cargo.toml and workspace/vendor/README.md). `server` stays off by default
# regardless, to keep the lean catalog build free of the serving stack's
# dependency weight (axum/tokio/sandbox/embedrs), not because of this.
server = [
    "dep:sandbox", "dep:ir-vcs", "dep:axum", "dep:tower", "dep:tower-http",
    "dep:http", "dep:http-body-util", "dep:hyper", "dep:tokio-util",
    "dep:embedrs", "dep:figment", "dep:opentelemetry", "dep:tracing-opentelemetry",
    "dep:metrics", "dep:tracing-subscriber", "dep:par-core", "dep:generativity",
    "dep:rustix", "dep:which", "dep:mimalloc", "dep:tempfile",
    "dep:nudox-languages",
    "heart/telemetry",
]

[dependencies]
heart = { path = "../heart" }

# The shared iroh/bao transport plane (extracted from `index::transport` into its
# own crate to break the `index ↔ ir-vcs` cycle); re-exported as `index::transport`.
# NON-optional: `index::pack` uses it independently of the server.
transport = { path = "../transport" }

# ── Serving composition deps (folded from the dissolved `driver` crate, §9c) ──
# All optional + gated behind the `server` feature (see [features] above).
# The compile cage + guest→host IR stream decoder the coordination/sync flows use.
sandbox = { path = "../compiler/sandbox", optional = true }
ir-vcs  = { path = "../ir/vcs", optional = true }
# In-process compile strategy for non-Linux hosts (`coordination::compile_inprocess`
# — `// reconcile: in-process (macOS) vs cage (linux)`): the same producer plane
# `crates/nudox-store/Cargo.toml` depends on for the GUI-local engine, owned
# directly here rather than via that crate (which is a different layer —
# `index` must not depend on the GUI-local `nudox-store`). The former producer
# plane — one shared contract crate plus seven per-language producer crates —
# is now consolidated into a single `nudox-languages` crate. Python now
# travels inside that crate, but `index` still does NOT forward its `pyrefly`
# feature (not wired here), so its Python producer contributes nothing (see
# that crate's `YieldContract::RootOnly`) — there is nothing for `index` to
# gain by enabling it. There is no nix producer in the workspace.
nudox-languages = { path = "../compiler/languages", optional = true }
# axum HTTP server + tower middleware + low-level http.
axum       = { version = "0.7", features = ["macros"], optional = true }
tower      = { version = "0.4", features = ["util", "retry", "timeout"], optional = true }
tower-http = { version = "0.6", features = ["trace"], optional = true }
http       = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper      = { version = "0.14", optional = true }
tokio-util = { version = "0.6", optional = true }
# Unified embeddings client (query embedder behind the gated semantic path).
embedrs = { version = "0.4", features = ["tracing"], optional = true }
# Layered configuration (defaults ← file ← env).
figment = { version = "0.10", optional = true }
# Observability used directly by the server composition + bin.
opentelemetry = { version = "0.28", optional = true }
tracing-opentelemetry = { version = "0.29", optional = true }
metrics  = { version = "0.24", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"], optional = true }
# Parallel compute + branded-lifetime + syscalls used by the coordination plane.
par-core     = { version = "2.0", features = ["rayon"], optional = true }
generativity = { version = "1.2", optional = true }
rustix   = { version = "0.38", features = ["use-libc"], optional = true }
which    = { version = "4.4", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
tempfile = { version = "3.27", optional = true }
# ── ecosystem spec (folded in as `index::ecosystem`) ─────────────────────────
# The per-language name/version/upstream/manifest grammar (ECOSYSTEM-PLAN). Used
# only by `index` (+ `driver`, which composes `index`); `Language` itself lives
# in `heart`, so the index-free planes never link this. These three parsers are
# what the spec crate pulled in beyond index's existing serde/strum/semver/pep440.
toml = "0.8"
quick-xml = "0.37"
ron = "0.12"
grit-lib = { git = "https://github.com/gitbutlerapp/grit", rev = "dfb079967b9cbc99e533c21e65f674bb3f5e8b07", features = ["http-ureq"] }
sha2 = "0.10"
rusqdoltlite = { path = "../vendor/rusqdoltlite", optional = true }

# The ephemeral scratch store (jobs/wanted/sessions/claims) is plain rusqlite,
# delete-anytime semantics, never on remotes (INDEX-PLAN ID-2). Also backs the
# test-engine facade. `bundled` so tests need no system SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }

# SeaORM is the typed schema + query surface for the versioned catalog
# (entities, ActiveEnum, Schema-driven migrations, statement builders).
# No sqlx driver: statements execute through the CatalogEngine facade so the
# same code path works for rusqdoltlite (product) and the rusqlite test engine.
sea-orm = { version = "1.1", default-features = false, features = ["macros", "with-uuid", "with-json"] }
# sea-query 0.32 (the query/DDL builder re-exported by sea-orm) is used directly
# by `migrations::ddl` for the schema-v4 CREATE statements.
sea-query = { version = "0.32", default-features = false, features = ["backend-sqlite"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
blake3 = "1.8"
smol_str = { version = "0.2", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"

# ── object-pack: NDPK container engine (folded in as `index::pack`) ────────────
# Deterministic binary codec for header/TOC; fixed-level zstd frames; zero-copy
# range gets; mmap-backed reader.
postcard = { version = "1.1", features = ["alloc"] }
zstd = "0.13"
bytes = "1"
memmap2 = "0.9"
# The shared iroh/bao content-transfer plane now lives as `index::transport`
# (folded from the former standalone `transport` crate). The deps that the
# transport layer needed (iroh-blobs, bao-tree) are listed here so the crate
# compiles as one unit.
iroh-blobs = { version = "0.103.0", default-features = false }
bao-tree = { version = "0.16.0", default-features = false }
# iroh is used directly by `index::pack::transport` + `index::transport` + the object-pack
# tests (Endpoint / SecretKey / MemoryLookup vocabulary).
iroh = { version = "1.0.2", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.53.0", features = ["full"] }

# ── Server-fold + registry-salvage (§8/§9a): the data/storage/coordination plane ─
# The graph + vector survivor registry; index MAY dep registry (registry is
# index-free, so no cycle — CONSOLIDATION §8). Needed for the bakery ledger's
# vector-shard types and any vector payload the folded code builds.
registry = { path = "../registry", features = ["local", "remote"] }
# The IR plane the graph reverse-index (usages projection) is built over.
ir = { package = "nudox-ir", path = "../ir/model" }

# Async / concurrency for the folded coordination/poll/save workers.
futures = { version = "0.3", features = ["std", "async-await", "alloc"] }
futures-util = { version = "0.3" }
async-stream = { version = "0.3" }
tokio-stream = { version = "0.1" }
async-trait = "0.1"

# Object store — the content-addressed CAS backing (salvaged `store.rs`/`blob`).
object_store = { version = "0.11" }
# Vector store client (bakery ledger + any qdrant edge access folded in).
qdrant-client = "1.18"
# Full-text search replica (salvaged `runtime/text` + `search/tantivy`).
tantivy = "0.22"
# HTTP client for upstream crates/nuget pollers + version resolve.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

# Newtypes / vocab used across the folded surface.
nonempty = { version = "0.11", features = ["serialize"] }
secrecy  = { version = "0.10", features = ["serde"] }
url      = { version = "2.5", features = ["serde"] }
semver   = "1.0"
uv-pep440 = { version = "0.0.59", features = ["serde", "version-ranges"] }
arc-swap = "1.9"
strum    = { version = "0.26", features = ["derive"] }
chrono   = { version = "0.4", features = ["serde"] }
data-encoding = "2.11"
moka     = { version = "0.12", features = ["future", "sync"] }
anyhow   = "1.0"

# Archive handling for untrusted-source ingest extraction.
flate2            = "1.1"
tar               = "0.4"
zip               = { workspace = true }
async-compression = "0.4"
# Tree-sitter blob parsing (metadata/facet extraction over source blobs).
arborium-tree-sitter = "2.18"
# Metadata heuristics: keyword casing + synonym-table CSV parsing.
heck = "0.5"
csv  = "1.3"

[dev-dependencies]
# The property/adversarial tests run against the in-memory facade.
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
proptest = "1"
# Doctrine §4: every integration test is also a benchmark. `heart::cost::measured`
# emits the `cost case=` line the perf report parses. For this crate the
# load-bearing figure is `disk_delta_bytes` — the pack/catalog bytes a case
# actually wrote — because wall time on a shared build host is not a usable
# signal. `heart` is already a regular dependency above.
