# Append Avrea's Nix binary-cache substituter after nix-installer-action.
# https://docs.avrea.com/cache/build-cache/nix/
name: Avrea Nix binary cache
description: Configure /etc/nix/nix.conf to use Avrea's colocated Nix substituter
runs:
  using: composite
  steps:
    - name: Configure Avrea Nix substituter
      shell: bash
      run: |
        set -euo pipefail
        cat << 'NIXCONF' | sudo tee -a /etc/nix/nix.conf > /dev/null
        trusted-users = root runner
        substituters = http://cache.avrea.com:8290/nix-build/cache https://cache.nixos.org
        trusted-substituters = http://cache.avrea.com:8290/nix-build/cache https://cache.nixos.org
        require-sigs = false
        NIXCONF
        sudo systemctl restart nix-daemon || sudo launchctl kickstart -k system/org.nixos.nix-daemon 2>/dev/null || true
