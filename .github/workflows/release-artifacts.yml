# Build lindsey desktop artifacts on Avrea (Linux / macOS / Windows).
#
# macOS and Linux (both arches) build entirely through `nix build .#lindsey-app`
# — no brew/apt, no separate cargo build/bundle step; the flake's own
# rustPlatform.buildRustPackage derivation (workspace/gui/package.nix) does
# the whole thing hermetically, oracles/embed-model/ORT included (see
# nix/lindsey-bundle.nix). Windows has no Nix story in this flake at all
# (lindseyAppPackage's supported-systems list is aarch64-darwin/x86_64-darwin/
# x86_64-linux/aarch64-linux, nothing Windows), so it stays on the native
# toolchain + ci-package-lindsey.sh, unchanged.
#
# Avrea is a drop-in GitHub Actions runner with colocated caching:
#   - actions/cache@v4+ is accelerated automatically
#   - Cargo/NuGet/Go registries use pull-through package cache
#   - sccache shares Rust compilation artifacts across jobs (windows-x64 only)
#   - a colocated Nix binary-cache substituter (./.github/actions/avrea-nix-cache)
#   https://docs.avrea.com/cache/
#
# Prerequisites: Avrea GitHub App installed on this repository.

name: Release Artifacts

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".config/scripts/ci-package-lindsey.sh"
      - "workspace/gui/**"
      - "workspace/nudox-engine/**"
      - "workspace/compiler/languages/**"
      - "nix/lindsey-bundle.nix"
      - "flake.nix"
  workflow_dispatch:

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  ORT_VERSION: "1.28.0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  SCCACHE_WEBDAV_ENDPOINT: http://cache.avrea.com:8290/sccache-build/webdav

jobs:
  # `on.push.tags: ["v*"]` is deliberately broad (glob-matches non-release
  # tags like `vNext`/bare `v`/`v-test`, not just semver) — this step is the
  # actual gate. Shared by both package jobs below via `needs`/outputs rather
  # than duplicated, so there is exactly one place a tag is judged valid.
  version:
    name: Compute release version
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - name: Compute release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
            # `${tag#v}` alone would otherwise silently produce an EMPTY
            # string for a bare `v` tag, which both ci-package-lindsey.sh's
            # LINDSEY_VERSION and package.nix's `version` default then treat
            # as unset and coerce to 0.1.0 — a release published under a
            # meaningless tag with a version string that doesn't even match
            # it, no error anywhere. Fail loudly instead.
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag '$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH, optionally with -prerelease and/or +build, e.g. v1.2.3 or v1.2.3-rc.1) — refusing to build a release from it" >&2
              exit 1
            fi
            echo "value=${tag#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.1.0" >> "$GITHUB_OUTPUT"
          fi

  # macOS + Linux (x64/arm64): entirely `nix build`. No brew, no apt, no
  # separate rust-toolchain action, no Cargo/download caching of our own —
  # Nix's own store + the Avrea Nix substituter is the cache.
  package-nix:
    name: package (${{ matrix.label }})
    needs: version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            platform: macos
            runs-on: avrea-macos-26-16-vcpu
            artifact: lindsey-macos-arm64
            archive: lindsey-macos-arm64.tar.gz
          - label: linux-x64
            platform: linux
            runs-on: avrea-ubuntu-24.04-16-vcpu
            artifact: lindsey-linux-x64
            archive: lindsey-linux-x64.tar.gz
          - label: linux-arm64
            platform: linux-arm64
            runs-on: avrea-ubuntu-24.04-arm-16-vcpu
            artifact: lindsey-linux-arm64
            archive: lindsey-linux-arm64.tar.gz

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v17
        with:
          diagnostic-endpoint: ""

      - uses: ./.github/actions/avrea-nix-cache

      - name: nix build .#lindsey-app
        shell: bash
        env:
          LINDSEY_VERSION: ${{ needs.version.outputs.value }}
        run: nix build .#lindsey-app --impure -L

      - name: Push built path to Avrea Nix cache
        if: success()
        shell: bash
        run: |
          out="$(nix path-info ./result)"
          nix copy --to http://cache.avrea.com:8290/nix-build/cache "$out" || true

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          if [ "${{ matrix.platform }}" = macos ]; then
            # result/lindsey.app -> dist/<artifact>/lindsey.app
            cp -RL result/lindsey.app "dist/${{ matrix.artifact }}/lindsey.app"
          else
            # result/{bin,lib,share} -> dist/<artifact>/{bin,lib,share}
            cp -RL result/. "dist/${{ matrix.artifact }}/"
          fi
          # `result` is a Nix store path -- everything under it is read-only
          # by design, and `cp`/`tar` both preserve that mode bit straight
          # into the shipped archive. Left alone, every file a user extracts
          # is read-only, so something as simple as `xattr -dr
          # com.apple.quarantine` (needed just to launch an unsigned .app)
          # fails with "Permission denied" on every single file in the
          # bundle. Make the packaged tree normally writable before tarring.
          chmod -R u+w "dist/${{ matrix.artifact }}"
          ( cd dist && tar -czf "${{ matrix.archive }}" "${{ matrix.artifact }}" )
          ( cd dist && sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256" )

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}/**
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
          retention-days: 14
          if-no-files-found: error

  # Windows: no Nix target exists for it anywhere in this flake, so it stays
  # on the native toolchain + ci-package-lindsey.sh — the one platform this
  # migration deliberately leaves alone.
  package-windows:
    name: package (windows-x64)
    needs: version
    permissions:
      contents: read
    runs-on: avrea-windows-2025-16-vcpu
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/avrea-sccache

      - name: Restore heavy download caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .ci-cache/embed-model
            .ci-cache/ort
          key: lindsey-downloads-v1-${{ env.ORT_VERSION }}
          restore-keys: |
            lindsey-downloads-v1-

      - name: Cache Cargo target (GUI)
        uses: actions/cache@v4
        with:
          path: workspace/gui/target
          key: cargo-lindsey-target-windows-x64-${{ hashFiles('workspace/gui/Cargo.lock') }}
          restore-keys: |
            cargo-lindsey-target-windows-x64-

      - name: Install Windows build dependencies
        shell: bash
        run: |
          choco install golang jq llvm --yes
          echo "LIBCLANG_PATH_DEFAULT=C:/Program Files/LLVM/lib" >> "$GITHUB_ENV"
          echo "GO_BIN_DIR=C:/Program Files/Go/bin" >> "$GITHUB_ENV"

      - name: Install .NET 10 SDK (Windows)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install JDK 21 (Windows)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set Windows toolchain paths
        shell: bash
        run: |
          echo "JAVA_BIN_DIR=$JAVA_HOME/bin" >> "$GITHUB_ENV"
          echo "DOTNET_BIN_DIR=$DOTNET_ROOT" >> "$GITHUB_ENV"

      - name: Build and package lindsey
        shell: bash
        env:
          LINDSEY_VERSION: ${{ needs.version.outputs.value }}
        run: bash .config/scripts/ci-package-lindsey.sh windows

      - name: Save heavy download caches
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci-cache/embed-model
            .ci-cache/ort
          key: lindsey-downloads-v1-${{ env.ORT_VERSION }}

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: lindsey-windows-x64
          path: |
            dist/lindsey-windows-x64/**
            dist/lindsey-windows-x64.zip
            dist/lindsey-windows-x64.zip.sha256
          retention-days: 14
          if-no-files-found: error

  # Publishes a public GitHub Release only on a `v*` tag push — every other
  # trigger (PR, workflow_dispatch) is CI validation only and stops at the
  # ephemeral 14-day package-* artifacts above.
  #
  # Asset filenames are deliberately NOT version-suffixed: they stay exactly
  # what package-nix/ci-package-lindsey.sh already produce (lindsey-macos-arm64.tar.gz,
  # etc.), so `.../releases/latest/download/<name>` is a stable URL a website
  # can hardcode once and never touch again — the alternative (versioned
  # names) would require every consumer to first query the GitHub API to
  # find the current filename. The release itself is still tagged/versioned;
  # historical builds stay reachable via that release's own page.
  publish:
    name: Publish GitHub Release
    needs: [package-nix, package-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Re-validates independently of the `version` job's own check
          # (belt-and-suspenders: this job only reads `needs: [...]`'s
          # success, not its step outputs, so nothing here actually depends
          # on that earlier check having run — a future refactor that
          # decouples the two jobs must not silently drop this gate).
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not a valid release tag (expected vMAJOR.MINOR.PATCH, optionally with -prerelease and/or +build) — refusing to publish" >&2
            exit 1
          fi
          # Semver: a hyphen anywhere after the numeric core marks a
          # pre-release (v1.2.3-rc.1). Tagging one must NOT let it become
          # GitHub's "latest" release — that's exactly the URL the Web repo
          # hardcodes (releases/latest/download/<name>), so every visitor
          # would silently start receiving a pre-release build.
          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and verify release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -iname '*.tar.gz' -o -iname '*.zip' -o -iname '*.sha256' \) -exec cp {} dist/ \;
          cd dist
          echo "-- verifying checksums --"
          sha256sum -c ./*.sha256
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ steps.meta.outputs.prerelease }}

  # Compile gate on every Avrea OS/arch family (no 612MB model download).
  # Left on raw `cargo check` deliberately — it never used brew/apt/choco to
  # begin with (just a rust-toolchain action + a raw ORT tarball fetch), so
  # it isn't the pattern this migration is about, and a full `nix build` per
  # PR push would be far heavier than the fast check this job exists for.
  compile-check:
    name: compile (${{ matrix.label }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-arm64
            runs-on: avrea-macos-26-8-vcpu
            rust-target: aarch64-apple-darwin
            ort-asset: onnxruntime-osx-arm64-1.28.0.tgz
            ort-kind: tgz
          - label: linux-x64
            runs-on: avrea-ubuntu-24.04-4-vcpu
            rust-target: x86_64-unknown-linux-gnu
            ort-asset: onnxruntime-linux-x64-1.28.0.tgz
            ort-kind: tgz
          - label: linux-arm64
            runs-on: avrea-ubuntu-24.04-arm-4-vcpu
            rust-target: aarch64-unknown-linux-gnu
            ort-asset: onnxruntime-linux-aarch64-1.28.0.tgz
            ort-kind: tgz
          - label: windows-x64
            runs-on: avrea-windows-2025-4-vcpu
            rust-target: x86_64-pc-windows-msvc
            ort-asset: onnxruntime-win-x64-1.28.0.zip
            ort-kind: zip

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.rust-target }}

      - uses: ./.github/actions/avrea-sccache

      - name: Cache ONNX Runtime (compile only)
        uses: actions/cache@v4
        with:
          path: .ci-cache/ort-compile/${{ matrix.label }}
          key: ort-compile-${{ matrix.label }}-${{ env.ORT_VERSION }}

      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          ort=".ci-cache/ort-compile/${{ matrix.label }}"
          mkdir -p "$ort"
          if [ "${{ matrix.ort-kind }}" = tgz ]; then
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort-asset }}" \
              | tar -xz -C "$ort" --strip-components=1
          else
            curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${{ matrix.ort-asset }}" \
              -o /tmp/ort.zip
            unzip -q /tmp/ort.zip -d "$ort"
          fi
          echo "ORT_LIB_LOCATION=$ort/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"

      - name: cargo check lindsey
        shell: bash
        run: |
          cd workspace/gui
          cargo check --locked --bin lindsey

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true
