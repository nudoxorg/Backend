[package]
name = "backend-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
cluster-process-journey-hooks = []

[dependencies]
backend-advisory = { path = "../advisory" }
backend-cluster-transport = { path = "../cluster-transport" }
backend-execution = { path = "../execution" }
backend-flow = { path = "../flow" }
backend-replication = { path = "../replication" }
backend-runtime = { path = "../runtime" }
backend-semantic = { path = "../semantic" }
backend-store = { path = "../store" }
backend-version = { path = "../version" }
base64.workspace = true
blake3.workspace = true
backend-compile = { path = "../compile" }
flate2.workspace = true
backend-library = { path = "../library" }
backend-platform = { path = "../platform" }
backend-frontend-clang = { path = "../../frontends/clang" }
backend-frontend-csharp = { path = "../../frontends/csharp" }
backend-frontend-go = { path = "../../frontends/go" }
backend-frontend-java = { path = "../../frontends/java" }
backend-frontend-python = { path = "../../frontends/python" }
backend-frontend-rust = { path = "../../frontends/rust" }
backend-frontend-typescript = { path = "../../frontends/typescript" }
backend-extension-qdrant = { path = "../../extensions/qdrant" }
backend-extension-tantivy = { path = "../../extensions/tantivy" }
backend-extension-trustfall = { path = "../../extensions/trustfall" }
arrayvec.workspace = true
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry_sdk.workspace = true
quick-xml.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
sha2.workspace = true
sha1.workspace = true
zip.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true
zerocopy.workspace = true
unicode-normalization = "0.1.25"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
  "std",
  "fs",
  "net",
  "process",
] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
nix = { version = "0.30.1", default-features = false, features = [
  "socket",
  "user",
] }

[dev-dependencies]
allocation-counter.workspace = true
futures-core.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "source_resolution"
harness = false

[[bench]]
name = "registry_decode"
harness = false

[[bench]]
name = "compiler_input_tree_v2"
harness = false

[lints]
workspace = true
