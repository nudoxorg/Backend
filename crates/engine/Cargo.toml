[package]
name = "backend-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[dependencies]
backend-execution = { path = "../execution" }
backend-flow = { path = "../flow" }
backend-replication = { path = "../replication" }
backend-runtime = { path = "../runtime" }
backend-semantic = { path = "../semantic" }
backend-store = { path = "../store" }
backend-version = { path = "../version" }
base64.workspace = true
blake3.workspace = true
backend-compile = { path = "../compile" }
backend-library = { path = "../library" }
compiler-publication = { path = "../compiler-publication" }
heart-hydration = { path = "../heart-hydration" }
heart-root = { path = "../heart-root" }
opentelemetry.workspace = true
opentelemetry-appender-tracing.workspace = true
opentelemetry_sdk.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
ureq.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "fs", "net", "process"] }

[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "freebsd", target_os = "dragonfly", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
nix = { version = "0.30.1", default-features = false, features = ["socket", "user"] }

[dev-dependencies]
compiler-driver = { path = "../compiler-driver" }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
server-journal = { path = "../server-journal" }
[lints]
workspace = true
