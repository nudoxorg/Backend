# Defines the `heart-view` package and its explicit dependency boundary.
# The crate exists to validate and borrow canonical framed data without allocating.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-view"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-schema = { path = "../heart-schema" }
strum.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
bolero.workspace = true
heart-frame = { path = "../heart-frame" }
rstest.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
