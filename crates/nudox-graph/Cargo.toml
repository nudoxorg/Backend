[package]
name = "nudox-graph"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 of GUI-LOCAL-PLAN §L0: the query plane. One schema (`schema.graphql`),
# one strongly-typed `Vertex`, one async fallible `CorpusAdapter`.

[dependencies]
nudox-ir = { path = "../../workspace/ir/model" }
nudox-store = { path = "../nudox-store" }

futures = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
trustfall = { workspace = true }

[dev-dependencies]
nudox-store = { path = "../nudox-store", features = ["fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
