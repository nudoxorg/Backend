# Defines the `server-index-publish` package and its explicit dependency boundary.
# The crate exists to seal index segments into durable, reopenable snapshot packs.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-publication = { path = "../compiler-publication" }
server-journal = { path = "../server-journal" }
backend-version = { path = "../version" }
backend-semantic = { path = "../semantic" }
server-index-build = { path = "../server-index-build" }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
compiler-driver = { path = "../compiler-driver" }
heart-hydration = { path = "../heart-hydration" }
backend-extension-qdrant = { path = "../../extensions/qdrant" }
backend-extension-tantivy = { path = "../../extensions/tantivy" }
backend-extension-trustfall = { path = "../../extensions/trustfall" }
heart-root = { path = "../heart-root" }
backend-store = { path = "../store" }
[lints]
workspace = true

[lib]
path = "lib.rs"
