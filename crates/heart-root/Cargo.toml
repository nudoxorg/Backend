# Defines the `heart-root` package and its explicit dependency boundary.
# The crate exists to construct and validate immutable generation roots and locality metadata.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-root"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
derive_more.workspace = true
fearless_simd = { workspace = true, features = ["libm"] }
backend-version = { path = "../version" }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
bolero.workspace = true
fearless_simd = { workspace = true, features = ["force_support_fallback", "std"] }
compiler-driver = { path = "../compiler-driver" }
compiler-publication = { path = "../compiler-publication" }
backend-semantic = { path = "../semantic" }
server-journal = { path = "../server-journal" }
server-index-build = { path = "../server-index-build" }
server-index-core = { path = "../server-index-core" }
server-index-graph-vector = { path = "../server-index-graph-vector" }
server-index-trustfall = { path = "../server-index-trustfall" }
server-index-tantivy = { path = "../server-index-tantivy" }
compiler-ir = { path = "../compiler-ir" }
serde.workspace = true
serde_json.workspace = true

[[bench]]
name = "capacity-planning"
path = "benches/capacity_planning.rs"
harness = false

[[example]]
name = "capacity-worksheet"
path = "examples/capacity_worksheet.rs"

[lints]
workspace = true

[lib]
path = "lib.rs"
