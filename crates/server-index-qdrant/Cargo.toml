# Defines the `server-index-qdrant` package and its explicit dependency boundary.
# The crate exists to adapt typed vector authorities and queries to the Qdrant service.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-qdrant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
compiler-ir = { path = "../compiler-ir" }
arrayvec = { workspace = true, features = ["serde"] }
server-index-graph-vector = { path = "../server-index-graph-vector" }
server-index-vocabulary = { path = "../server-index-vocabulary" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ureq.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
flate2.workspace = true

[lib]
path = "lib.rs"
