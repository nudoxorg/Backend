# Defines the `server-runtime` package and its explicit dependency boundary.
# The crate exists to schedule bounded work with explicit credits, ownership, and wakeups.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
atomic-waker.workspace = true
loom = { version = "0.7", optional = true }
heart-observe = { path = "../heart-observe" }
thiserror.workspace = true

[dev-dependencies]

[features]
loom-model = ["dep:loom"]

[lints]
workspace = true

[lib]
path = "lib.rs"
