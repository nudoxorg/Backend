# Defines the `heart-object` package and its explicit dependency boundary.
# The crate exists to describe canonical objects, providers, and residency.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-object"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
derive_more.workspace = true
heart-identity = { path = "../heart-identity" }
heart-schema = { path = "../heart-schema" }
thiserror.workspace = true
zerocopy.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
