[package]
name = "backend-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true

[lib]
path = "lib.rs"

# Unix builds use only the standard library. Windows builds reach AF_UNIX
# sockets through `socket2` and the Win32 security API through `windows-sys`;
# every unsafe call lives in this crate's `win32` module and nowhere else.
[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6.5", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[lints]
workspace = true
