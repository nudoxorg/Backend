[package]
name = "backend-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "lib.rs"

# Unix builds use only the standard library. Windows builds reach AF_UNIX
# sockets through `socket2` and the Win32 security API through `windows-sys`;
# every unsafe call lives in this crate's `win32` module and nowhere else.
[target.'cfg(windows)'.dependencies]
socket2 = { version = "0.6.5", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

# The workspace forbids unsafe code, and `forbid` arrives on the rustc command
# line, where no `#![allow]` can relax it. The Win32 seam in `win32/` is the one
# audited exception the workspace grants, so this crate spells the workspace set
# out instead of inheriting it and softens exactly one lint to `deny`: the
# per-module `#![allow(unsafe_code, reason = …)]` headers then apply, and
# `lib.rs` restores `forbid` for every non-Windows build. Keep the rest of this
# table in step with `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "warn"
mem_forget = "deny"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
