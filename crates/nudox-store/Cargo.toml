[package]
name = "nudox-store"
version.workspace = true
edition.workspace = true
license.workspace = true

# L1 of GUI-LOCAL-PLAN §L0: the local corpus. Owns `IrView`s and everything
# derived from them. Depends on `nudox-ir` and the producer plane; must never
# depend on gpui, on a GUI type, or on anything above it in the stack.

[features]
default = []
# `FixtureSource` — deterministic synthetic corpora for tests and dev (LR-5).
fixtures = []
# Forwards to `nudox-producer-python`'s own `pyrefly` feature (off by
# default there — see that crate's Cargo.toml for the three reasons the
# real pyrefly dependency isn't declared). Without this feature,
# `PythonProducer::invoke` always returns `Ok(PythonOracle::default())` —
# success, not error — which is indistinguishable at the call site from a
# package that genuinely has no public API. `ProducerRegistry::with_all_available`
# therefore only registers `Language::Python` when this feature is on;
# see that constructor's doc comment in `src/source/producer.rs`.
pyrefly = ["nudox-producer-python/pyrefly"]

[dependencies]
nudox-ir = { path = "../../workspace/ir/model" }
nudox-producer = { path = "../../workspace/compiler/producer" }
nudox-producer-rust = { path = "../../workspace/compiler/languages/rust" }
nudox-producer-go = { path = "../../workspace/compiler/languages/go" }
nudox-producer-java = { path = "../../workspace/compiler/languages/java" }
nudox-producer-csharp = { path = "../../workspace/compiler/languages/csharp" }
nudox-producer-clang = { path = "../../workspace/compiler/languages/clang" }
nudox-producer-python = { path = "../../workspace/compiler/languages/python" }
nudox-producer-typescript = { path = "../../workspace/compiler/languages/typescript" }

futures = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
triomphe = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# Doctrine §4: every integration test is also a benchmark. `measured()` emits the
# `cost case=… wall_ms=… rss_bytes=… disk_delta_bytes=…` line the corpus report parses.
nudox-test-support = { path = "../nudox-test-support" }
# `tests/corpus_contract.rs` reads `corpus/manifest.toml` and
# `corpus/entry-baseline.toml` — the two files that between them define what the
# corpus is and how many entries each package lowers to. Test-only: nothing in
# the library reads either file.
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
