# Defines the `server-operation` package and its explicit dependency boundary.
# The crate exists to compose hydration, compilation, publication, and storage into public operations.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-operation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-hydration = { path = "../heart-hydration" }
heart-identity = { path = "../heart-identity" }
heart-object = { path = "../heart-object" }
heart-root = { path = "../heart-root" }
heart-schema = { path = "../heart-schema" }
thiserror.workspace = true

[dev-dependencies]
compiler-driver = { path = "../compiler-driver" }
compiler-publication = { path = "../compiler-publication" }
compiler-vocabulary = { path = "../compiler-vocabulary" }
compiler-languages-csharp = { path = "../compiler-language-csharp" }
compiler-languages-go = { path = "../compiler-language-go" }
compiler-languages-java = { path = "../compiler-language-java" }
compiler-languages-rust = { path = "../compiler-language-rust" }
compiler-languages-typescript = { path = "../compiler-language-typescript" }
compiler-languages-python = { path = "../compiler-language-python" }
server-journal = { path = "../server-journal" }
server-index-build = { path = "../server-index-build" }
server-index-core = { path = "../server-index-core" }
compiler-ir = { path = "../compiler-ir" }
heart-memory = { path = "../heart-memory" }
blake3.workspace = true
sha2 = "=0.10.9"
[lints]
workspace = true

[lib]
path = "lib.rs"
