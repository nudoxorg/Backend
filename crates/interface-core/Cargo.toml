# Defines the `interface-core` package and its explicit dependency boundary.
# The crate exists to own the transport-independent application service and reply vocabulary.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "interface-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec.workspace = true
heart-adaptive = { path = "../heart-adaptive" }
compiler-registry = { path = "../compiler-registry" }
compiler-vocabulary = { path = "../compiler-vocabulary" }
heart-identity = { path = "../heart-identity" }
heart-observe = { path = "../heart-observe" }
server-index-core = { path = "../server-index-core" }
[dev-dependencies]
allocation-counter.workspace = true
compiler-ir = { path = "../compiler-ir" }

[lints]
workspace = true

[lib]
path = "lib.rs"

[[bench]]
name = "client_sync"
path = "benches/client_sync.rs"
harness = false
