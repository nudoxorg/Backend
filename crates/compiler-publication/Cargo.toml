# Defines the `compiler-publication` package and its explicit dependency boundary.
# The crate exists to publish verified compiler fragments as immutable generations.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-publication"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backend-semantic = { path = "../semantic" }
compiler-driver = { path = "../compiler-driver" }
server-journal = { path = "../server-journal" }
heart-hydration = { path = "../heart-hydration" }
backend-version = { path = "../version" }
heart-root = { path = "../heart-root" }
backend-store = { path = "../store" }
thiserror.workspace = true

[dev-dependencies]
[lib]
path = "lib.rs"
