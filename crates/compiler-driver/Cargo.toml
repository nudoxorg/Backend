# Defines the `compiler-driver` package and its explicit dependency boundary.
# The crate exists to run bounded native toolchains and lower their output into canonical IR.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backend-semantic = { path = "../semantic" }
compiler-registry = { path = "../compiler-registry" }
compiler-languages-clang = { path = "../compiler-language-clang" }
compiler-languages-csharp = { path = "../compiler-language-csharp" }
compiler-languages-go = { path = "../compiler-language-go" }
compiler-languages-java = { path = "../compiler-language-java" }
compiler-languages-python = { path = "../compiler-language-python" }
compiler-languages-rust = { path = "../compiler-language-rust" }
compiler-languages-typescript = { path = "../compiler-language-typescript" }
backend-version = { path = "../version" }
sha2 = "=0.10.9"
thiserror.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
compiler-publication = { path = "../compiler-publication" }
server-journal = { path = "../server-journal" }
ureq = { workspace = true }
flate2 = { workspace = true }
server-index-build = { path = "../server-index-build" }
server-index-publish = { path = "../server-index-publish" }
server-index-core = { path = "../server-index-core" }

[lib]
path = "lib.rs"
