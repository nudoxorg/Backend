# Defines the `compiler-driver` package and its explicit dependency boundary.
# The crate exists to run bounded native toolchains and lower their output into canonical IR.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backend-semantic = { path = "../semantic" }
compiler-registry = { path = "../compiler-registry" }
backend-frontend-clang = { path = "../../frontends/clang" }
backend-frontend-csharp = { path = "../../frontends/csharp" }
backend-frontend-go = { path = "../../frontends/go" }
backend-frontend-java = { path = "../../frontends/java" }
backend-frontend-python = { path = "../../frontends/python" }
backend-frontend-rust = { path = "../../frontends/rust" }
backend-frontend-typescript = { path = "../../frontends/typescript" }
backend-version = { path = "../version" }
sha2 = "=0.10.9"
thiserror.workspace = true

[dev-dependencies]
serde_json = { workspace = true }
compiler-publication = { path = "../compiler-publication" }
server-journal = { path = "../server-journal" }
ureq = { workspace = true }
flate2 = { workspace = true }
server-index-build = { path = "../server-index-build" }
server-index-publish = { path = "../server-index-publish" }
server-index-core = { path = "../server-index-core" }

[lib]
path = "lib.rs"
