# Defines the `heart-memory` package and its explicit dependency boundary.
# The crate exists to store immutable objects in bounded caller-selected memory.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec.workspace = true
derive_more.workspace = true
heart-identity = { path = "../heart-identity" }
heart-object = { path = "../heart-object" }
heart-observe = { path = "../heart-observe" }
thiserror.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
heart-schema = { path = "../heart-schema" }
rstest.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
