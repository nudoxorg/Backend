# Defines the `heart-observe` package and its explicit dependency boundary.
# The crate exists to define allocation-free observation events and probe capabilities.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-observe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arrayvec.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
