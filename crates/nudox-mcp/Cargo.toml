[package]
name = "nudox-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true

# L4 of GUI-LOCAL-PLAN §L6: the MCP server lindsey hosts. A *view* of the
# engine (LR-8) — every tool bottoms out in an `EngineHandle` call or a
# `CorpusAdapter` query, never in a direct `nudox-ir` read.
#
# `nudox-graph` is a dependency only for `schema()` (LR-7: one schema, served
# to agents verbatim). The `CorpusAdapter` itself is reached through
# `EngineHandle::query`, because LR-9 says the engine owns every runtime and
# the Trustfall result stream is `!Send`.

[dependencies]
nudox-engine = { path = "../nudox-engine" }
nudox-graph = { path = "../nudox-graph" }
# TODO(engine): this dependency exists for exactly two items —
# `change::EcosystemId` and `change::PackageName` — and is confined to
# `src/dto.rs::SymbolKeyDto::to_wire`.
#
# `EngineHandle::open_symbol` takes a `SymbolKey` (= `nudox_ir::change::StableRef`),
# but `nudox_engine::wire` re-exports only `SymbolKey`/`IntroId`/`PackageLineageId`
# — not the two newtypes needed to *build* a `PackageLineageId`. There is
# therefore no way to turn an agent-supplied `"ecosystem:name#introhex"` string
# into a `SymbolKey` through the engine's public surface, and `get_symbol` is
# unimplementable without it.
#
# Delete this dependency as soon as `nudox_engine::wire` adds
# `pub use nudox_ir::change::{EcosystemId, PackageName};` (or, better, a
# `SymbolKey` string codec). No IR type is read here — LR-8's "a tool that reads
# nudox-ir directly is a finding" is about walking `Entry`/`IrView`, which this
# crate never does.
nudox-ir = { path = "../nudox-ir" }

# axum 0.8 is the version rmcp 2.2 itself tests `StreamableHttpService`
# against (rmcp-2.2.0/Cargo.toml `[dev-dependencies.axum]`). `StreamableHttpService`
# is a bare `tower_service::Service`; axum supplies the connection loop
# (`axum::serve`), the router (`nest_service`) and the auth layer
# (`middleware::from_fn_with_state`). No TLS: the listener is loopback-only.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# `rand` for the per-launch session token (§L6). Pinned to 0.10, matching
# `workspace/heart`, so no second major lands in the lockfile.
rand = "0.10"
rmcp = { version = "2.2", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros"] }
# `CancellationToken` only — `McpEndpoint` keeps the token that
# `StreamableHttpServerConfig` already owns rather than inventing a second
# shutdown signal. Same pin and features as `nudox-engine`.
tokio-util = { version = "0.7", features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
nudox-engine = { path = "../nudox-engine", features = ["fixtures"] }
nudox-store = { path = "../nudox-store", features = ["fixtures"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "net", "macros", "io-util", "time"] }
trustfall = { workspace = true }

[lints]
workspace = true
