# Purpose: standalone typed Python syntax-fact extraction.
# Purpose: source-preserving declarations, annotations, and occurrences.
# Purpose: no semantic driver or runtime dependency.
[package]
name = "compiler-languages-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
backend-semantic = { path = "../semantic" }
ruff_python_parser = "=0.0.8"
ruff_python_ast = "=0.0.8"
ruff_text_size = "=0.0.8"
thiserror = { version = "2", default-features = false }

[lib]
path = "lib.rs"
