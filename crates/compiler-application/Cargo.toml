# Defines the `compiler-application` package and its explicit dependency boundary.
# The crate exists to bind application requests to native compilation and durable publication.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true


[dependencies]
arrayvec.workspace = true
blake3.workspace = true
compiler-driver = { path = "../compiler-driver" }
compiler-publication = { path = "../compiler-publication" }
backend-library = { path = "../library" }
backend-semantic = { path = "../semantic" }
backend-store = { path = "../store" }
backend-version = { path = "../version" }
backend-frontend-csharp = { path = "../../frontends/csharp" }
backend-frontend-go = { path = "../../frontends/go" }
backend-frontend-java = { path = "../../frontends/java" }
backend-frontend-python = { path = "../../frontends/python" }
backend-frontend-rust = { path = "../../frontends/rust" }
backend-frontend-typescript = { path = "../../frontends/typescript" }
thiserror.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
