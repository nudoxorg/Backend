[package]
name = "backend-local-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
search-bench = []
cluster-process-journey-hooks = [
    "backend-engine/cluster-process-journey-hooks",
    "backend-store-s3/test-support",
]
# Builders for hosts' tests of states this build cannot write on its own
# (`builtin::write_state_from_another_build`).
test-support = []

[dependencies]
backend-client = { path = "../client" }
backend-compile = { path = "../compile" }
backend-engine = { path = "../engine" }
backend-extension-turso = { path = "../../extensions/turso" }
backend-extension-qdrant = { path = "../../extensions/qdrant" }
backend-extension-tantivy = { path = "../../extensions/tantivy" }
backend-extension-trustfall = { path = "../../extensions/trustfall" }
backend-frontend-clang = { path = "../../frontends/clang" }
backend-frontend-csharp = { path = "../../frontends/csharp" }
backend-frontend-go = { path = "../../frontends/go" }
backend-frontend-java = { path = "../../frontends/java" }
backend-frontend-python = { path = "../../frontends/python" }
backend-frontend-rust = { path = "../../frontends/rust" }
backend-frontend-typescript = { path = "../../frontends/typescript" }
backend-library = { path = "../library" }
backend-platform = { path = "../platform" }
backend-replication = { path = "../replication" }
backend-runtime = { path = "../runtime" }
backend-semantic = { path = "../semantic" }
backend-store = { path = "../store" }
backend-store-s3 = { path = "../store-s3" }
backend-version = { path = "../version" }
blake3.workspace = true
base64.workspace = true
hmac.workspace = true
hashlink = "=0.12.2"
tantivy.workspace = true
postcard.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
ureq.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }
unicode-normalization = "0.1.25"

[dev-dependencies]
backend-store-s3 = { path = "../store-s3", features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std"] }

[[bench]]
name = "package_publication"
path = "benches/package_publication.rs"
harness = false

[[bench]]
name = "manifest_residence"
path = "benches/manifest_residence.rs"
harness = false

[[bench]]
name = "manifest_ancestor"
path = "benches/manifest_ancestor.rs"
harness = false

[[bench]]
name = "search_corpus"
path = "benches/search_corpus.rs"
harness = false

[[bench]]
name = "semantic_image_reopen"
path = "benches/semantic_image_reopen.rs"
harness = false

[[bench]]
name = "semantic_image_rows"
path = "benches/semantic_image_rows.rs"
harness = false

[[bench]]
name = "semantic_image_batch"
path = "benches/semantic_image_batch.rs"
harness = false

[[bench]]
name = "semantic_query_walk"
path = "benches/semantic_query_walk.rs"
harness = false

[[bench]]
name = "semantic_generation"
path = "benches/semantic_generation.rs"
harness = false

[[bench]]
name = "semantic_admission"
path = "benches/semantic_admission.rs"
harness = false

[[bench]]
name = "semantic_image_proof"
path = "benches/semantic_image_proof.rs"
harness = false

[[bench]]
name = "semantic_snapshot_residence"
path = "benches/semantic_snapshot_residence.rs"
harness = false

[lints]
workspace = true
