# Defines the `heart-identity` package and its explicit dependency boundary.
# The crate exists to provide domain-separated content, artifact, generation, and authority identities.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
thiserror.workspace = true

[dev-dependencies]
trybuild.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
