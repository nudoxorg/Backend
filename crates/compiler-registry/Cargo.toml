# Defines the `compiler-registry` package and its explicit dependency boundary.
# The crate exists to select a statically typed compiler implementation for each supported request.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-vocabulary = { path = "../compiler-vocabulary" }

[lib]
path = "lib.rs"
