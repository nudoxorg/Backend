# Defines the `heart-schema` package and its explicit dependency boundary.
# The crate exists to define shared binary schema limits, identifiers, and vocabulary.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-schema"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
strum.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
