# Defines the `compiler-ir-vocabulary` package and its explicit dependency boundary.
# The crate exists to define compact semantic coordinates shared by IR producers and consumers.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "compiler-ir-vocabulary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
heart-identity = { path = "../heart-identity" }

[dev-dependencies]
thiserror.workspace = true

[lib]
path = "lib.rs"
