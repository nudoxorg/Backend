[package]
name = "backend-semantic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
arrayvec.workspace = true
blake3 = { workspace = true }
backend-version = { path = "../version" }
backend-flow = { path = "../flow" }
loom = { workspace = true, optional = true }
memmap2 = { version = "0.9.9", optional = true }
serde.workspace = true
thiserror.workspace = true
turso.workspace = true

[features]
loom-model = ["dep:loom"]
mmap = ["dep:memmap2"]
# Comparison-only baseline for the jumbo UTF-8 ASCII fast-path benchmark.
jumbo-utf8-ascii-scalar = []

[dev-dependencies]
allocation-counter.workspace = true
futures-executor.workspace = true
serde_json.workspace = true
# render_snapshot_corpus: the snapshot harness compiles real corpus packages
# through the real per-language authorities (`compile_ir`) before rendering.
# The C# authority image is produced by the vendored helper through `dotnet`
# directly, so that lane needs no frontend crate.  Dev-dependencies only;
# the library graph is unchanged.
backend-engine = { path = "../engine" }
backend-frontend-clang = { path = "../../frontends/clang" }
backend-frontend-go = { path = "../../frontends/go" }
backend-frontend-java = { path = "../../frontends/java" }
backend-frontend-python = { path = "../../frontends/python" }
backend-frontend-rust = { path = "../../frontends/rust" }
backend-frontend-typescript = { path = "../../frontends/typescript" }

[[bench]]
name = "lexical-manifest"
path = "benches/lexical_manifest.rs"
harness = false

[[bench]]
name = "ir-delta"
path = "benches/ir_delta.rs"
harness = false

[[bench]]
name = "stable-row-index"
path = "benches/stable_row_index.rs"
harness = false

[[bench]]
name = "jumbo-utf8-ascii"
path = "benches/jumbo_utf8_ascii.rs"
harness = false

[lints]
workspace = true
