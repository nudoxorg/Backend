# Defines the `server-index-build` package and its explicit dependency boundary.
# The crate exists to project reopened compiler IR into immutable exact and lexical segments.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "server-index-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backend-engine = { path = "../engine" }
backend-version = { path = "../version" }
backend-semantic = { path = "../semantic" }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
allocation-counter.workspace = true
backend-store = { path = "../store" }
[lints]
workspace = true

[lib]
path = "lib.rs"
