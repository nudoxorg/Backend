[package]
name = "nudox-producer-typescript"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
nudox-ir = { path = "../nudox-ir" }
nudox-producer = { path = "../nudox-producer" }

# OXC 0.139.0 — lockstep-pinned with `=` (git tags track applications not lib
# versions; the commit SHA for 0.139.0 is 69b2dfc1810e6ad9d5508ae9a20bc773ba5aa18d).
# Features mirror what git-fragment.bzl documents:
#   oxc_allocator: default (no `bitset` — that feature is internal to oxc_semantic)
#   oxc_ast:       default (no `serialize` — we don't need serde on AST nodes)
#   oxc_parser:    default (`regular_expression` is the only non-default feature
#                  and it is included by default in 0.139.0)
#   oxc_semantic:  default + `jsdoc` (pulls oxc_jsdoc for JSDoc tag parsing)
#   oxc_span:      default
#   oxc_syntax:    default (we don't need `to_js_string`)
#
# UNCERTAINTY: The OXC crates are sourced from git in the Buck2 build (not
# crates.io). The Cargo workspace build must pull them from crates.io.
# All listed versions are 0.139.0 as confirmed in git-fragment.bzl.
# If crates.io does not have 0.139.0 for all sub-crates, this will fail to
# resolve. The resolver may need to be pointed at the git source or a registry
# patch. The reviewer should verify crates.io availability.
oxc_allocator = { version = "=0.139.0" }
oxc_ast = { version = "=0.139.0" }
oxc_parser = { version = "=0.139.0" }
oxc_jsdoc = { version = "=0.139.0" }
oxc_semantic = { version = "=0.139.0", features = ["jsdoc"] }
oxc_span = { version = "=0.139.0" }
oxc_syntax = { version = "=0.139.0" }
oxc_resolver = { version = "=11.23.0" }

serde_json = { workspace = true }
tracing = "0.1"

[dev-dependencies]
# Tests parse literal TypeScript source strings in-process.
oxc_allocator = { version = "=0.139.0" }
oxc_parser = { version = "=0.139.0" }
oxc_semantic = { version = "=0.139.0", features = ["jsdoc"] }
oxc_span = { version = "=0.139.0" }
