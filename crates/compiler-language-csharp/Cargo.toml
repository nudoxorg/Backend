# Typed offline decoder and bounded tool probe for the Roslyn oracle.
# Vendor files remain byte-exact inputs and are not compiled by this crate.
# Tests replay the committed producer fixtures, and regenerate them
# byte-exactly whenever a dotnet toolchain is present.
[package]
name = "compiler-languages-csharp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
compiler-vocabulary = { path = "../compiler-vocabulary" }
serde.workspace = true
serde_json.workspace = true
sha2 = "=0.10.9"
thiserror.workspace = true

[lib]
path = "lib.rs"
