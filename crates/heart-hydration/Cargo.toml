# Defines the `heart-hydration` package and its explicit dependency boundary.
# The crate exists to plan and verify borrowed object hydration without weakening generation authority.
# Workspace policy supplies shared versions, lints, and release behavior.
[package]
name = "heart-hydration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
backend-version = { path = "../version" }
heart-root = { path = "../heart-root" }
backend-store = { path = "../store" }
thiserror.workspace = true
zerocopy.workspace = true

[dev-dependencies]
rstest.workspace = true
trybuild.workspace = true

[lints]
workspace = true

[lib]
path = "lib.rs"
